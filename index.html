<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Personales</title>
<style>
  /* ============================================================
     Sistema visual · libreta contable
     Dos bolsas de dinero, un solo patrimonio.
     ============================================================ */
  :root{
    /* superficie: papel cálido, no gris azulado de dashboard */
    --paper:#F4F2ED; --surface:#FFFFFF; --surface-2:#FAF9F5;
    --ink:#12211F; --muted:#6E7B78; --faint:#98A5A2;
    --line:#E4E0D8; --line-2:#EFECE6;
    /* tinta principal: verde pino profundo */
    --deep:#0E3B34; --deep-2:#17554B; --deep-3:#092A25;
    /* semánticos */
    --in:#0B7A4F;   --in-bg:#E9F4EE;
    --out:#B23A1E;  --out-bg:#FBEDE8;
    --save:#2B5FA8; --save-bg:#EAF1F9;
    --back:#A6741A; --back-bg:#FBF2E0;
    --gold:#C9A227;
    /* alias heredados: el JS ya usa estos nombres */
    --bg:var(--paper); --navy:var(--deep); --line2:var(--line-2);
    --green:var(--in); --green-bg:var(--in-bg);
    --red:var(--out); --red-bg:var(--out-bg);
    --blue:var(--save); --blue-bg:var(--save-bg);
    --amber:var(--back); --amber-bg:var(--back-bg);
    /* tipografía */
    --display:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
    --body:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    /* profundidad */
    --sh-1:0 1px 2px rgba(18,33,31,.05);
    --sh-2:0 1px 3px rgba(18,33,31,.06),0 10px 26px -14px rgba(18,33,31,.22);
    --sh-3:0 24px 60px -24px rgba(18,33,31,.38);
    --shadow:var(--sh-2);
    --r:14px; --r-sm:10px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--body);background:var(--paper);color:var(--ink);
    line-height:1.5;-webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;padding-bottom:40px;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1;letter-spacing:-.01em}
  h1,h2,h3{font-family:var(--display);font-weight:600;letter-spacing:-.012em;line-height:1.25}
  .eyebrow{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:700}
  :focus-visible{outline:2px solid var(--save);outline-offset:2px;border-radius:4px}
  @media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

  /* ---------- barra superior ---------- */
  header{
    background:linear-gradient(165deg,var(--deep) 0%,var(--deep-3) 100%);
    color:#fff;padding:14px 20px;position:sticky;top:0;z-index:20;
    box-shadow:0 1px 0 rgba(255,255,255,.06) inset;
  }
  .hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:2px}
  .brand h1{color:#fff;font-size:20px;font-weight:600;letter-spacing:-.015em}
  .brand .dot{color:var(--gold);font-size:20px;padding:0 3px}
  .yearsel{display:flex;align-items:center;gap:9px}
  .yearsel label{font-size:11px;color:rgba(255,255,255,.62);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
  .yearsel select{
    background:rgba(255,255,255,.10);color:#fff;border:1px solid rgba(255,255,255,.2);
    border-radius:999px;padding:6px 12px;font:inherit;font-size:13.5px;font-weight:600;
  }
  .yearsel select option{color:#12211F}

  /* ---------- pestañas ---------- */
  /* Barra de navegación: arriba, en flujo normal. Sin position:fixed, que en
     algunos navegadores móviles expandía la barra sobre toda la pantalla. */
  nav{background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:15}
  .nwrap{max-width:1080px;margin:0 auto;display:flex;gap:6px;padding:8px 10px;overflow-x:auto;scrollbar-width:none}
  .nwrap::-webkit-scrollbar{display:none}
  .tab{
    flex:1 1 0;min-width:0;display:block;padding:8px 6px;border:1px solid transparent;
    background:none;border-radius:12px;font:inherit;color:var(--muted);cursor:pointer;
    text-align:center;line-height:1.25;
  }
  .tab .ti{display:block;font-size:17px}
  .tab .tl{display:block;font-size:10.5px;font-weight:700;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tab.active{color:#fff;background:var(--deep);border-color:var(--deep)}
  @media(min-width:721px){
    .tab{flex:0 0 auto;padding:8px 18px;border-radius:999px}
    .tab .ti{display:inline;font-size:14px;margin-right:6px}
    .tab .tl{display:inline;font-size:13.5px}
  }
  main{max-width:1080px;margin:0 auto;padding:22px 16px}
  .view{display:none}
  .view.active{display:block}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- panel del mes en curso ---------- */
  .mesnow{background:linear-gradient(165deg,var(--deep) 0%,var(--deep-3) 100%);color:#fff;border-radius:18px;padding:18px 20px;margin-bottom:16px;box-shadow:var(--sh-2)}
  .mesnow-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:16px}
  .mesnow .eyebrow{color:rgba(255,255,255,.6)}
  .mesnow-t{display:block;font-family:var(--display);font-size:21px;font-weight:600;margin-top:3px;letter-spacing:-.015em}
  .mesnow-dia{font-size:11px;color:rgba(255,255,255,.58);background:rgba(255,255,255,.1);padding:4px 10px;border-radius:999px;white-space:nowrap;font-weight:600}
  .mesnow-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .mn-l{display:block;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.55);font-weight:700}
  .mn-v{display:block;font-size:18px;font-weight:700;margin-top:4px;letter-spacing:-.024em;filter:brightness(1.65)}
  .mesnow-pie{font-size:12px;color:rgba(255,255,255,.72);margin-top:14px;padding-top:12px;border-top:1px solid rgba(255,255,255,.14);line-height:1.5}
  .mesnow-pie strong{color:#fff}
  .mesnow-vacio{font-size:13px;color:rgba(255,255,255,.7)}
  .mesnow-acc{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .mesnow-acc .btn{background:rgba(255,255,255,.14);color:#fff;border-color:rgba(255,255,255,.2)}
  .mesnow-acc .btn:hover{background:rgba(255,255,255,.22)}
  .mesnow-sello{font-size:11.5px;color:#9FE8C4;font-weight:700;margin-top:13px}
  @media(max-width:420px){ .mn-v{font-size:15px} .mesnow-acc .btn{flex:1} }
  /* ---------- LIBRETA: las dos bolsas (elemento distintivo) ---------- */
  .ledger{
    background:var(--surface);border:1px solid var(--line);border-radius:18px;
    box-shadow:var(--sh-2);margin-bottom:18px;overflow:hidden;position:relative;
  }
  .ledger::before{
    content:"";position:absolute;inset:0 0 auto 0;height:3px;
    background:linear-gradient(90deg,var(--in) 0%,var(--in) 50%,var(--save) 50%,var(--save) 100%);
  }
  .ledger-head{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;
    padding:16px 20px 13px;border-bottom:1px dashed var(--line);background:var(--surface-2);
  }
  .ledger-head .tot{font-family:var(--display);font-size:20px;font-weight:600;letter-spacing:-.02em}
  .ledger-body{display:grid;grid-template-columns:1fr 1fr;position:relative}
  .pot{padding:20px 20px 18px;position:relative}
  .pot+.pot{border-left:1px solid var(--line)}
  .pot-label{display:block;font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--muted)}
  .pot-value{display:block;font-size:29px;font-weight:700;letter-spacing:-.028em;margin-top:7px;line-height:1.1}
  .pot.disp .pot-value{color:var(--in)}
  .pot.aho .pot-value{color:var(--save)}
  .pot-note{display:block;font-size:12px;color:var(--muted);margin-top:9px;max-width:30ch}
  /* nexo entre las dos bolsas: los traslados mueven plata sin cambiar el total */
  .pot-link{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:38px;height:38px;border-radius:50%;background:var(--surface);
    border:1px solid var(--line);display:flex;align-items:center;justify-content:center;
    font-size:16px;color:var(--muted);box-shadow:var(--sh-1);z-index:2;
  }
  .ledger-foot{
    display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    padding:12px 20px;border-top:1px solid var(--line-2);background:var(--surface-2);
  }
  .ledger-foot .hint{font-size:11.5px;color:var(--faint);margin-left:auto}

  /* ---------- indicadores del año ---------- */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:14px 15px;box-shadow:var(--sh-1)}
  .kpi .eyebrow{font-size:9.5px;line-height:1.4}
  .kpi .v{font-size:19px;font-weight:700;margin-top:7px;letter-spacing:-.022em}
  .v.green{color:var(--in)}.v.red{color:var(--out)}.v.blue{color:var(--save)}.v.navy{color:var(--deep)}

  /* ---------- tarjetas ---------- */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--sh-1);margin-bottom:16px}
  .card h2{font-size:17.5px;margin-bottom:3px}
  .card .cap{font-size:12.5px;color:var(--muted);margin-bottom:15px;max-width:72ch}

  /* ---------- tablas ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line-2)}
  th:first-child,td:first-child{text-align:left}
  thead th{
    font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);
    font-weight:700;border-bottom:1px solid var(--line);padding-bottom:8px;
  }
  tbody tr{transition:background .12s ease}
  tbody tr:hover{background:var(--surface-2)}
  tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none;background:var(--surface-2)}
  .neg{color:var(--out)}
  .muted{color:var(--muted)}

  /* ---------- barras de categoría ---------- */
  .catrow{display:grid;grid-template-columns:132px 1fr 96px;align-items:center;gap:12px;padding:7px 0;font-size:13px}
  .bartrack{background:var(--line-2);border-radius:999px;height:9px;overflow:hidden}
  .barfill{height:100%;background:linear-gradient(90deg,#C9553A,var(--out));border-radius:999px}
  .catrow .amt{text-align:right;font-weight:600}

  /* ---------- formularios ---------- */
  .form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end}
  .field{display:flex;flex-direction:column;gap:6px}
  .field.wide{grid-column:span 2}
  label.fl{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.045em;text-transform:uppercase}
  input,select,textarea{
    font-family:inherit;font-size:15px;padding:10px 12px;border:1px solid var(--line);
    border-radius:var(--r-sm);background:var(--surface);color:var(--ink);width:100%;
    transition:border-color .15s ease,box-shadow .15s ease;
  }
  input:focus,select:focus,textarea:focus{
    outline:none;border-color:var(--deep-2);box-shadow:0 0 0 3px rgba(23,85,75,.13);
  }
  input::placeholder{color:var(--faint)}
  .btn{
    font-family:inherit;font-size:14px;font-weight:600;padding:10px 18px;border-radius:var(--r-sm);
    border:1px solid transparent;cursor:pointer;background:var(--deep);color:#fff;
    transition:background .16s ease,transform .08s ease,box-shadow .16s ease;
  }
  .btn:hover{background:var(--deep-2)}
  .btn:active{transform:translateY(1px)}
  .btn.sec{background:var(--surface);color:var(--deep);border-color:var(--line)}
  .btn.sec:hover{background:var(--surface-2);border-color:#D5D0C6}
  .btn.danger{background:var(--surface);color:var(--out);border-color:#EFCDC3}
  .btn.danger:hover{background:var(--out-bg)}
  .btn.sm{padding:6px 11px;font-size:12.5px;border-radius:8px}

  /* ---------- etiquetas de tipo ---------- */
  .pill{display:inline-block;padding:3px 10px;border-radius:999px;font-size:11px;font-weight:700;letter-spacing:.015em;white-space:nowrap}
  .pill.ing{background:var(--in-bg);color:var(--in)}
  .pill.gas{background:var(--out-bg);color:var(--out)}
  .pill.aho{background:var(--save-bg);color:var(--save)}
  .pill.ret{background:var(--back-bg);color:var(--back)}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
  .filters .field{min-width:132px}
  .fsum{
    font-size:12.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line-2);
    border-radius:var(--r-sm);padding:9px 13px;margin-bottom:12px;
  }
  .fsum strong,.fsum b{color:var(--ink);font-weight:700}
  .empty{text-align:center;color:var(--muted);padding:36px 12px;font-size:14px}

  /* ---------- matriz del cierre ---------- */
  .matrix-wrap{overflow-x:auto;border-radius:var(--r-sm);border:1px solid var(--line-2)}
  .matrix{min-width:820px;font-size:12.5px}
  .matrix th,.matrix td{padding:7px 9px}
  .matrix td.mono{color:var(--faint)}
  .matrix .totrow td{background:var(--out-bg);font-weight:700;color:var(--out)}
  .matrix .cierre td{background:var(--surface-2)}
  .matrix .res td{background:var(--deep);color:#fff;font-weight:700}

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .catlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{
    display:inline-flex;align-items:center;gap:5px;background:var(--surface-2);
    border:1px solid var(--line);border-radius:999px;padding:5px 7px 5px 13px;font-size:12.5px;
  }
  .chip button{border:none;background:none;color:var(--faint);cursor:pointer;font-size:14px;line-height:1;padding:0 3px;border-radius:50%}
  .chip button.ren:hover{color:var(--save)}
  .chip button.del:hover{color:var(--out)}
  .chip-n{background:var(--line-2);color:var(--muted);border-radius:999px;padding:1px 7px;font-size:10.5px;font-weight:700;margin-left:2px}
  .addcat{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .addcat input{flex:1;min-width:180px}

  /* ---------- superposiciones ---------- */
  .visor{position:fixed;inset:0;background:rgba(9,42,37,.62);backdrop-filter:blur(3px);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
  .visor.show{display:flex;animation:fadein .2s ease}
  @keyframes fadein{from{opacity:0}to{opacity:1}}
  .visor-box{background:var(--surface);border-radius:16px;max-width:720px;width:100%;padding:18px;box-shadow:var(--sh-3);margin:auto}
  .visor-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:14px}
  .visor-top h3{margin:0;font-size:15.5px;line-height:1.45}
  .vitem{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px;margin-bottom:12px;overflow:auto}
  .vhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
  .vpdf{width:100%;height:66vh;border:1px solid var(--line-2);border-radius:8px;display:block;background:#fff}
  .vpdf-alt{margin-top:8px}
  @media(max-width:720px){ .vpdf{height:52vh} }
  .vimg{width:100%;border-radius:8px;border:1px solid var(--line-2);display:block;cursor:zoom-in}
  .vimg.zoom{width:auto;max-width:none;cursor:zoom-out}

  /* ---------- aviso de duplicado ---------- */
  .dup-intro{font-size:13px;color:var(--muted);margin-bottom:14px;line-height:1.5}
  .dup-sub{font-size:12px;color:var(--muted);margin-top:3px}
  .dup-item{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:9px;background:var(--surface-2);position:relative}
  .dup-item.nuevo{border-color:var(--back);background:var(--back-bg)}
  .dup-tag{display:block;font-size:9.5px;letter-spacing:.11em;text-transform:uppercase;font-weight:700;color:var(--muted);margin-bottom:5px}
  .dup-item.nuevo .dup-tag{color:var(--back)}
  .dup-line{font-size:14px;color:var(--ink)}
  .dup-line strong{font-weight:700}
  /* ---------- editor de movimiento ---------- */
  .modal{position:fixed;inset:0;background:rgba(9,42,37,.62);backdrop-filter:blur(3px);z-index:70;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
  .modal.show{display:flex;animation:fadein .2s ease}
  .modal-box{background:var(--surface);border-radius:16px;max-width:560px;width:100%;box-shadow:var(--sh-3);margin:auto;overflow:hidden}
  .modal-top{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line);background:var(--surface-2)}
  .modal-top h3{font-size:16.5px}
  .modal-body{padding:18px;display:grid;grid-template-columns:1fr 1fr;gap:13px}
  .modal-body .full{grid-column:1/-1}
  .modal-foot{display:flex;gap:9px;justify-content:flex-end;padding:14px 18px;border-top:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
  .modal-foot .left{margin-right:auto}

  @media print{ .visor,.toast,.modal{display:none!important} }
  .toast{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(22px);
    background:var(--deep-3);color:#fff;padding:13px 20px;border-radius:12px;font-size:13.5px;
    box-shadow:var(--sh-3);opacity:0;pointer-events:none;transition:.26s cubic-bezier(.2,.7,.3,1);
    z-index:80;max-width:90vw;text-align:center;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .savings-note{
    font-size:12px;color:var(--muted);background:var(--save-bg);border:1px solid #D3E0F1;
    border-left:3px solid var(--save);border-radius:var(--r-sm);padding:11px 13px;margin-top:13px;
  }
  .errbox{background:var(--out-bg);border:1px solid #EFC5B8;border-radius:8px;padding:11px 13px;font-size:12px;color:var(--out);white-space:pre-wrap;word-break:break-word;font-family:ui-monospace,monospace;margin-top:10px}
  .verfoot{text-align:center;font-size:11.5px;color:var(--faint);padding:18px 0 4px;letter-spacing:.02em}
  .verfoot strong{color:var(--muted)}

  /* ---------- saldos en vivo (pestaña Movimientos) ---------- */
  .saldos-live{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
  .sl{
    border-radius:var(--r-sm);padding:12px 14px;border:1px solid var(--line);
    background:var(--surface);box-shadow:var(--sh-1);border-left-width:3px;
  }
  .sl.disp{border-left-color:var(--in)}
  .sl.aho{border-left-color:var(--save)}
  .sl-t{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:700}
  .sl-v{display:block;font-size:19px;font-weight:700;color:var(--ink);margin-top:4px;letter-spacing:-.024em}

  /* ---------- auditoría ---------- */
  .aud-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:15px 0 12px}
  .aud-tag{font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:999px}
  .aud-tag.ok{background:var(--in-bg);color:var(--in)}
  .aud-tag.warn{background:var(--back-bg);color:var(--back)}
  .aud-tag.err{background:var(--out-bg);color:var(--out)}
  .aud-row{display:flex;gap:11px;padding:10px 12px;border:1px solid var(--line-2);border-radius:var(--r-sm);margin-bottom:6px;align-items:flex-start;background:var(--surface)}
  .aud-row.warn{border-color:#E8D3A4;background:var(--back-bg)}
  .aud-row.err{border-color:#EFC5B8;background:var(--out-bg)}
  .aud-ico{font-size:14px;line-height:1.45;flex:none}
  .aud-txt{flex:1;min-width:0}
  .aud-t{font-size:13px;font-weight:700;color:var(--ink);display:block}
  .aud-d{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word;display:block}
  .aud-d b{color:var(--ink)}

  /* ---------- botón de sincronía ---------- */
  .syncbtn{
    background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.22);color:#fff;
    font:inherit;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;cursor:pointer;
    margin-right:8px;white-space:nowrap;line-height:1.2;transition:background .16s ease;
  }
  .syncbtn:hover{background:rgba(255,255,255,.18)}
  .syncbtn.ok{background:rgba(34,197,94,.24);border-color:rgba(34,197,94,.48)}
  .syncbtn.err{background:rgba(239,68,68,.26);border-color:rgba(239,68,68,.55)}
  .syncbtn.work{opacity:.65}

<script>
"use strict";
/* ---------- utilidades ---------- */
var CLP = new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
function money(n){ return CLP.format(Math.round(n||0)); }
function pct(n){ return (Math.round((n||0)*1000)/10).toString().replace('.',',')+'%'; }
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var MESES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
/* FIX: usa la fecha LOCAL del dispositivo (Chile), no UTC.
   Antes, después de las 20:00 hora chilena toISOString() ya marcaba el día siguiente
   y el movimiento se registraba en el mes equivocado. */
function isoLocal(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function todayISO(){ return isoLocal(new Date()); }
function fechaValida(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return false;
  var a=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10);
  if(a<1900||a>2200||m<1||m>12||d<1||d>31) return false;
  var t=new Date(a,m-1,d);
  return t.getFullYear()===a && t.getMonth()===m-1 && t.getDate()===d;
}
/* Limpia lo escrito: quita espacios sobrantes y parte con mayúscula.
   La corrección ortográfica en sí la hace el teclado del teléfono mediante
   spellcheck/autocorrect en los campos de texto. */
function limpiarTexto(t){
  t=String(t==null?'':t).replace(/\s+/g,' ').trim();
  if(!t) return '';
  return t.charAt(0).toUpperCase()+t.slice(1);
}
/* Acepta montos escritos a la chilena: "3.500", "3 500", "$3.500", "3.500,50". */
function parseMonto(v){
  var t=String(v==null?'':v).replace(/[^0-9.,-]/g,'');
  var coma=t.lastIndexOf(','), punto=t.lastIndexOf('.');
  var dec=Math.max(coma,punto), ent=t, frac='';
  if(dec>-1 && t.length-dec-1<=2){ ent=t.slice(0,dec); frac=t.slice(dec+1); }
  ent=ent.replace(/[^0-9-]/g,'');
  var n=parseFloat(ent+(frac?'.'+frac:''));
  return isFinite(n)?Math.round(n):NaN;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- estado por defecto (tus datos actuales) ---------- */
var DEFAULT = {
  year: 2026,
  saldoInicialAhorrado: 3515567,
  saldoInicialDisponible: 43765,
  categorias: {
    ingreso: ["Sueldo","Honorarios","Bono / Aguinaldo","Arriendo recibido","Intereses / Dividendos","Devolución impuestos","Venta","Regalo / Transferencia recibida","Reembolso","Otros ingresos"],
    gasto: ["Arriendo / Dividendo","Gastos comunes","Luz","Agua","Gas","Internet hogar","Teléfono","TV cable","Supermercado","Transporte","Bencina","Salud","Educación","Restaurant / Delivery","Entretención","Compras","Suscripciones","Tarjeta de crédito","Créditos / Deudas","Mascotas","Regalos","Impuestos","Otros gastos"],
    ahorro: ["Cuenta de ahorro","Depósito a plazo","Fondo mutuo","APV","Ahorro emergencias","Ahorro vivienda","Otros ahorros"]
  },
  medios: ["Efectivo","Débito","Crédito","Transferencia","Cheque"],
  movimientos: [
    /* FIX: IDs fijos (antes eran uid() nuevos en cada carga, lo que creaba
       movimientos duplicados en la planilla cada vez que se abría la app
       en un navegador nuevo o después de "Restablecer todo"). */
    {id:"seed_1", fecha:"2026-07-21", tipo:"Ingreso", categoria:"Sueldo", descripcion:"Sueldo restante del mes de junio", medio:"Débito", monto:3417},
    {id:"seed_2", fecha:"2026-07-21", tipo:"Ingreso", categoria:"Otros ingresos", descripcion:"Depósito APV Capital", medio:"Transferencia", monto:42763},
    {id:"seed_3", fecha:"2026-07-21", tipo:"Gasto", categoria:"Compras", descripcion:"Compra de desayuno", medio:"Débito", monto:2500}
  ],
  cierres: [],           // actas de cierre mensual firmadas
  borrados: [],          // lápidas: {id, actualizado} de movimientos eliminados
  configActualizado: 0,  // timestamp de la última edición de saldos/categorías/medios
  _esNuevo: true         // instalación recién estrenada: aún no tiene datos propios
};

var TIPOS=["Ingreso","Gasto","Ahorro","Retiro ahorro","Cuenta corriente a cuenta de ahorro","Cuenta de ahorro a cuenta corriente","Interés del ahorro","Comisión del ahorro"];
function esDeposito(t){ return t==='Ahorro'||t==='Traspaso a ahorro'||t==='Cuenta corriente a cuenta de ahorro'; }
/* Plata que nace o muere DENTRO de la cuenta de ahorro: intereses, reajustes,
   comisiones. No pasan por el sueldo disponible, por eso no son traslados. */
function esIngresoAhorro(t){ return t==='Interés del ahorro'||t==='Interes del ahorro'; }
function esGastoAhorro(t){ return t==='Comisión del ahorro'||t==='Comision del ahorro'; }
function esRetiro(t){ return t==='Retiro ahorro'||t==='Traspaso a disponible'||t==='Cuenta de ahorro a cuenta corriente'; }
var APP_VERSION="3.5", APP_FECHA="03-08-2026";
var KEY="finanzas_personales_v1";
var state=load();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var s=JSON.parse(raw); return normalize(s); }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function normalize(s){
  s=s||{};
  s.year=s.year||2026;
  s.saldoInicialAhorrado=+s.saldoInicialAhorrado||0;
  s.saldoInicialDisponible=+s.saldoInicialDisponible||0;
  s.categorias=s.categorias||{}; 
  s.categorias.ingreso=s.categorias.ingreso||DEFAULT.categorias.ingreso.slice();
  s.categorias.gasto=s.categorias.gasto||DEFAULT.categorias.gasto.slice();
  s.categorias.ahorro=s.categorias.ahorro||DEFAULT.categorias.ahorro.slice();
  s.medios=s.medios||DEFAULT.medios.slice();
  s.movimientos=s.movimientos||[];
  s.borrados=s.borrados||[];
  s.cierres=Array.isArray(s.cierres)?s.cierres:[];
  s.configActualizado=+s.configActualizado||0;
  var base=s.configActualizado;
  if(!s.cfgTs||typeof s.cfgTs!=='object') s.cfgTs={};
  ['disp','aho','cats','med','cierres'].forEach(function(k){ s.cfgTs[k]=+s.cfgTs[k]||base; });
  s._esNuevo=!!s._esNuevo;
  s.avisoDuplicado=(s.avisoDuplicado==='amplio')?'amplio':'exacto';
  s.ultimoRespaldo=+s.ultimoRespaldo||0;
  s.movimientos.forEach(function(m){
    if(m.adj && !m.adjs){ m.adjs=[{aid:m.id,nombre:m.adj.nombre,mime:m.adj.mime,kb:m.adj.kb||0}]; delete m.adj; }
    if(!m.adjs) m.adjs=[];
    if(m.actualizado===undefined) m.actualizado=0;
  });
  return s;
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
  if(typeof syncProgramar==='function') syncProgramar();
}
/* marca que la configuración (saldos, categorías, medios) cambió en este dispositivo */
/* FIX: antes la configuración viajaba como un bloque único con una sola marca
   de tiempo. Si ajustabas el saldo en el teléfono y después agregabas una
   categoría en la tablet, la config completa de la tablet ganaba y devolvía el
   saldo a su valor anterior. Ahora cada campo lleva su propia marca y solo se
   reemplaza el campo que realmente cambió. */
var CFG_CAMPOS=['disp','aho','cats','med','cierres'];
/* Blindaje: si el reloj del aparato está adelantado, sus marcas ganarían
   siempre. Se acota a un minuto por encima de la marca más alta conocida. */
function ahoraSeguro(){
  var t=Date.now(), max=0;
  (state.movimientos||[]).forEach(function(m){ if(+m.actualizado>max) max=+m.actualizado; });
  CFG_CAMPOS.forEach(function(k){ var v=+(state.cfgTs||{})[k]||0; if(v>max) max=v; });
  return (max>t+86400000) ? max+60000 : t;
}
function marcarConfig(campo){
  var t=ahoraSeguro();
  if(!state.cfgTs) state.cfgTs={};
  (campo?[campo]:CFG_CAMPOS).forEach(function(k){ state.cfgTs[k]=t; });
  state.configActualizado=t;
  marcarUsado();
}
/* FIX: en cuanto el usuario toca algo, este dispositivo deja de ser "recién
   instalado" y ya puede subir sus movimientos a la planilla. Mientras siga
   siendo nuevo, solo descarga: así los 3 movimientos de ejemplo nunca se suben. */
function marcarUsado(){ state._esNuevo=false; }
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1900);
}

/* ---------- cálculos ---------- */
function catsForTipo(tipo){
  if(tipo==='Ingreso') return state.categorias.ingreso;
  if(tipo==='Gasto') return state.categorias.gasto;
  return state.categorias.ahorro; // Ahorro y Retiro ahorro
}
function monthOf(m){ return +m.fecha.slice(5,7); }
function yearOf(m){ return +m.fecha.slice(0,4); }

function sumFilter(fn){ var t=0; state.movimientos.forEach(function(m){ if(fn(m)) t+=(+m.monto||0); }); return t; }

function calc(year){
  var ingMes=[],gasMes=[],ahoMes=[],dispMes=[];
  for(var i=1;i<=12;i++){
    var ing=sumFilter(function(m){return m.tipo==='Ingreso'&&yearOf(m)===year&&monthOf(m)===i;});
    var gas=sumFilter(function(m){return m.tipo==='Gasto'&&yearOf(m)===year&&monthOf(m)===i;});
    var dep=sumFilter(function(m){return esDeposito(m.tipo)&&yearOf(m)===year&&monthOf(m)===i;});
    var ret=sumFilter(function(m){return esRetiro(m.tipo)&&yearOf(m)===year&&monthOf(m)===i;});
    /* Intereses y comisiones del ahorro: son ingreso y gasto de verdad, pero
       ocurren dentro del ahorro y no pasan por el sueldo disponible. */
    var iAho=sumFilter(function(m){return esIngresoAhorro(m.tipo)&&yearOf(m)===year&&monthOf(m)===i;});
    var gAho=sumFilter(function(m){return esGastoAhorro(m.tipo)&&yearOf(m)===year&&monthOf(m)===i;});
    var ingT=ing+iAho, gasT=gas+gAho, ahoNeto=dep-ret+iAho-gAho;
    ingMes.push(ingT); gasMes.push(gasT); ahoMes.push(ahoNeto); dispMes.push(ingT-gasT-ahoNeto);
  }
  var ingAno=ingMes.reduce(function(a,b){return a+b;},0);
  var gasAno=gasMes.reduce(function(a,b){return a+b;},0);
  var ahoAno=ahoMes.reduce(function(a,b){return a+b;},0);
  var dispAno=ingAno-gasAno-ahoAno;
  // saldos reales (todo el historial)
  var saldoAhorro=state.saldoInicialAhorrado + sumFilter(function(m){return esDeposito(m.tipo);}) - sumFilter(function(m){return esRetiro(m.tipo);})
                  + sumFilter(function(m){return esIngresoAhorro(m.tipo);}) - sumFilter(function(m){return esGastoAhorro(m.tipo);});
  var saldoDisp=state.saldoInicialDisponible + sumFilter(function(m){return m.tipo==='Ingreso';}) - sumFilter(function(m){return m.tipo==='Gasto';}) - sumFilter(function(m){return esDeposito(m.tipo);}) + sumFilter(function(m){return esRetiro(m.tipo);});
  // ahorro acumulado por mes hasta hoy
  var hoy=new Date(); var acumInicio=state.saldoInicialAhorrado
    + sumFilter(function(m){return esDeposito(m.tipo)&&yearOf(m)<year;})
    - sumFilter(function(m){return esRetiro(m.tipo)&&yearOf(m)<year;})
    + sumFilter(function(m){return esIngresoAhorro(m.tipo)&&yearOf(m)<year;})
    - sumFilter(function(m){return esGastoAhorro(m.tipo)&&yearOf(m)<year;});
  var acum=[],run=acumInicio;
  for(var j=0;j<12;j++){
    run+=ahoMes[j];
    var esFuturo=new Date(year,j,1)>hoy;
    acum.push(esFuturo?null:run);
  }
  /* FIX: el pie de la columna "Ahorro acum." mostraba el saldo de TODO el
     historial. Ahora muestra el último saldo acumulado real del año elegido. */
  var acumFin=acumInicio;
  for(var k=0;k<12;k++){ if(acum[k]!=null) acumFin=acum[k]; }
  return {ingMes:ingMes,gasMes:gasMes,ahoMes:ahoMes,dispMes:dispMes,ingAno:ingAno,gasAno:gasAno,ahoAno:ahoAno,dispAno:dispAno,saldoAhorro:saldoAhorro,saldoDisp:saldoDisp,acum:acum,acumFin:acumFin};
}
function gastoPorCategoria(year){
  var map={};
  state.categorias.gasto.forEach(function(c){map[c]=0;});
  state.movimientos.forEach(function(m){
    if((m.tipo==='Gasto'||esGastoAhorro(m.tipo))&&yearOf(m)===year){ if(!(m.categoria in map)) map[m.categoria]=0; map[m.categoria]+=(+m.monto||0); }
  });
  return map;
}
function catGasto(m){ return (m.categoria&&String(m.categoria).trim())||'(sin categoría)'; }
function gastoCatMes(year){ // {cat:{mes:monto}}
  var res={};
  state.categorias.gasto.forEach(function(c){ res[c]={}; });
  state.movimientos.forEach(function(m){
    if((m.tipo==='Gasto'||esGastoAhorro(m.tipo))&&yearOf(m)===year){
      var cat=catGasto(m);
      if(!res[cat]) res[cat]={};
      var mm=monthOf(m); res[cat][mm]=(res[cat][mm]||0)+(+m.monto||0);
    }
  });
  return res;
}
/* FIX: la matriz del Cierre solo recorría las categorías vigentes en Ajustes.
   Si borrabas una categoría (o la sincronización la reemplazaba), sus gastos
   desaparecían de la matriz y del TOTAL GASTOS, pero seguían sumando en el
   Resumen y en el saldo. Ahora se incluyen también las categorías huérfanas. */
function catsGastoConDatos(cm){
  var lista=state.categorias.gasto.slice(), extras=[];
  Object.keys(cm).forEach(function(k){
    if(lista.indexOf(k)<0){
      var row=cm[k], tiene=false;
      for(var i=1;i<=12;i++){ if(row[i]) tiene=true; }
      if(tiene) extras.push(k);
    }
  });
  extras.sort();
  return {cats:lista.concat(extras), huerfanas:extras};
}

  var acta=cierreDe(a,m);
  var dias=new Date(a,m,0).getDate(), diaHoy=hoy.getDate();
  var ritmo=diaHoy>0?Math.round(d.gas/diaHoy):0;

   + '<div class="mesnow-head">'

   +   '<span class="mesnow-dia">día '+diaHoy+' de '+dias+'</span>'
   + '</div>';
  if(!d.n){
    h+='<div class="mesnow-vacio">Aún no hay movimientos registrados este mes.</div>';
  } else {
    h+='<div class="mesnow-grid">'
     + '<div class="mn"><span class="mn-l">Entró</span><span class="mn-v num" style="color:var(--in)">'+verSaldo(d.ing)+'</span></div>'
     + '<div class="mn"><span class="mn-l">Salió</span><span class="mn-v num" style="color:var(--out)">'+verSaldo(d.gas)+'</span></div>'
     + '<div class="mn"><span class="mn-l">Al ahorro</span><span class="mn-v num" style="color:var(--save)">'+verSaldo(d.aho)+'</span></div>'
     + '</div>';
    if(!state.ocultarSaldos && diaHoy>=5 && d.gas>0){
      h+='<div class="mesnow-pie">Vas gastando '+money(ritmo)+' por día. A este ritmo el mes cerraría cerca de <strong>'+money(proy)+'</strong>.</div>';
    }

     + '<button class="btn sm" data-ira="movimientos">Registrar un movimiento</button>'
     + '<button class="btn sec sm" data-mesver="'+claveMes(a,m)+'">Ver los '+d.n+' del mes</button>'
     + '</div>';

  if(acta) h+='<div class="mesnow-sello">✓ Este mes ya tiene acta de cierre</div>';
  return h+'</section>';
}

function verSaldo(v){ return state.ocultarSaldos ? '$ ••••••' : money(v); }
function toggleOcultar(){ state.ocultarSaldos=!state.ocultarSaldos; save(); renderAll(); }
function ajustarSaldo(cual,actual){
  var nombre=cual==='disp'?'Sueldo disponible':'Ahorro';
  var v=prompt('Escribe el saldo REAL de "'+nombre+'" que tienes hoy (sin puntos ni signo $).\nActual según la app: '+money(actual),Math.round(actual));
  if(v===null) return;
  var nuevo=Math.round(+String(v).replace(/[^\d-]/g,''));
  if(isNaN(nuevo)){ toast('Monto no válido'); return; }
  var delta=nuevo-Math.round(actual);
  if(cual==='disp') state.saldoInicialDisponible+=delta; else state.saldoInicialAhorrado+=delta;
  /* FIX: sin marcarConfig() el ajuste viajaba con timestamp viejo y el otro
     dispositivo lo pisaba en la siguiente sincronización. */
  marcarConfig(cual==='disp'?'disp':'aho');
  save(); renderAll(); toast(nombre+' ajustado a '+money(nuevo));
}
function kpi(label,val,cls){
  return '<div class="kpi"><div class="eyebrow">'+esc(label)+'</div><div class="v '+cls+' num">'+val+'</div></div>';

/* ===== Comprobantes (IndexedDB) ===== */
var _adjdb=null;
function adjDB(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){ rej(new Error('sin soporte')); return; }
    if(_adjdb){ res(_adjdb); return; }
    var rq=indexedDB.open('finanzas_adjuntos',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('adj',{keyPath:'id'}); };
    rq.onsuccess=function(){ _adjdb=rq.result; res(_adjdb); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function adjPut(rec){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('adj','readwrite'); tx.objectStore('adj').put(rec); tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }); }
function adjGet(id){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var rq=db.transaction('adj').objectStore('adj').get(id); rq.onsuccess=function(){res(rq.result||null);}; rq.onerror=function(){rej(rq.error);}; }); }); }
function adjDel(id){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('adj','readwrite'); tx.objectStore('adj').delete(id); tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }); }
function adjAll(){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var rq=db.transaction('adj').objectStore('adj').getAll(); rq.onsuccess=function(){res(rq.result||[]);}; rq.onerror=function(){rej(rq.error);}; }); }); }
function adjClear(){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('adj','readwrite'); tx.objectStore('adj').clear(); tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }); }

var _adjTarget=null;
function pedirAdjunto(id){
  _adjTarget=id;
  var inp=document.getElementById('adj_file');
  if(!inp){
    inp=document.createElement('input'); inp.type='file'; inp.id='adj_file';
    inp.accept='image/*,application/pdf'; inp.style.display='none';
    inp.addEventListener('change',adjuntarArchivo);
    document.body.appendChild(inp);
  }
  inp.value=''; inp.click();
}
function adjuntarArchivo(e){
  var f=e.target.files[0]; if(!f||!_adjTarget) return;
  var id=_adjTarget; _adjTarget=null;
  if(f.type==='application/pdf'){
    if(f.size>4*1024*1024){ toast('PDF muy pesado (máx 4 MB)'); return; }
    var r=new FileReader();
    r.onload=function(){ guardarAdjunto(id,f.name,f.type,r.result); };
    r.readAsDataURL(f);
  } else if(f.type.indexOf('image/')===0){
    comprimirImagen(f,function(dataUrl){ guardarAdjunto(id,f.name.replace(/\.[^.]+$/,'')+'.jpg','image/jpeg',dataUrl); });
  } else { toast('Solo imágenes o PDF'); }
}
function comprimirImagen(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var MAX=1400, w=img.width, h=img.height;
      if(w>MAX||h>MAX){ var k=Math.min(MAX/w,MAX/h); w=Math.round(w*k); h=Math.round(h*k); }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=function(){ toast('No se pudo leer la imagen'); };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function guardarAdjunto(mid,nombre,mime,dataUrl){
  var kb=Math.round(dataUrl.length*3/4/1024);
  var aid=mid+'_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  adjPut({id:aid,mid:mid,nombre:nombre,mime:mime,data:dataUrl}).then(function(){
    var m=state.movimientos.find(function(x){return x.id===mid;});
    if(m){ m.adjs=m.adjs||[]; m.adjs.push({aid:aid,nombre:nombre,mime:mime,kb:kb}); save(); }
    renderMovimientos();
    if(_visorMid===mid) abrirVisor(mid);
    toast('Comprobante guardado ('+kb+' KB)');
  }).catch(function(){ toast('No se pudo guardar el comprobante'); });
}
function descargarAdjunto(aid){
  adjGet(aid).then(function(rec){
    if(!rec){ toast('Comprobante no encontrado en este dispositivo'); return; }
    var a=document.createElement('a'); a.href=rec.data; a.download=rec.nombre; a.click();
  }).catch(function(){ toast('No se pudo descargar'); });
}
function quitarAdjunto(mid,aid){
  if(!confirm('¿Quitar este comprobante? El movimiento no se borra.')) return;
  adjDel(aid).then(function(){
    var m=state.movimientos.find(function(x){return x.id===mid;});
    if(m){ m.adjs=(m.adjs||[]).filter(function(a){return a.aid!==aid;}); save(); }
    renderMovimientos();
    if(_visorMid===mid){ var mm=state.movimientos.find(function(x){return x.id===mid;}); if(mm&&mm.adjs.length) abrirVisor(mid); else cerrarVisor(); }
    toast('Comprobante quitado');
  });
}

/* ===== Visor de comprobantes ===== */
var _visorMid=null;
function abrirVisor(mid){
  _visorMid=mid;
  var m=state.movimientos.find(function(x){return x.id===mid;});
  if(!m) return;
  var ov=document.getElementById('visor');
  var body=document.getElementById('visor_body');

  document.getElementById('visor_sub').textContent=(m.adjs||[]).length+' comprobante'+((m.adjs||[]).length===1?'':'s')+' en este movimiento';
  body.innerHTML='<div class="cap">Cargando…</div>';
  ov.classList.add('show');
  Promise.all((m.adjs||[]).map(function(a){ return adjGet(a.aid).then(function(r){ return {a:a,r:r}; }); })).then(function(items){
    var html='';
    items.forEach(function(it,idx){
      var a=it.a, r=it.r;
      html+='<div class="vitem"><div class="vhead"><span>'+(idx+1)+'. '+esc(a.nombre)+' · '+(a.kb||0)+' KB</span>'
          + '<span class="row-actions"><button class="btn sec sm" title="Imprimir o guardar como PDF" data-vpr="'+a.aid+'">🖨</button><button class="btn sec sm" title="Descargar" data-vdl="'+a.aid+'">⬇</button><button class="btn danger sm" title="Quitar" data-vdel="'+a.aid+'">✕</button></span></div>';
      if(!r){ html+='<div class="cap">Este archivo ya no está en el dispositivo (quizá fue archivado).</div>'; }
      else if(r.mime==='application/pdf'){
        /* Los PDF ahora se ven dentro del visor. En los teléfonos que no traen
           lector integrado queda el botón para abrirlo aparte. */
        html+='<iframe class="vpdf" src="'+r.data+'#toolbar=0&view=FitH" title="'+esc(a.nombre)+'"></iframe>'
            + '<div class="vpdf-alt"><button class="btn sec sm" data-vabrir="'+a.aid+'">Abrir el PDF en pantalla completa</button></div>';
      }
      else { html+='<img class="vimg" src="'+r.data+'" alt="'+esc(a.nombre)+'">'; }
      html+='</div>';
    });
    if(!items.length) html='<div class="cap">Aún no hay comprobantes en este movimiento.</div>';
    body.innerHTML=html;
    body.querySelectorAll('[data-vdl]').forEach(function(b){b.addEventListener('click',function(){descargarAdjunto(b.getAttribute('data-vdl'));});});
    body.querySelectorAll('[data-vabrir]').forEach(function(b){b.addEventListener('click',function(){abrirAdjuntoAparte(b.getAttribute('data-vabrir'));});});
    body.querySelectorAll('[data-vpr]').forEach(function(b){b.addEventListener('click',function(){imprimirAdjunto(mid,b.getAttribute('data-vpr'));});});
    body.querySelectorAll('.vimg').forEach(function(im){ im.addEventListener('click',function(){ im.classList.toggle('zoom'); }); });
    body.querySelectorAll('[data-vdel]').forEach(function(b){b.addEventListener('click',function(){quitarAdjunto(mid,b.getAttribute('data-vdel'));});});
  });
}
/* Abre el archivo en una pestaña nueva mediante blob: los data: URL muy
   grandes son rechazados por varios navegadores móviles. */
function abrirAdjuntoAparte(aid){
  adjGet(aid).then(function(rec){
    if(!rec){ toast('Comprobante no disponible en este dispositivo'); return; }
    try{
      var bin=atob(String(rec.data).split(',')[1]||'');
      var bytes=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) bytes[i]=bin.charCodeAt(i);
      var url=URL.createObjectURL(new Blob([bytes],{type:rec.mime||'application/pdf'}));
      var w=window.open(url,'_blank');
      if(!w) toast('Permite las ventanas emergentes para verlo');
      setTimeout(function(){ URL.revokeObjectURL(url); },60000);
    }catch(e){ descargarAdjunto(aid); }
  });
}
function imprimirAdjunto(mid,aid){
  var m=state.movimientos.find(function(x){return x.id===mid;});
  adjGet(aid).then(function(rec){
    if(!rec){ toast('Comprobante no disponible en este dispositivo'); return; }
    if(rec.mime==='application/pdf'){ toast('Abriendo el PDF para imprimir…'); abrirAdjuntoAparte(aid); return; }
    var enc=m?('<div class="enc"><strong>'+fmtFecha(m.fecha)+'</strong> · '+esc(m.tipo)+' · '+esc(m.categoria)+' · <strong>'+money(m.monto)+'</strong>'
             +(m.descripcion?'<br>'+esc(m.descripcion):'')+(m.medio?'<br>Medio de pago: '+esc(m.medio):'')+'</div>'):'';
    var doc='<!DOCTYPE html><html><head><meta charset="utf-8"><title>Comprobante</title><style>'
      +'@page{margin:12mm}body{font-family:Arial,Helvetica,sans-serif;margin:0;color:#111}'
      +'.enc{font-size:13px;line-height:1.5;border-bottom:1px solid #999;padding-bottom:8px;margin-bottom:10px}'
      +'img{max-width:100%;display:block;margin:0 auto}'
      +'</style></head><body>'+enc+'<img src="'+rec.data+'"></body></html>';
    var ifr=document.getElementById('print_frame');
    if(ifr&&ifr.parentNode) ifr.parentNode.removeChild(ifr);
    ifr=document.createElement('iframe');
    ifr.id='print_frame';
    ifr.style.position='fixed'; ifr.style.right='0'; ifr.style.bottom='0';
    ifr.style.width='0'; ifr.style.height='0'; ifr.style.border='0';
    document.body.appendChild(ifr);
    ifr.onload=function(){
      try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }
      catch(e){
        var w=window.open('','_blank');
        if(w){ w.document.write(doc); w.document.close(); w.focus(); setTimeout(function(){ w.print(); },400); }
        else { toast('No se pudo abrir la impresión; usa ⬇ para descargar'); }
      }
    };
    ifr.srcdoc=doc;
  }).catch(function(){ toast('No se pudo preparar la impresión'); });
}

/* Ofrece las descripciones ya escritas antes, para no repetirlas de
   distintas formas ("bencina copec" / "Bencina Copec" / "vencina"). */
function listaDescripciones(){
  var vistas={}, out=[];
  state.movimientos.forEach(function(m){
    var d=(m.descripcion||'').trim();
    if(d && !vistas[d.toLowerCase()]){ vistas[d.toLowerCase()]=1; out.push(d); }
  });
  out.sort(function(a,b){ return a.localeCompare(b,'es'); });
  return '<datalist id="desc_prev">'+out.slice(0,300).map(function(d){
    return '<option value="'+esc(d)+'">';
  }).join('')+'</datalist>';
}
/* Todas las categorías en uso: las configuradas más las que quedaron en
   movimientos antiguos, para que ninguna quede fuera del filtro. */
function todasLasCategorias(){
  var vistas={}, out=[];
  (state.categorias.ingreso||[]).concat(state.categorias.gasto||[],state.categorias.ahorro||[])
    .forEach(function(c){ if(!vistas[c]){ vistas[c]=1; out.push(c); } });
  state.movimientos.forEach(function(m){
    var c=(m.categoria||'').trim();
    if(c && !vistas[c]){ vistas[c]=1; out.push(c); }
  });
  return out.sort(function(a,b){ return a.localeCompare(b,'es'); });
}
/* Cuánto suma lo que estás viendo con los filtros puestos. */
function resumenFiltro(list){
  if(!list.length) return '';
  var ing=0,gas=0,dep=0,ret=0;
  list.forEach(function(m){
    var v=+m.monto||0;
    if(m.tipo==='Ingreso'||esIngresoAhorro(m.tipo)) ing+=v;
    else if(m.tipo==='Gasto'||esGastoAhorro(m.tipo)) gas+=v;
    else if(esDeposito(m.tipo)) dep+=v; else if(esRetiro(m.tipo)) ret+=v;
  });
  var p=[];
  if(ing) p.push('Ingresos <b>'+money(ing)+'</b>');
  if(gas) p.push('Gastos <b>'+money(gas)+'</b>');
  if(dep) p.push('A ahorro <b>'+money(dep)+'</b>');
  if(ret) p.push('Desde ahorro <b>'+money(ret)+'</b>');
  return '<div class="fsum"><strong>'+list.length+'</strong> movimiento'+(list.length===1?'':'s')
       + (p.length?' · '+p.join(' · '):'')+'</div>';
}
function fld(label,inner,wide){ return '<div class="field'+(wide?' wide':'')+'"><label class="fl">'+label+'</label>'+inner+'</div>'; }
function fmtFecha(iso){ var p=iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function pill(t){ var cls = (t==='Ingreso'||esIngresoAhorro(t))?'ing' : (t==='Gasto'||esGastoAhorro(t))?'gas' : esDeposito(t)?'aho' : 'ret'; return '<span class="pill '+cls+'">'+t+'</span>'; }
function colorTipo(t){ return (t==='Ingreso'||esIngresoAhorro(t))?'var(--green)' : (t==='Gasto'||esGastoAhorro(t))?'var(--red)' : esDeposito(t)?'var(--blue)' : 'var(--amber)'; }

/* FIX: al registrar un traslado el aviso muestra cómo quedaron las dos bolsas,
   así se confirma en el acto que la plata se movió de una a otra. */
function mensajeSaldos(base,tipo){
  if(!esDeposito(tipo) && !esRetiro(tipo) && !esIngresoAhorro(tipo) && !esGastoAhorro(tipo)) return base;
  var c=calc(state.year);
  if(state.ocultarSaldos) return base+' · traslado aplicado a las dos cuentas';
  return base+' · Disponible '+money(c.saldoDisp)+' · Ahorro '+money(c.saldoAhorro);
}

/* Normaliza la descripción para comparar: sin mayúsculas, sin tildes y sin
   espacios de más. Así "Desayuno", "desayuno" y "DESAYUNO " son lo mismo. */
function normDesc(t){
  return String(t==null?'':t).toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/\s+/g,' ').trim();
}
/* La alerta se dispara cuando coinciden fecha, tipo, categoría, MONTO y
   DESCRIPCIÓN. Así "Desayuno $2.700" y "Almuerzo $2.700" del mismo día conviven
   sin molestar, pero "Desayuno $2.700" dos veces sí avisa. */
var _dupEtiqueta=null;
function modoAviso(){ return state.avisoDuplicado==='amplio'?'amplio':'exacto'; }
/* En modo "exacto" (por defecto) exige que coincida también la descripción.
   En modo "amplio" basta el mismo monto el mismo día, aunque el concepto
   sea otro: avisa más, pero no deja pasar nada.
   excluirId sirve al editar, para no compararse consigo mismo. */
function buscarParecido(nv,excluirId){
  var d=normDesc(nv.descripcion), amplio=(modoAviso()==='amplio');
  return state.movimientos.filter(function(m){
    if(excluirId && m.id===excluirId) return false;
    if(m.fecha!==nv.fecha || m.tipo!==nv.tipo) return false;
    if((+m.monto||0)!==nv.monto) return false;
    if(amplio) return true;
    return (m.categoria||'')===(nv.categoria||'') && normDesc(m.descripcion)===d;
  });
}
/* Cuenta los repetidos que ya existen guardados (para avisar tras sincronizar). */
function contarRepetidos(){
  var firmas={}, n=0, amplio=(modoAviso()==='amplio');
  state.movimientos.forEach(function(m){
    var f=amplio ? [m.fecha,m.tipo,m.monto].join('|')
                 : [m.fecha,m.tipo,m.categoria,m.monto,normDesc(m.descripcion)].join('|');
    if(firmas[f]) n++; else firmas[f]=1;
  });
  return n;
}
/* Mismo concepto y mismo día pero otro monto: no es duplicado, es un segundo
   consumo. Sirve para informar sin bloquear. */
function buscarMismoConcepto(nv){
  var d=normDesc(nv.descripcion);
  if(!d) return [];
  return state.movimientos.filter(function(m){
    return m.fecha===nv.fecha && m.tipo===nv.tipo
        && normDesc(m.descripcion)===d && (+m.monto||0)!==nv.monto;
  });
}
function addMov(){
  var nv={
    fecha:document.getElementById('f_fecha').value,
    tipo:document.getElementById('f_tipo').value,
    categoria:document.getElementById('f_cat').value,
    descripcion:limpiarTexto(document.getElementById('f_desc').value),
    medio:document.getElementById('f_medio').value,
    monto:parseMonto(document.getElementById('f_monto').value)
  };
  if(!fechaValida(nv.fecha)){ toast('Fecha no válida'); return; }
  if(!isFinite(nv.monto)||nv.monto<=0){ toast('Escribe un monto mayor a 0'); return; }
  var cerr=mesEstaCerrado(nv.fecha);
  if(cerr && !confirm(nombreMes(cerr.mes)+' está cerrado.\n\nSi agregas este movimiento, el acta ya no coincidirá con los movimientos reales. Conviene reabrir el mes, agregarlo y volver a cerrarlo.\n\n¿Agregar de todos modos?')) return;
  var iguales=buscarParecido(nv);
  if(iguales.length) avisarDuplicado(nv,iguales,function(){ guardarMov(nv); });
  else guardarMov(nv);
}
function guardarMov(nv){
  state.movimientos.push({id:uid(),fecha:nv.fecha,tipo:nv.tipo,categoria:nv.categoria,
    descripcion:nv.descripcion,medio:nv.medio,monto:nv.monto,adjs:[],actualizado:Date.now()});
  marcarUsado();
  save(); toast(mensajeSaldos('Movimiento agregado',nv.tipo)); renderAll();
}
/* Aviso antes de guardar: muestra lo que ya está registrado, lo que estás por
   agregar y el efecto exacto en el saldo si de verdad es una repetición. */
var _dupAccion=null;
function avisarDuplicado(nv,iguales,accion){
  _dupAccion=accion;
  var direccion = (nv.tipo==='Ingreso'||esRetiro(nv.tipo)||esIngresoAhorro(nv.tipo)) ? 'subiría' : 'bajaría';
  var cuenta = (nv.tipo==='Ingreso'||nv.tipo==='Gasto') ? 'tu sueldo disponible'
             : esDeposito(nv.tipo) ? 'tu disponible (y subiría tu ahorro)' : 'tu ahorro (y subiría tu disponible)';
  function fila(m,etq,clase){
    return '<div class="dup-item '+(clase||'')+'"><span class="dup-tag">'+etq+'</span>'
      + '<div class="dup-line"><strong>'+money(m.monto)+'</strong> · '+esc(m.tipo)+' · '+esc(m.categoria||'sin categoría')+'</div>'
      + '<div class="dup-sub">'+fmtFecha(m.fecha)+' · '+esc(m.medio||'—')
      + (m.descripcion?' · '+esc(m.descripcion):'')+'</div></div>';
  }
  var concepto=nv.descripcion?'"'+esc(nv.descripcion)+'"':'sin descripción';
  var h='<p class="dup-intro">Ya tienes '+(iguales.length===1?'un movimiento':iguales.length+' movimientos')
      + ' de <b>'+concepto+'</b> por <b>'+money(nv.monto)+'</b> el '+fmtFecha(nv.fecha)
      + '. Coincide todo: fecha, tipo, categoría, monto y descripción.</p>';
  iguales.slice(0,3).forEach(function(m){ h+=fila(m,'Ya registrado'); });
  if(iguales.length>3) h+='<p class="dup-sub">…y '+(iguales.length-3)+' más.</p>';
  h+=fila(nv,_dupEtiqueta||'Por agregar','nuevo');
  h+='<div class="savings-note">Si lo agregas y resulta ser una repetición, '+cuenta+' '+direccion
   + ' <b>'+money(nv.monto)+'</b> de más y no vas a cuadrar con tu cartola.<br><br>'
   + '<b>¿Es un consumo distinto?</b> Cambia la descripción (por ejemplo «Desayuno» y «Almuerzo») '
   + 'y quedan como dos movimientos separados sin este aviso.</div>';
  var otros=buscarMismoConcepto(nv);
  if(otros.length){
    h+='<p class="dup-sub" style="margin-top:10px">Nota: hoy ya registraste '+otros.length+' movimiento(s) '
     + 'de '+concepto+' por otro monto. Eso es normal si consumiste dos veces.</p>';
  }
  document.getElementById('dup_body').innerHTML=h;
  document.getElementById('dup_modal').classList.add('show');
}
function cerrarDuplicado(){ _dupAccion=null; document.getElementById('dup_modal').classList.remove('show'); }
function initDuplicado(){
  document.getElementById('dup_cancelar').addEventListener('click',cerrarDuplicado);
  document.getElementById('dup_cerrar').addEventListener('click',cerrarDuplicado);
  document.getElementById('dup_igual').addEventListener('click',function(){
    var f=_dupAccion; cerrarDuplicado(); if(f) f();
  });
  var ov=document.getElementById('dup_modal');
  ov.addEventListener('click',function(e){ if(e.target===ov) cerrarDuplicado(); });
}
function delMov(id){
  var _v=state.movimientos.find(function(m){return m.id===id;});
  if(_v){
    var _c=mesEstaCerrado(_v.fecha);
    if(_c && !confirm(nombreMes(_c.mes)+' está cerrado.\n\nSi borras este movimiento, el acta ya no coincidirá con los movimientos reales.\n\n¿Borrar igual?')) return;
  }
  if(!confirm('¿Borrar este movimiento?')) return;
  var _victim=state.movimientos.find(function(m){return m.id===id;});
  try{ ((_victim&&_victim.adjs)||[]).forEach(function(a){ adjDel(a.aid); }); }catch(e){}
  state.movimientos=state.movimientos.filter(function(m){return m.id!==id;});
  state.borrados=state.borrados||[];
  state.borrados.push({id:id, actualizado:Date.now()});
  marcarUsado();
  save(); toast(mensajeSaldos('Movimiento borrado',_victim&&_victim.tipo)); renderAll();
}
var _editId=null;
function editMov(id){
  var m=state.movimientos.find(function(x){return x.id===id;}); if(!m) return;
  _editId=id;
  document.getElementById('ed_fecha').value=m.fecha||todayISO();
  var st=document.getElementById('ed_tipo');
  st.innerHTML=TIPOS.map(function(t){return '<option'+(t===m.tipo?' selected':'')+'>'+esc(t)+'</option>';}).join('');
  if(TIPOS.indexOf(m.tipo)<0) st.innerHTML='<option selected>'+esc(m.tipo||'')+'</option>'+st.innerHTML;
  edCats(m.categoria);
  var sm=document.getElementById('ed_medio');
  sm.innerHTML=state.medios.map(function(t){return '<option'+(t===m.medio?' selected':'')+'>'+esc(t)+'</option>';}).join('');
  if(state.medios.indexOf(m.medio)<0 && m.medio) sm.innerHTML='<option selected>'+esc(m.medio)+'</option>'+sm.innerHTML;
  document.getElementById('ed_desc').value=m.descripcion||'';
  document.getElementById('ed_monto').value=m.monto;
  document.getElementById('edit_modal').classList.add('show');
}
function edCats(sel){
  var tipo=document.getElementById('ed_tipo').value;
  var cats=catsForTipo(tipo).slice();
  if(sel && cats.indexOf(sel)<0) cats.unshift(sel);
  document.getElementById('ed_cat').innerHTML=cats.map(function(c){

function cerrarEditor(){ _editId=null; document.getElementById('edit_modal').classList.remove('show'); }
function guardarEditor(){
  var m=state.movimientos.find(function(x){return x.id===_editId;});
  if(!m){ cerrarEditor(); return; }
  var fecha=document.getElementById('ed_fecha').value;
  if(!fechaValida(fecha)){ toast('Elige una fecha válida'); return; }
  var monto=parseMonto(document.getElementById('ed_monto').value);
  if(!isFinite(monto)||monto<=0){ toast('Escribe un monto mayor a 0'); return; }
  var nv={fecha:fecha,tipo:document.getElementById('ed_tipo').value,
    categoria:document.getElementById('ed_cat').value,
    medio:document.getElementById('ed_medio').value,
    descripcion:limpiarTexto(document.getElementById('ed_desc').value),monto:monto};
  /* Editar también puede crear un duplicado: se avisa igual que al agregar. */
  var cerrA=mesEstaCerrado(m.fecha), cerrB=mesEstaCerrado(nv.fecha);
  var cerr=cerrA||cerrB;
  if(cerr && !confirm(nombreMes(cerr.mes)+' está cerrado.\n\nSi lo modificas, el acta ya no coincidirá con los movimientos reales.\n\n¿Continuar igual?')) return;
  var iguales=buscarParecido(nv,m.id);
  function aplicar(){
    m.fecha=nv.fecha; m.tipo=nv.tipo; m.categoria=nv.categoria;
    m.medio=nv.medio; m.descripcion=nv.descripcion; m.monto=nv.monto;
    m.actualizado=Date.now();
    marcarUsado();
    save(); cerrarEditor(); toast(mensajeSaldos('Movimiento actualizado',m.tipo)); renderAll();
  }
  if(iguales.length){ _dupEtiqueta='Quedaría así'; avisarDuplicado(nv,iguales,function(){ _dupEtiqueta=null; aplicar(); }); }
  else { _dupEtiqueta=null; aplicar(); }
}

/* Cuántos movimientos usan una categoría (para no borrarla a ciegas). */
function usosDeCategoria(c){
  return state.movimientos.filter(function(m){ return (m.categoria||'')===c; }).length;
}
function renderChips(kind){

      + '<button class="ren" data-k="'+kind+'" data-c="'+esc(c)+'" title="Renombrar">\u270E</button>'
      + '<button class="del" data-k="'+kind+'" data-c="'+esc(c)+'" title="Quitar">\u00D7</button></span>';
  }).join('');
  box.querySelectorAll('button.ren').forEach(function(b){
    b.addEventListener('click',function(){ renombrarCategoria(b.getAttribute('data-k'), b.getAttribute('data-c')); });
  });
  box.querySelectorAll('button.del').forEach(function(b){

  });

/* Renombrar arrastra consigo todos los movimientos que la usaban:
   antes cambiar el nombre dejaba esos movimientos huérfanos. */
function renombrarCategoria(k,c){
  var nuevo=limpiarTexto(prompt('Nuevo nombre para "'+c+'":', c)||'');
  if(!nuevo || nuevo===c) return;
  if(state.categorias[k].indexOf(nuevo)>=0 && nuevo!==c){
    if(!confirm('"'+nuevo+'" ya existe. ¿Fundir "'+c+'" dentro de ella?')) return;
    state.categorias[k]=state.categorias[k].filter(function(x){return x!==c;});
  } else {
    state.categorias[k]=state.categorias[k].map(function(x){ return x===c?nuevo:x; });
  }
  var n=0;
  state.movimientos.forEach(function(m){
    if((m.categoria||'')===c){ m.categoria=nuevo; m.actualizado=Date.now(); n++; }
  });
  marcarConfig('cats'); marcarUsado(); save(); renderAll();
  toast('Renombrada'+(n?' · '+n+' movimiento'+(n===1?'':'s')+' actualizado'+(n===1?'':'s'):''));
}
/* Quitar avisa si está en uso y deja reasignar esos movimientos,
   para que no desaparezcan de la matriz del Cierre. */
function quitarCategoria(k,c){
  var n=usosDeCategoria(c);
  if(n){
    var otras=state.categorias[k].filter(function(x){return x!==c;});
    var msg=n+' movimiento'+(n===1?'':'s')+' usa'+(n===1?'':'n')+' "'+c+'".\n\n'
      +'Escribe el nombre de la categoría a la que quieres pasarlos'
      +(otras.length?' (por ejemplo: '+otras.slice(0,4).join(', ')+')':'')
      +',\no deja el campo vacío para quitar la categoría igual y dejarlos sin clasificar.';
    var destino=prompt(msg,otras[0]||'');
    if(destino===null) return;
    destino=limpiarTexto(destino);
    if(destino){
      if(state.categorias[k].indexOf(destino)<0) state.categorias[k].push(destino);
      state.movimientos.forEach(function(m){
        if((m.categoria||'')===c){ m.categoria=destino; m.actualizado=Date.now(); }
      });
      toast(n+' movimiento'+(n===1?'':'s')+' pasado'+(n===1?'':'s')+' a "'+destino+'"');
    } else {
      if(!confirm('Los '+n+' movimientos quedarán sin categoría. Seguirán sumando en tus totales. ¿Continuar?')) return;
      toast('Categoría quitada · '+n+' movimiento'+(n===1?'':'s')+' sin clasificar');
    }
    marcarUsado();
  } else toast('Categoría quitada');
  state.categorias[k]=state.categorias[k].filter(function(x){return x!==c;});
  marcarConfig('cats'); save(); renderAll();
}

function cargarStatsAdjuntos(){
  var el=document.getElementById('adj_stats'); if(!el) return;
  adjAll().then(function(rows){
    if(rows.length===0){ el.textContent='No hay comprobantes guardados en este dispositivo.'; return; }
    var bytes=rows.reduce(function(a,r){return a+(r.data?r.data.length*3/4:0);},0);
    var mb=(bytes/1048576).toFixed(1);
    el.textContent=rows.length+' comprobante'+(rows.length===1?'':'s')+' · aprox. '+mb+' MB usados';
  }).catch(function(){ el.textContent='No se pudo leer el almacenamiento de comprobantes.'; });
}
function archivarComprobantes(meses){
  var corte=new Date(); corte.setMonth(corte.getMonth()-meses);

  if(objetivo.length===0){ toast(meses===0?'No hay comprobantes para archivar':'No hay comprobantes de más de '+meses+' meses'); return; }
  var tareas=[];
  objetivo.forEach(function(m){ m.adjs.forEach(function(a){ tareas.push(adjGet(a.aid).then(function(rec){ return {m:m,a:a,rec:rec}; })); }); });
  Promise.all(tareas).then(function(pares){
    pares=pares.filter(function(p){return p.rec;});
    if(pares.length===0){ toast('No se encontraron los archivos en este dispositivo'); return; }
    var doc='<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
      +'<title>Comprobantes archivados</title><style>body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:20px}h1{font-size:20px}'
      +'.c{background:#fff;border:1px solid #dde3ee;border-radius:10px;padding:14px;margin-bottom:16px;max-width:760px}'
      +'.h{font-size:14px;color:#333;margin-bottom:8px}.h b{color:#0a2a5e}img{max-width:100%;border-radius:6px;border:1px solid #eee}'

          save(); renderAll(); toast(pares.length+' comprobante(s) archivados y espacio liberado');
        });
      } else { toast('Comprobantes descargados; siguen también en la app'); }
    },600);
  }).catch(function(){ toast('Error al leer los comprobantes'); });
