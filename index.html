<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Personales</title>
<style>
  :root{
    --bg:#EEF1F6; --surface:#FFFFFF; --ink:#16233A; --muted:#64748B;
    --line:#DDE3EC; --line2:#EAEEF4;
    --green:#0E9F6E; --green-bg:#E6F6EF;
    --red:#E02424; --red-bg:#FCEBEB;
    --blue:#1C64F2; --blue-bg:#E7EEFE;
    --amber:#C27803; --amber-bg:#FBF2E2;
    --navy:#16233A;
    --shadow:0 1px 2px rgba(16,35,64,.06),0 4px 16px rgba(16,35,64,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45;
    -webkit-font-smoothing:antialiased;padding-bottom:40px;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .serif{font-family:Georgia,"Times New Roman",serif}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
  .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

  /* Top bar */
  header{background:var(--navy);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:20}
  .hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{color:#fff;font-size:21px}
  .brand .dot{color:#7FA8F5}
  .yearsel{display:flex;align-items:center;gap:8px}
  .yearsel label{font-size:12px;color:#AEBDD6}
  .yearsel select{background:#22324e;color:#fff;border:1px solid #33456a;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600}

  /* Tabs */
  nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:15}
  .nwrap{max-width:1080px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .tab{padding:14px 16px;border:none;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy)}

  main{max-width:1080px;margin:0 auto;padding:22px 16px}
  .view{display:none}.view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Two-bucket hero */
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  .bucket{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .bucket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .bucket.disp::before{background:var(--green)}
  .bucket.aho::before{background:var(--blue)}
  .bucket .eyebrow{margin-bottom:6px}
  .bucket .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .bucket.disp .big{color:var(--green)}
  .bucket.aho .big{color:var(--blue)}
  .bucket .sub{font-size:12.5px;color:var(--muted);margin-top:8px}
  .bucket-edit{position:absolute;top:14px;right:14px}
  .bucket-actions{position:absolute;top:14px;right:14px;display:flex;gap:6px}

  /* KPI row */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .eyebrow{font-size:10px}
  .kpi .v{font-size:19px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
  .v.green{color:var(--green)}.v.red{color:var(--red)}.v.blue{color:var(--blue)}.v.navy{color:var(--navy)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  .card h2{font-size:17px;margin-bottom:2px}
  .card .cap{font-size:12.5px;color:var(--muted);margin-bottom:14px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line2)}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#F7F9FC}
  tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
  .neg{color:var(--red)}
  .muted{color:var(--muted)}

  /* category bars */
  .catrow{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:12px;padding:6px 0;font-size:13px}
  .bartrack{background:var(--line2);border-radius:6px;height:10px;overflow:hidden}
  .barfill{height:100%;background:var(--red);border-radius:6px}
  .catrow .amt{text-align:right;font-weight:600}

  /* forms */
  .form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.wide{grid-column:span 2}
  label.fl{font-size:11.5px;font-weight:600;color:var(--muted)}
  input,select{font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
  .btn{font-family:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:var(--navy);color:#fff}
  .btn:hover{background:#22324e}
  .btn.sec{background:#fff;color:var(--navy);border-color:var(--line)}
  .btn.sec:hover{background:#F4F7FB}
  .btn.danger{background:#fff;color:var(--red);border-color:#F3C9C9}
  .btn.danger:hover{background:var(--red-bg)}
  .btn.sm{padding:5px 10px;font-size:12.5px}

  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
  .pill.ing{background:var(--green-bg);color:var(--green)}
  .pill.gas{background:var(--red-bg);color:var(--red)}
  .pill.aho{background:var(--blue-bg);color:var(--blue)}
  .pill.ret{background:var(--amber-bg);color:var(--amber)}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
  .filters .field{min-width:130px}

  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}

  .matrix-wrap{overflow-x:auto}
  .matrix{min-width:820px;font-size:12.5px}
  .matrix th,.matrix td{padding:7px 8px}
  .matrix td.mono{color:var(--muted)}
  .matrix .totrow td{background:#FCEBEB;font-weight:700;color:var(--red)}
  .matrix .cierre td{background:#F4F7FB}
  .matrix .res td{background:var(--navy);color:#fff;font-weight:700}

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .catlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#F4F7FB;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px}
  .chip button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
  .chip button:hover{color:var(--red)}
  .addcat{display:flex;gap:8px;margin-top:12px}

  .visor{position:fixed;inset:0;background:rgba(10,20,40,.72);z-index:60;display:none;align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
  .visor.show{display:flex}
  .visor-box{background:var(--surface);border-radius:14px;max-width:720px;width:100%;padding:16px;box-shadow:var(--shadow);margin:auto}
  .visor-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line);padding-bottom:10px;margin-bottom:12px}
  .visor-top h3{margin:0;font-size:15px;line-height:1.45}
  .vitem{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:12px}
  .vhead{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12.5px;color:var(--muted);margin-bottom:8px;flex-wrap:wrap}
  .vimg{width:100%;border-radius:8px;border:1px solid var(--line2);display:block;cursor:zoom-in}
  .vimg.zoom{width:auto;max-width:none;cursor:zoom-out}
  .vitem{overflow:auto}
  @media print{ .visor,.toast{display:none!important} }
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .savings-note{font-size:12px;color:var(--muted);background:var(--blue-bg);border:1px solid #CBDBFB;border-radius:10px;padding:10px 12px;margin-top:12px}
  .verfoot{text-align:center;font-size:12px;color:var(--muted);padding:14px 0 4px}
  .verfoot strong{color:var(--ink)}
  /* saldos en vivo dentro de Movimientos */
  .saldos-live{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
  .sl{border-radius:12px;padding:10px 12px;border:1px solid var(--line);background:var(--surface)}
  .sl.disp{border-left:4px solid var(--green)}
  .sl.aho{border-left:4px solid var(--blue)}
  .sl-t{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-weight:700}
  .sl-v{display:block;font-size:17px;font-weight:700;color:var(--ink);margin-top:3px}
  @media(max-width:420px){.sl-v{font-size:15px}}
  /* auditoría interna */
  .aud-head{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
  .aud-tag{font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px}
  .aud-tag.ok{background:#DCFCE7;color:#166534}
  .aud-tag.warn{background:#FEF3C7;color:#92400E}
  .aud-tag.err{background:#FEE2E2;color:#991B1B}
  .aud-row{display:flex;gap:10px;padding:9px 11px;border:1px solid var(--line2);border-radius:10px;margin-bottom:6px;align-items:flex-start;background:var(--surface)}
  .aud-row.warn{border-color:#FCD34D;background:#FFFBEB}
  .aud-row.err{border-color:#FCA5A5;background:#FEF2F2}
  .aud-ico{font-size:15px;line-height:1.3;flex:none}
  .aud-txt{flex:1;min-width:0}
  .aud-t{font-size:13px;font-weight:600;color:var(--ink)}
  .aud-d{font-size:12px;color:var(--muted);margin-top:2px;word-break:break-word}
  .aud-d b{color:var(--ink)}

  @media(max-width:720px){
    .buckets{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr 1fr}
    .form-grid{grid-template-columns:1fr 1fr}
    .field.wide{grid-column:span 2}
    .settings-grid{grid-template-columns:1fr}
    .catrow{grid-template-columns:100px 1fr 78px}
    .bucket .big{font-size:26px}
    table{display:block;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}
    th,td{padding:7px 8px;font-size:12.5px}
  }
  .syncbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;
    font:inherit;font-size:12px;font-weight:600;padding:5px 10px;border-radius:999px;cursor:pointer;
    margin-right:10px;white-space:nowrap;line-height:1.2}
  .syncbtn.ok{background:rgba(34,197,94,.28);border-color:rgba(34,197,94,.55)}
  .syncbtn.err{background:rgba(239,68,68,.30);border-color:rgba(239,68,68,.6)}
  .syncbtn.work{opacity:.7}
  .syncbtn.off{opacity:.55}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><h1>Finanzas<span class="dot">·</span>Personales</h1></div>
    <div class="yearsel">
      <button id="syncBtn" class="syncbtn" title="Sincronizar ahora">⟳ <span id="syncTxt">sin conexión</span></button>
      <label for="yearSel">Año</label>
      <select id="yearSel"></select>
    </div>
  </div>
</header>

<nav>
  <div class="nwrap">
    <button class="tab active" data-view="resumen">Resumen</button>
    <button class="tab" data-view="movimientos">Movimientos</button>
    <button class="tab" data-view="cierre">Cierre mensual</button>
    <button class="tab" data-view="ajustes">Ajustes</button>
  </div>
</nav>

<main>
  <!-- RESUMEN -->
  <section id="resumen" class="view active"></section>
  <!-- MOVIMIENTOS -->
  <section id="movimientos" class="view"></section>
  <!-- CIERRE -->
  <section id="cierre" class="view"></section>
  <!-- AJUSTES -->
  <section id="ajustes" class="view"></section>
</main>

<div class="visor" id="visor">
  <div class="visor-box">
    <div class="visor-top">
      <div><h3 id="visor_titulo"></h3><div class="cap" id="visor_sub"></div></div>
      <button class="btn sec sm" id="visor_cerrar">Cerrar</button>
    </div>
    <div id="visor_body"></div>
    <div style="margin-top:6px"><button class="btn sec" id="visor_add">📎 Agregar otro comprobante</button></div>
    <div class="cap" style="margin-top:8px">🖨 imprimir o guardar como PDF · ⬇ descargar · toca una foto para ampliarla</div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
var CLP = new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
function money(n){ return CLP.format(Math.round(n||0)); }
function pct(n){ return (Math.round((n||0)*1000)/10).toString().replace('.',',')+'%'; }
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var MESES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
/* FIX: usa la fecha LOCAL del dispositivo (Chile), no UTC.
   Antes, después de las 20:00 hora chilena toISOString() ya marcaba el día siguiente
   y el movimiento se registraba en el mes equivocado. */
function isoLocal(d){ return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function todayISO(){ return isoLocal(new Date()); }
function fechaValida(s){
  if(!/^\d{4}-\d{2}-\d{2}$/.test(s||'')) return false;
  var a=+s.slice(0,4), m=+s.slice(5,7), d=+s.slice(8,10);
  if(a<1900||a>2200||m<1||m>12||d<1||d>31) return false;
  var t=new Date(a,m-1,d);
  return t.getFullYear()===a && t.getMonth()===m-1 && t.getDate()===d;
}
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- estado por defecto (tus datos actuales) ---------- */
var DEFAULT = {
  year: 2026,
  saldoInicialAhorrado: 3515567,
  saldoInicialDisponible: 43765,
  categorias: {
    ingreso: ["Sueldo","Honorarios","Bono / Aguinaldo","Arriendo recibido","Intereses / Dividendos","Devolución impuestos","Venta","Regalo / Transferencia recibida","Reembolso","Otros ingresos"],
    gasto: ["Arriendo / Dividendo","Gastos comunes","Luz","Agua","Gas","Internet hogar","Teléfono","TV cable","Supermercado","Transporte","Bencina","Salud","Educación","Restaurant / Delivery","Entretención","Compras","Suscripciones","Tarjeta de crédito","Créditos / Deudas","Mascotas","Regalos","Impuestos","Otros gastos"],
    ahorro: ["Cuenta de ahorro","Depósito a plazo","Fondo mutuo","APV","Ahorro emergencias","Ahorro vivienda","Otros ahorros"]
  },
  medios: ["Efectivo","Débito","Crédito","Transferencia","Cheque"],
  movimientos: [
    /* FIX: IDs fijos (antes eran uid() nuevos en cada carga, lo que creaba
       movimientos duplicados en la planilla cada vez que se abría la app
       en un navegador nuevo o después de "Restablecer todo"). */
    {id:"seed_1", fecha:"2026-07-21", tipo:"Ingreso", categoria:"Sueldo", descripcion:"Sueldo restante del mes de junio", medio:"Débito", monto:3417},
    {id:"seed_2", fecha:"2026-07-21", tipo:"Ingreso", categoria:"Otros ingresos", descripcion:"Depósito APV Capital", medio:"Transferencia", monto:42763},
    {id:"seed_3", fecha:"2026-07-21", tipo:"Gasto", categoria:"Compras", descripcion:"Compra de desayuno", medio:"Débito", monto:2500}
  ],
  borrados: [],          // lápidas: {id, actualizado} de movimientos eliminados
  configActualizado: 0,  // timestamp de la última edición de saldos/categorías/medios
  _esNuevo: true         // instalación recién estrenada: aún no tiene datos propios
};

var TIPOS=["Ingreso","Gasto","Ahorro","Retiro ahorro","Cuenta corriente a cuenta de ahorro","Cuenta de ahorro a cuenta corriente"];
function esDeposito(t){ return t==='Ahorro'||t==='Traspaso a ahorro'||t==='Cuenta corriente a cuenta de ahorro'; }
function esRetiro(t){ return t==='Retiro ahorro'||t==='Traspaso a disponible'||t==='Cuenta de ahorro a cuenta corriente'; }
var APP_VERSION="2.1", APP_FECHA="03-08-2026";
var KEY="finanzas_personales_v1";
var state=load();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var s=JSON.parse(raw); return normalize(s); }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function normalize(s){
  s=s||{};
  s.year=s.year||2026;
  s.saldoInicialAhorrado=+s.saldoInicialAhorrado||0;
  s.saldoInicialDisponible=+s.saldoInicialDisponible||0;
  s.categorias=s.categorias||{}; 
  s.categorias.ingreso=s.categorias.ingreso||DEFAULT.categorias.ingreso.slice();
  s.categorias.gasto=s.categorias.gasto||DEFAULT.categorias.gasto.slice();
  s.categorias.ahorro=s.categorias.ahorro||DEFAULT.categorias.ahorro.slice();
  s.medios=s.medios||DEFAULT.medios.slice();
  s.movimientos=s.movimientos||[];
  s.borrados=s.borrados||[];
  s.configActualizado=+s.configActualizado||0;
  s._esNuevo=!!s._esNuevo;
  s.movimientos.forEach(function(m){
    if(m.adj && !m.adjs){ m.adjs=[{aid:m.id,nombre:m.adj.nombre,mime:m.adj.mime,kb:m.adj.kb||0}]; delete m.adj; }
    if(!m.adjs) m.adjs=[];
    if(m.actualizado===undefined) m.actualizado=0;
  });
  return s;
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
  if(typeof syncProgramar==='function') syncProgramar();
}
/* marca que la configuración (saldos, categorías, medios) cambió en este dispositivo */
function marcarConfig(){ state.configActualizado=Date.now(); marcarUsado(); }
/* FIX: en cuanto el usuario toca algo, este dispositivo deja de ser "recién
   instalado" y ya puede subir sus movimientos a la planilla. Mientras siga
   siendo nuevo, solo descarga: así los 3 movimientos de ejemplo nunca se suben. */
function marcarUsado(){ state._esNuevo=false; }
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1900);
}

/* ---------- cálculos ---------- */
function catsForTipo(tipo){
  if(tipo==='Ingreso') return state.categorias.ingreso;
  if(tipo==='Gasto') return state.categorias.gasto;
  return state.categorias.ahorro; // Ahorro y Retiro ahorro
}
function monthOf(m){ return +m.fecha.slice(5,7); }
function yearOf(m){ return +m.fecha.slice(0,4); }

function sumFilter(fn){ var t=0; state.movimientos.forEach(function(m){ if(fn(m)) t+=(+m.monto||0); }); return t; }

function calc(year){
  var ingMes=[],gasMes=[],ahoMes=[],dispMes=[];
  for(var i=1;i<=12;i++){
    var ing=sumFilter(function(m){return m.tipo==='Ingreso'&&yearOf(m)===year&&monthOf(m)===i;});
    var gas=sumFilter(function(m){return m.tipo==='Gasto'&&yearOf(m)===year&&monthOf(m)===i;});
    var dep=sumFilter(function(m){return esDeposito(m.tipo)&&yearOf(m)===year&&monthOf(m)===i;});
    var ret=sumFilter(function(m){return esRetiro(m.tipo)&&yearOf(m)===year&&monthOf(m)===i;});
    ingMes.push(ing); gasMes.push(gas); ahoMes.push(dep-ret); dispMes.push(ing-gas-(dep-ret));
  }
  var ingAno=ingMes.reduce(function(a,b){return a+b;},0);
  var gasAno=gasMes.reduce(function(a,b){return a+b;},0);
  var ahoAno=ahoMes.reduce(function(a,b){return a+b;},0);
  var dispAno=ingAno-gasAno-ahoAno;
  // saldos reales (todo el historial)
  var saldoAhorro=state.saldoInicialAhorrado + sumFilter(function(m){return esDeposito(m.tipo);}) - sumFilter(function(m){return esRetiro(m.tipo);});
  var saldoDisp=state.saldoInicialDisponible + sumFilter(function(m){return m.tipo==='Ingreso';}) - sumFilter(function(m){return m.tipo==='Gasto';}) - sumFilter(function(m){return esDeposito(m.tipo);}) + sumFilter(function(m){return esRetiro(m.tipo);});
  // ahorro acumulado por mes hasta hoy
  var hoy=new Date(); var acumInicio=state.saldoInicialAhorrado
      + sumFilter(function(m){return esDeposito(m.tipo)&&yearOf(m)<year;})
      - sumFilter(function(m){return esRetiro(m.tipo)&&yearOf(m)<year;});
  var acum=[],run=acumInicio;
  for(var j=0;j<12;j++){
    run+=ahoMes[j];
    var esFuturo=new Date(year,j,1)>hoy;
    acum.push(esFuturo?null:run);
  }
  /* FIX: el pie de la columna "Ahorro acum." mostraba el saldo de TODO el
     historial. Ahora muestra el último saldo acumulado real del año elegido. */
  var acumFin=acumInicio;
  for(var k=0;k<12;k++){ if(acum[k]!=null) acumFin=acum[k]; }
  return {ingMes:ingMes,gasMes:gasMes,ahoMes:ahoMes,dispMes:dispMes,ingAno:ingAno,gasAno:gasAno,ahoAno:ahoAno,dispAno:dispAno,saldoAhorro:saldoAhorro,saldoDisp:saldoDisp,acum:acum,acumFin:acumFin};
}
function gastoPorCategoria(year){
  var map={};
  state.categorias.gasto.forEach(function(c){map[c]=0;});
  state.movimientos.forEach(function(m){
    if(m.tipo==='Gasto'&&yearOf(m)===year){ if(!(m.categoria in map)) map[m.categoria]=0; map[m.categoria]+=(+m.monto||0); }
  });
  return map;
}
function catGasto(m){ return (m.categoria&&String(m.categoria).trim())||'(sin categoría)'; }
function gastoCatMes(year){ // {cat:{mes:monto}}
  var res={};
  state.categorias.gasto.forEach(function(c){ res[c]={}; });
  state.movimientos.forEach(function(m){
    if(m.tipo==='Gasto'&&yearOf(m)===year){
      var cat=catGasto(m);
      if(!res[cat]) res[cat]={};
      var mm=monthOf(m); res[cat][mm]=(res[cat][mm]||0)+(+m.monto||0);
    }
  });
  return res;
}
/* FIX: la matriz del Cierre solo recorría las categorías vigentes en Ajustes.
   Si borrabas una categoría (o la sincronización la reemplazaba), sus gastos
   desaparecían de la matriz y del TOTAL GASTOS, pero seguían sumando en el
   Resumen y en el saldo. Ahora se incluyen también las categorías huérfanas. */
function catsGastoConDatos(cm){
  var lista=state.categorias.gasto.slice(), extras=[];
  Object.keys(cm).forEach(function(k){
    if(lista.indexOf(k)<0){
      var row=cm[k], tiene=false;
      for(var i=1;i<=12;i++){ if(row[i]) tiene=true; }
      if(tiene) extras.push(k);
    }
  });
  extras.sort();
  return {cats:lista.concat(extras), huerfanas:extras};
}

function verSaldo(v){ return state.ocultarSaldos ? '$ ••••••' : money(v); }

function ajustarSaldo(cual,actual){
  var nombre=cual==='disp'?'Sueldo disponible':'Ahorro';
  var v=prompt('Escribe el saldo REAL de "'+nombre+'" que tienes hoy (sin puntos ni signo $).\nActual según la app: '+money(actual),Math.round(actual));
  if(v===null) return;
  var nuevo=Math.round(+String(v).replace(/[^\d-]/g,''));
  if(isNaN(nuevo)){ toast('Monto no válido'); return; }
  var delta=nuevo-Math.round(actual);
  if(cual==='disp') state.saldoInicialDisponible+=delta; else state.saldoInicialAhorrado+=delta;
  /* FIX: sin marcarConfig() el ajuste viajaba con timestamp viejo y el otro
     dispositivo lo pisaba en la siguiente sincronización. */
  marcarConfig();
  save(); renderAll(); toast(nombre+' ajustado a '+money(nuevo));
}

/* ===== Comprobantes (IndexedDB) ===== */
var _adjdb=null;
function adjDB(){
  return new Promise(function(res,rej){
    if(!window.indexedDB){ rej(new Error('sin soporte')); return; }
    if(_adjdb){ res(_adjdb); return; }
    var rq=indexedDB.open('finanzas_adjuntos',1);
    rq.onupgradeneeded=function(){ rq.result.createObjectStore('adj',{keyPath:'id'}); };
    rq.onsuccess=function(){ _adjdb=rq.result; res(_adjdb); };
    rq.onerror=function(){ rej(rq.error); };
  });
}
function adjPut(rec){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('adj','readwrite'); tx.objectStore('adj').put(rec); tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }); }
function adjGet(id){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var rq=db.transaction('adj').objectStore('adj').get(id); rq.onsuccess=function(){res(rq.result||null);}; rq.onerror=function(){rej(rq.error);}; }); }); }
function adjDel(id){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('adj','readwrite'); tx.objectStore('adj').delete(id); tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }); }
function adjAll(){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var rq=db.transaction('adj').objectStore('adj').getAll(); rq.onsuccess=function(){res(rq.result||[]);}; rq.onerror=function(){rej(rq.error);}; }); }); }
function adjClear(){ return adjDB().then(function(db){ return new Promise(function(res,rej){ var tx=db.transaction('adj','readwrite'); tx.objectStore('adj').clear(); tx.oncomplete=res; tx.onerror=function(){rej(tx.error);}; }); }); }

var _adjTarget=null;
function pedirAdjunto(id){
  _adjTarget=id;
  var inp=document.getElementById('adj_file');
  if(!inp){
    inp=document.createElement('input'); inp.type='file'; inp.id='adj_file';
    inp.accept='image/*,application/pdf'; inp.style.display='none';
    inp.addEventListener('change',adjuntarArchivo);
    document.body.appendChild(inp);
  }
  inp.value=''; inp.click();
}
function adjuntarArchivo(e){
  var f=e.target.files[0]; if(!f||!_adjTarget) return;
  var id=_adjTarget; _adjTarget=null;
  if(f.type==='application/pdf'){
    if(f.size>4*1024*1024){ toast('PDF muy pesado (máx 4 MB)'); return; }
    var r=new FileReader();
    r.onload=function(){ guardarAdjunto(id,f.name,f.type,r.result); };
    r.readAsDataURL(f);
  } else if(f.type.indexOf('image/')===0){
    comprimirImagen(f,function(dataUrl){ guardarAdjunto(id,f.name.replace(/\.[^.]+$/,'')+'.jpg','image/jpeg',dataUrl); });
  } else { toast('Solo imágenes o PDF'); }
}
function comprimirImagen(file,cb){
  var r=new FileReader();
  r.onload=function(){
    var img=new Image();
    img.onload=function(){
      var MAX=1400, w=img.width, h=img.height;
      if(w>MAX||h>MAX){ var k=Math.min(MAX/w,MAX/h); w=Math.round(w*k); h=Math.round(h*k); }
      var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
      cv.getContext('2d').drawImage(img,0,0,w,h);
      cb(cv.toDataURL('image/jpeg',0.72));
    };
    img.onerror=function(){ toast('No se pudo leer la imagen'); };
    img.src=r.result;
  };
  r.readAsDataURL(file);
}
function guardarAdjunto(mid,nombre,mime,dataUrl){
  var kb=Math.round(dataUrl.length*3/4/1024);
  var aid=mid+'_'+Date.now()+'_'+Math.floor(Math.random()*1000);
  adjPut({id:aid,mid:mid,nombre:nombre,mime:mime,data:dataUrl}).then(function(){
    var m=state.movimientos.find(function(x){return x.id===mid;});
    if(m){ m.adjs=m.adjs||[]; m.adjs.push({aid:aid,nombre:nombre,mime:mime,kb:kb}); save(); }
    renderMovimientos();
    if(_visorMid===mid) abrirVisor(mid);
    toast('Comprobante guardado ('+kb+' KB)');
  }).catch(function(){ toast('No se pudo guardar el comprobante'); });
}
function descargarAdjunto(aid){
  adjGet(aid).then(function(rec){
    if(!rec){ toast('Comprobante no encontrado en este dispositivo'); return; }
    var a=document.createElement('a'); a.href=rec.data; a.download=rec.nombre; a.click();
  }).catch(function(){ toast('No se pudo descargar'); });
}
function quitarAdjunto(mid,aid){
  if(!confirm('¿Quitar este comprobante? El movimiento no se borra.')) return;
  adjDel(aid).then(function(){
    var m=state.movimientos.find(function(x){return x.id===mid;});
    if(m){ m.adjs=(m.adjs||[]).filter(function(a){return a.aid!==aid;}); save(); }
    renderMovimientos();
    if(_visorMid===mid){ var mm=state.movimientos.find(function(x){return x.id===mid;}); if(mm&&mm.adjs.length) abrirVisor(mid); else cerrarVisor(); }
    toast('Comprobante quitado');
  });
}

/* ===== Visor de comprobantes ===== */
var _visorMid=null;
function abrirVisor(mid){
  _visorMid=mid;
  var m=state.movimientos.find(function(x){return x.id===mid;});
  if(!m) return;
  var ov=document.getElementById('visor');
  var body=document.getElementById('visor_body');
  document.getElementById('visor_titulo').innerHTML=fmtFecha(m.fecha)+' · '+esc(m.categoria)+' · <strong>'+money(m.monto)+'</strong><br><span style="font-weight:400">'+esc(m.descripcion||'')+'</span>';
  document.getElementById('visor_sub').textContent=(m.adjs||[]).length+' comprobante'+((m.adjs||[]).length===1?'':'s')+' en este movimiento';
  body.innerHTML='<div class="cap">Cargando…</div>';
  ov.classList.add('show');
  Promise.all((m.adjs||[]).map(function(a){ return adjGet(a.aid).then(function(r){ return {a:a,r:r}; }); })).then(function(items){
    var html='';
    items.forEach(function(it,idx){
      var a=it.a, r=it.r;
      html+='<div class="vitem"><div class="vhead"><span>'+(idx+1)+'. '+esc(a.nombre)+' · '+(a.kb||0)+' KB</span>'
          + '<span class="row-actions"><button class="btn sec sm" title="Imprimir o guardar como PDF" data-vpr="'+a.aid+'">🖨</button><button class="btn sec sm" title="Descargar" data-vdl="'+a.aid+'">⬇</button><button class="btn danger sm" title="Quitar" data-vdel="'+a.aid+'">✕</button></span></div>';
      if(!r){ html+='<div class="cap">Este archivo ya no está en el dispositivo (quizá fue archivado).</div>'; }
      else if(r.mime==='application/pdf'){ html+='<div class="cap">Documento PDF · usa el botón ⬇ para abrirlo</div>'; }
      else { html+='<img class="vimg" src="'+r.data+'" alt="'+esc(a.nombre)+'">'; }
      html+='</div>';
    });
    if(!items.length) html='<div class="cap">Aún no hay comprobantes en este movimiento.</div>';
    body.innerHTML=html;
    body.querySelectorAll('[data-vdl]').forEach(function(b){b.addEventListener('click',function(){descargarAdjunto(b.getAttribute('data-vdl'));});});
    body.querySelectorAll('[data-vpr]').forEach(function(b){b.addEventListener('click',function(){imprimirAdjunto(mid,b.getAttribute('data-vpr'));});});
    body.querySelectorAll('.vimg').forEach(function(im){ im.addEventListener('click',function(){ im.classList.toggle('zoom'); }); });
    body.querySelectorAll('[data-vdel]').forEach(function(b){b.addEventListener('click',function(){quitarAdjunto(mid,b.getAttribute('data-vdel'));});});
  });
}
function imprimirAdjunto(mid,aid){

function fld(label,inner,wide){ return '<div class="field'+(wide?' wide':'')+'"><label class="fl">'+label+'</label>'+inner+'</div>'; }
function fmtFecha(iso){ var p=iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function pill(t){ var cls = t==='Ingreso'?'ing' : t==='Gasto'?'gas' : esDeposito(t)?'aho' : 'ret'; return '<span class="pill '+cls+'">'+t+'</span>'; }
function colorTipo(t){ return t==='Ingreso'?'var(--green)' : t==='Gasto'?'var(--red)' : esDeposito(t)?'var(--blue)' : 'var(--amber)'; }

/* FIX: al registrar un traslado el aviso muestra cómo quedaron las dos bolsas,
   así se confirma en el acto que la plata se movió de una a otra. */
function mensajeSaldos(base,tipo){
  if(!esDeposito(tipo) && !esRetiro(tipo)) return base;
  var c=calc(state.year);
  if(state.ocultarSaldos) return base+' · traslado aplicado a las dos cuentas';
  return base+' · Disponible '+money(c.saldoDisp)+' · Ahorro '+money(c.saldoAhorro);
}

function addMov(){
  var fecha=document.getElementById('f_fecha').value;
  var tipo=document.getElementById('f_tipo').value;
  var cat=document.getElementById('f_cat').value;
  var desc=document.getElementById('f_desc').value.trim();
  var medio=document.getElementById('f_medio').value;
  var monto=Math.round(+document.getElementById('f_monto').value||0);
  if(!fechaValida(fecha)){ toast('Fecha no válida'); return; }
  if(monto<=0){ toast('Pon un monto mayor a 0'); return; }
  state.movimientos.push({id:uid(),fecha:fecha,tipo:tipo,categoria:cat,descripcion:desc,medio:medio,monto:monto,adjs:[],actualizado:Date.now()});
  marcarUsado();
  save(); toast(mensajeSaldos('Movimiento agregado',tipo)); renderAll();
}
function delMov(id){
  if(!confirm('¿Borrar este movimiento?')) return;
  var _victim=state.movimientos.find(function(m){return m.id===id;});
  try{ ((_victim&&_victim.adjs)||[]).forEach(function(a){ adjDel(a.aid); }); }catch(e){}
  state.movimientos=state.movimientos.filter(function(m){return m.id!==id;});
  state.borrados=state.borrados||[];
  state.borrados.push({id:id, actualizado:Date.now()});
  marcarUsado();
  save(); toast(mensajeSaldos('Movimiento borrado',_victim&&_victim.tipo)); renderAll();
}
function editMov(id){
  var m=state.movimientos.find(function(x){return x.id===id;}); if(!m) return;
  var nf=prompt('Fecha (AAAA-MM-DD):',m.fecha); if(nf===null) return;
  var nmonto=prompt('Monto:',m.monto); if(nmonto===null) return;
  var ndesc=prompt('Descripción:',m.descripcion); if(ndesc===null) return;
  /* FIX: antes no se validaba nada. Una fecha tipo "21/08/2026" dejaba el año en
     NaN y el movimiento seguía afectando el saldo pero desaparecía de todas las
     tablas y de la lista. */
  nf=nf.trim();
  if(nf && !fechaValida(nf)){ toast('Fecha no válida. Usa el formato AAAA-MM-DD'); return; }
  m.fecha=nf||m.fecha;
  m.monto=Math.round(+nmonto||m.monto); m.descripcion=ndesc.trim();
  m.actualizado=Date.now();
  marcarUsado();
  save(); toast(mensajeSaldos('Movimiento actualizado',m.tipo)); renderAll();
}

  return h;
}

function cargarStatsAdjuntos(){
  var el=document.getElementById('adj_stats'); if(!el) return;
  adjAll().then(function(rows){
    if(rows.length===0){ el.textContent='No hay comprobantes guardados en este dispositivo.'; return; }
    var bytes=rows.reduce(function(a,r){return a+(r.data?r.data.length*3/4:0);},0);
    var mb=(bytes/1048576).toFixed(1);
    el.textContent=rows.length+' comprobante'+(rows.length===1?'':'s')+' · aprox. '+mb+' MB usados';
  }).catch(function(){ el.textContent='No se pudo leer el almacenamiento de comprobantes.'; });
}
function archivarComprobantes(meses){
  var corte=new Date(); corte.setMonth(corte.getMonth()-meses);
  var corteISO=isoLocal(corte);
  var objetivo=state.movimientos.filter(function(m){ return m.adjs && m.adjs.length && (meses===0 || m.fecha<corteISO); });
  if(objetivo.length===0){ toast(meses===0?'No hay comprobantes para archivar':'No hay comprobantes de más de '+meses+' meses'); return; }
  var tareas=[];
  objetivo.forEach(function(m){ m.adjs.forEach(function(a){ tareas.push(adjGet(a.aid).then(function(rec){ return {m:m,a:a,rec:rec}; })); }); });
  Promise.all(tareas).then(function(pares){
    pares=pares.filter(function(p){return p.rec;});
    if(pares.length===0){ toast('No se encontraron los archivos en este dispositivo'); return; }
    var doc='<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">'
      +'<title>Comprobantes archivados</title><style>body{font-family:Arial,sans-serif;background:#f4f6fa;margin:0;padding:20px}h1{font-size:20px}'
      +'.c{background:#fff;border:1px solid #dde3ee;border-radius:10px;padding:14px;margin-bottom:16px;max-width:760px}'
      +'.h{font-size:14px;color:#333;margin-bottom:8px}.h b{color:#0a2a5e}img{max-width:100%;border-radius:6px;border:1px solid #eee}'
      +'a.pdf{display:inline-block;background:#0a2a5e;color:#fff;text-decoration:none;padding:8px 14px;border-radius:8px;font-size:14px}</style></head><body>'
      +'<h1>Comprobantes archivados · exportado el '+todayISO()+'</h1>';
    pares.sort(function(a,b){return a.m.fecha<b.m.fecha?-1:1;}).forEach(function(p){
      var m=p.m, r=p.rec;
      doc+='<div class="c"><div class="h"><b>'+fmtFecha(m.fecha)+'</b> · '+esc(m.tipo)+' · '+esc(m.categoria)+' · <b>'+money(m.monto)+'</b><br>'+esc(m.descripcion||'')+'</div>';
      if(r.mime==='application/pdf'){ doc+='<a class="pdf" href="'+r.data+'" download="'+esc(r.nombre)+'">Descargar PDF: '+esc(r.nombre)+'</a>'; }
      else { doc+='<img src="'+r.data+'" alt="'+esc(r.nombre)+'">'; }
      doc+='</div>';
    });
    doc+='</body></html>';
    downloadBlob(new Blob([doc],{type:'text/html'}),'comprobantes_archivo_'+todayISO()+'.html');
    setTimeout(function(){
      if(confirm('Se descargó el archivo con '+pares.length+' comprobante(s).\n\nGuárdalo en un lugar seguro ANTES de continuar.\n\n¿Eliminar ahora esos comprobantes de la app para liberar espacio? (Los movimientos no se borran)')){
        Promise.all(pares.map(function(p){ return adjDel(p.a.aid).then(function(){ p.m.adjs=(p.m.adjs||[]).filter(function(x){return x.aid!==p.a.aid;}); }); })).then(function(){
          save(); renderAll(); toast(pares.length+' comprobante(s) archivados y espacio liberado');
        });
      } else { toast('Comprobantes descargados; siguen también en la app'); }
    },600);
  }).catch(function(){ toast('Error al leer los comprobantes'); });
}

var _ultimaAuditoria=null;

  var out=document.getElementById('aud_out');
  if(out) out.innerHTML='<div class="cap">Revisando…</div>';
  adjAll().catch(function(){return null;}).then(function(archivos){
    _ultimaAuditoria=construirAuditoria(archivos);
    pintarAuditoria();
  });
}

function construirAuditoria(archivos){
  var R=[], movs=state.movimientos||[];
  function add(estado,titulo,detalle){ R.push({e:estado,t:titulo,d:detalle}); }
  function lista(arr,max){
    var n=max||4;
    var s=arr.slice(0,n).join(' · ');
    return s+(arr.length>n?' … y '+(arr.length-n)+' más':'');
  }
  function fmtMov(m){ return (m.fecha||'sin fecha')+' '+(m.categoria||'?')+' '+money(m.monto); }

  /* 1. estructura */
  var faltan=[];
  ['saldoInicialAhorrado','saldoInicialDisponible','categorias','medios','movimientos'].forEach(function(k){
    if(state[k]===undefined||state[k]===null) faltan.push(k);
  });
  add(faltan.length?'err':'ok','Estructura de datos',
      faltan.length?'Faltan campos: '+faltan.join(', ')
                   :movs.length+' movimiento'+(movs.length===1?'':'s')+' · '+(state.borrados||[]).length+' registro'+((state.borrados||[]).length===1?'':'s')+' de borrado');

  /* 2. IDs únicos */
  var vistos={}, dupIds=[];
  movs.forEach(function(m){ var i=String(m.id); if(vistos[i]) dupIds.push(i); else vistos[i]=1; });
  add(dupIds.length?'err':'ok','IDs únicos',
      dupIds.length?dupIds.length+' movimiento(s) comparten ID; la sincronización los pisará entre sí: '+lista(dupIds)
                   :'Sin duplicados. Cada movimiento tiene identificador propio.');

  /* 3. fechas válidas */
  var malaFecha=movs.filter(function(m){ return !fechaValida(m.fecha); });
  add(malaFecha.length?'err':'ok','Formato de fechas',
      malaFecha.length?malaFecha.length+' movimiento(s) con fecha inválida. Suman en el saldo pero NO aparecen en ninguna tabla anual: '+lista(malaFecha.map(fmtMov))
                      :'Las '+movs.length+' fechas usan AAAA-MM-DD y existen en el calendario.');

  /* 4. fechas futuras */
  var hoyISO=todayISO();
  var futuras=movs.filter(function(m){ return fechaValida(m.fecha) && m.fecha>hoyISO; });
  add(futuras.length?'warn':'ok','Fechas futuras',
      futuras.length?futuras.length+' movimiento(s) con fecha posterior a hoy ('+hoyISO+'): '+lista(futuras.map(fmtMov))+'. Revisa que no sean errores de tipeo.'
                    :'Ningún movimiento está fechado más adelante de hoy.');

  /* 5. montos */
  var malMonto=movs.filter(function(m){
    var v=+m.monto; return !isFinite(v)||v<=0||Math.round(v)!==v;
  });
  var sospechoso=movs.filter(function(m){ return (+m.monto)>=50000000; });
  add(malMonto.length?'err':(sospechoso.length?'warn':'ok'),'Montos',
      malMonto.length?malMonto.length+' movimiento(s) con monto cero, negativo o con decimales: '+lista(malMonto.map(fmtMov))
      :sospechoso.length?sospechoso.length+' movimiento(s) sobre $50.000.000; verifica que no sobre un dígito: '+lista(sospechoso.map(fmtMov))
      :'Todos los montos son enteros positivos en pesos.');

  /* 6. tipos reconocidos */
  var validos=TIPOS.concat(['Traspaso a ahorro','Traspaso a disponible']);
  var malTipo=movs.filter(function(m){ return validos.indexOf(m.tipo)<0; });
  add(malTipo.length?'err':'ok','Tipos de movimiento',
      malTipo.length?malTipo.length+' movimiento(s) con un tipo que el sistema no sabe clasificar; no entran en ningún cálculo: '+lista(malTipo.map(function(m){return fmtMov(m)+' ['+(m.tipo||'vacío')+']';}))
                    :'Los 6 tipos en uso se clasifican correctamente (ingreso, gasto, depósito o retiro).');

  /* 7. categorías huérfanas */
  var todasCats=(state.categorias.ingreso||[]).concat(state.categorias.gasto||[],state.categorias.ahorro||[]);
  var catsHuer={};
  movs.forEach(function(m){
    var c=(m.categoria||'').trim();
    if(!c || todasCats.indexOf(c)<0) catsHuer[c||'(sin categoría)']=(catsHuer[c||'(sin categoría)']||0)+1;
  });
  var chk=Object.keys(catsHuer);
  add(chk.length?'warn':'ok','Categorías',
      chk.length?chk.length+' categoría(s) usada(s) en movimientos ya no existe(n) en Ajustes: '+lista(chk.map(function(k){return k+' ('+catsHuer[k]+')';}))+'. Siguen sumando en los totales, pero conviene recrearlas.'
                :'Todas las categorías usadas existen en Ajustes.');

  /* 8. medios de pago */
  var medHuer={};
  movs.forEach(function(m){ var d=(m.medio||'').trim(); if(!d||(state.medios||[]).indexOf(d)<0) medHuer[d||'(vacío)']=1; });
  var mhk=Object.keys(medHuer);
  add(mhk.length?'warn':'ok','Medios de pago',
      mhk.length?'Medios no listados en el sistema: '+lista(mhk)+'. Solo afecta la presentación, no los totales.'
                :'Todos los movimientos tienen un medio de pago válido.');

  /* 9-10. cuadratura de las dos bolsas (recálculo independiente) */
  var ing=0,gas=0,dep=0,ret=0;
  movs.forEach(function(m){
    var v=+m.monto||0;
    if(m.tipo==='Ingreso') ing+=v;
    else if(m.tipo==='Gasto') gas+=v;
    else if(esDeposito(m.tipo)) dep+=v;
    else if(esRetiro(m.tipo)) ret+=v;
  });
  var c=calc(state.year);
  var dispEsp=state.saldoInicialDisponible+ing-gas-dep+ret;
  var ahoEsp=state.saldoInicialAhorrado+dep-ret;
  add(dispEsp===c.saldoDisp?'ok':'err','Cuadratura · Sueldo disponible',
      dispEsp===c.saldoDisp
        ?'Inicial '+money(state.saldoInicialDisponible)+' + ingresos '+money(ing)+' − gastos '+money(gas)+' − a ahorro '+money(dep)+' + retiros '+money(ret)+' = <b>'+money(c.saldoDisp)+'</b>'
        :'Descuadre de '+money(c.saldoDisp-dispEsp)+' entre el saldo mostrado y el recálculo independiente.');
  add(ahoEsp===c.saldoAhorro?'ok':'err','Cuadratura · Ahorro',
      ahoEsp===c.saldoAhorro
        ?'Inicial '+money(state.saldoInicialAhorrado)+' + depósitos '+money(dep)+' − retiros '+money(ret)+' = <b>'+money(c.saldoAhorro)+'</b>'
        :'Descuadre de '+money(c.saldoAhorro-ahoEsp)+' entre el saldo mostrado y el recálculo independiente.');

  /* 11. conservación del patrimonio: los traslados no crean ni destruyen plata */
  var patrimonio=c.saldoDisp+c.saldoAhorro;
  var patEsp=state.saldoInicialDisponible+state.saldoInicialAhorrado+ing-gas;
  add(patrimonio===patEsp?'ok':'err','Traslados entre bolsas',
      patrimonio===patEsp
        ?'Se movieron '+money(dep)+' al ahorro y '+money(ret)+' de vuelta sin alterar tu patrimonio total ('+money(patrimonio)+').'
        :'Los traslados están alterando el patrimonio total en '+money(patrimonio-patEsp)+'. Hay un error de signo.');

  /* 12. suma mensual = total anual, en cada año con datos */
  var anos={}; movs.forEach(function(m){ if(fechaValida(m.fecha)) anos[yearOf(m)]=1; });
  var anosL=Object.keys(anos).map(Number).sort(), fallosMes=[];
  anosL.forEach(function(a){
    var k=calc(a);
    function suma(arr){ return arr.reduce(function(x,y){return x+y;},0); }
    if(suma(k.ingMes)!==k.ingAno) fallosMes.push(a+' ingresos');
    if(suma(k.gasMes)!==k.gasAno) fallosMes.push(a+' gastos');
    if(suma(k.ahoMes)!==k.ahoAno) fallosMes.push(a+' ahorro');
    if(suma(k.dispMes)!==k.dispAno) fallosMes.push(a+' resultado');
  });
  add(fallosMes.length?'err':'ok','Sumatoria mensual vs anual',
      fallosMes.length?'Los 12 meses no suman el total en: '+lista(fallosMes)
                      :'En '+(anosL.length||1)+' año(s) con datos, los 12 meses suman exactamente el total anual.');

  /* 13. Resumen vs Cierre mensual */
  var fallosCierre=[];
  anosL.forEach(function(a){
    var cm=gastoCatMes(a), info=catsGastoConDatos(cm), tot=0;
    info.cats.forEach(function(cat){ var row=cm[cat]||{}; for(var i=1;i<=12;i++) tot+=row[i]||0; });
    var k=calc(a);
    if(tot!==k.gasAno) fallosCierre.push(a+': matriz '+money(tot)+' vs resumen '+money(k.gasAno));
  });
  add(fallosCierre.length?'err':'ok','Resumen vs Cierre mensual',
      fallosCierre.length?'El TOTAL GASTOS de la matriz no coincide con el Resumen: '+lista(fallosCierre,2)
                         :'La matriz de categorías del Cierre cuadra peso a peso con los gastos del Resumen.');

  /* 14. lápidas coherentes */
  var vivos={}; movs.forEach(function(m){ vivos[String(m.id)]=1; });
  var zombis=(state.borrados||[]).filter(function(b){ return vivos[String(b.id)]; });
  add(zombis.length?'err':'ok','Registros de borrado',
      zombis.length?zombis.length+' movimiento(s) figuran vivos y borrados a la vez; desaparecerán al sincronizar: '+lista(zombis.map(function(b){return b.id;}))
                   :(state.borrados||[]).length+' borrado(s) registrado(s), ninguno en conflicto con un movimiento vivo.');

  /* 15-16. comprobantes */
  if(archivos===null){
    add('warn','Comprobantes','No se pudo leer el almacenamiento de fotos en este dispositivo.');
    add('warn','Archivos huérfanos','No verificable sin acceso al almacenamiento.');
  } else {
    var enDisco={}; archivos.forEach(function(a){ enDisco[a.id]=a; });
    var refs={}, rotos=[];
    movs.forEach(function(m){
      (m.adjs||[]).forEach(function(a){
        refs[a.aid]=1;
        if(!enDisco[a.aid]) rotos.push((m.fecha||'?')+' '+(a.nombre||a.aid));
      });
    });
    add(rotos.length?'warn':'ok','Comprobantes enlazados',
        rotos.length?rotos.length+' comprobante(s) referenciados pero ausentes de este dispositivo (archivados o tomados en otro aparato): '+lista(rotos)
                    :Object.keys(refs).length+' comprobante(s) referenciados y todos presentes en este dispositivo.');
    var huerf=archivos.filter(function(a){ return !refs[a.id]; });
    var mb=huerf.reduce(function(x,a){return x+(a.data?a.data.length*3/4:0);},0)/1048576;
    add(huerf.length?'warn':'ok','Archivos huérfanos',
        huerf.length?huerf.length+' archivo(s) ocupan '+mb.toFixed(1)+' MB sin estar ligados a ningún movimiento. Suele pasar tras usar «Traer todo del servidor». <b>No los borres</b> sin revisarlos: pueden ser fotos que solo existen aquí.'
                    :'Sin archivos sueltos. El almacenamiento está limpio.');
  }

  /* 17. espacio en localStorage */
  var bytes=0; try{ bytes=JSON.stringify(state).length; }catch(e){}
  var kb=Math.round(bytes/1024);
  add(kb>4000?'warn':'ok','Espacio de datos',
      kb+' KB usados por los movimientos'+(kb>4000?'. Te acercas al límite del navegador (≈5 MB); exporta un respaldo.':' (el límite del navegador es ≈5 MB).'));

  /* 18. sincronización */
  var sc=syncCfg();
  var sinTs=movs.filter(function(m){ return !(+m.actualizado); }).length;
  if(!syncActivo()){
    add('warn','Sincronización','Sin configurar en este dispositivo. Los datos viven solo en este navegador: exporta respaldos con frecuencia.');
  } else if(!sc.ultimo){
    add('warn','Sincronización','Configurada pero aún sin sincronizar. Toca «Sincronizar ahora».');
  } else {
    var hrs=(Date.now()-sc.ultimo)/3600000;
    add(hrs>48?'warn':'ok','Sincronización',
        'Última: '+new Date(sc.ultimo).toLocaleString('es-CL')+(hrs>48?' · hace más de 2 días.':' · automática '+(sc.auto?'activada':'desactivada')+'.')
        +(sinTs?' '+sinTs+' movimiento(s) antiguos sin marca de tiempo: ante un conflicto, siempre pierden.':''));
  }

  var errs=R.filter(function(x){return x.e==='err';}).length;
  var warns=R.filter(function(x){return x.e==='warn';}).length;
  return {filas:R, errores:errs, avisos:warns, ok:R.length-errs-warns, total:R.length, fecha:new Date()};
}

}

/* =================================================================
   SINCRONIZACIÓN CON GOOGLE SHEETS
   La planilla es la fuente de verdad; localStorage queda como copia
   local para que la app abra rápido y funcione sin señal.
   ================================================================= */
var SKEY='finanzas_sync_cfg_v1';
var _syncOcupado=false, _syncTimer=null, _aplicando=false;

function syncCfg(){
  try{
    var raw=localStorage.getItem(SKEY);
    if(raw){ var c=JSON.parse(raw);
      return {url:c.url||'', token:c.token||'', auto:c.auto!==false, ultimo:+c.ultimo||0}; }
  }catch(e){}
  return {url:'', token:'', auto:true, ultimo:0};
}
function syncCfgSet(c){ try{ localStorage.setItem(SKEY,JSON.stringify(c)); }catch(e){} }
function syncActivo(){ var c=syncCfg(); return !!(c.url && c.token); }

function syncPinta(clase,texto){
  var b=document.getElementById('syncBtn'), t=document.getElementById('syncTxt');
  if(!b||!t) return;
  b.className='syncbtn'+(clase?' '+clase:'');
  t.textContent=texto;
}
function horaCorta(ms){
  var d=new Date(ms);
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function syncPintaEstado(){
  var c=syncCfg(), el=document.getElementById('sy_estado');
  if(!syncActivo()){
    syncPinta('off','sin conexión');
    if(el) el.textContent='No conectado. Pega la URL y el token, y toca “Guardar y conectar”.';
    return;
  }
  syncPinta('ok', c.ultimo?horaCorta(c.ultimo):'conectado');
  if(el) el.textContent = c.ultimo
    ? 'Última sincronización: '+new Date(c.ultimo).toLocaleString('es-CL')
    : 'Conectado, aún sin sincronizar.';
}

/* lo que se envía: movimientos vivos + lápidas de los borrados.
   Los comprobantes (adjs) NO viajan: son locales de cada dispositivo. */
function syncPayload(){
  /* FIX: mientras el dispositivo siga "recién instalado" (el usuario aún no ha
     creado, editado ni borrado nada), no se sube ningún movimiento. Así los 3
     movimientos de ejemplo del DEFAULT nunca llegan a la planilla. Solo se baja. */
  if(state._esNuevo){
    return { token: syncCfg().token, movimientos: [], configActualizado: 0 };
  }
  var movs=state.movimientos.map(function(m){
    return {id:String(m.id), fecha:m.fecha||'', tipo:m.tipo||'', categoria:m.categoria||'',
            descripcion:m.descripcion||'', medio:m.medio||'', monto:+m.monto||0,
            actualizado:+m.actualizado||0, eliminado:false};
  });
  (state.borrados||[]).forEach(function(b){
    movs.push({id:String(b.id), fecha:'', tipo:'', categoria:'', descripcion:'', medio:'',
               monto:0, actualizado:+b.actualizado||0, eliminado:true});
  });
  return {
    token: syncCfg().token,
    movimientos: movs,
    config: {
      saldoInicialAhorrado: state.saldoInicialAhorrado,
      saldoInicialDisponible: state.saldoInicialDisponible,
      categorias: state.categorias,
      medios: state.medios
    },
    configActualizado: +state.configActualizado||0
  };
}

/* fusiona la respuesta del servidor con lo local. Gana la versión con
   "actualizado" más alto. Devuelve cuántos cambios se aplicaron. */
function syncAplicar(resp){
  var localPorId={}, lapidas={}, cambios=0;
  /* FIX: si este dispositivo está recién instalado y el servidor trae datos
     reales, se descartan los movimientos de ejemplo en vez de sumarlos a los
     tuyos (antes quedaban conviviendo y descuadraban el saldo). */
  if(state._esNuevo && (resp.movimientos||[]).length){
    state.movimientos=[]; state.borrados=[]; state._esNuevo=false; cambios++;
  }
  state.movimientos.forEach(function(m){ localPorId[String(m.id)]=m; });
  (state.borrados||[]).forEach(function(b){ lapidas[String(b.id)]=+b.actualizado||0; });

  (resp.movimientos||[]).forEach(function(s){
    var id=String(s.id), ts=+s.actualizado||0;

    if(s.eliminado){
      var vic=localPorId[id];
      if(vic && (+vic.actualizado||0) <= ts){ delete localPorId[id]; cambios++; }
      if(lapidas[id]===undefined || lapidas[id]<ts) lapidas[id]=ts;
      return;
    }
    // si acá lo borramos DESPUÉS de esta versión, mantenemos el borrado
    if(lapidas[id]!==undefined && lapidas[id]>=ts) return;

    var local=localPorId[id];
    if(!local){
      s.adjs=[]; s.monto=+s.monto||0; s.actualizado=ts;
      localPorId[id]=s; cambios++;
    } else if(ts > (+local.actualizado||0)){
      s.adjs=local.adjs||[];        // no se pisan los comprobantes locales
      s.monto=+s.monto||0; s.actualizado=ts;
      localPorId[id]=s; cambios++;
    }
  });

  var lista=[];
  Object.keys(localPorId).forEach(function(k){ lista.push(localPorId[k]); });
  lista.sort(function(a,b){ return a.fecha<b.fecha?1:(a.fecha>b.fecha?-1:0); });
  state.movimientos=lista;
  state.borrados=Object.keys(lapidas).map(function(id){ return {id:id, actualizado:lapidas[id]}; });

  if(resp.config && (+resp.configActualizado||0) > (+state.configActualizado||0)){
    var c=resp.config;
    if(c.saldoInicialAhorrado!==undefined)   state.saldoInicialAhorrado=+c.saldoInicialAhorrado||0;
    if(c.saldoInicialDisponible!==undefined) state.saldoInicialDisponible=+c.saldoInicialDisponible||0;
    if(c.categorias) state.categorias=c.categorias;
    if(c.medios)     state.medios=c.medios;
    state.configActualizado=+resp.configActualizado||0;
    cambios++;
  }
  return cambios;
}

/* envía lo local y recibe el set completo, en una sola llamada */
function syncAhora(silencioso){
  if(!syncActivo()){ if(!silencioso) toast('Primero configura la URL y el token'); return; }
  if(_syncOcupado) return;
  _syncOcupado=true;
  clearTimeout(_syncTimer);
  syncPinta('work','sincronizando…');

  var c=syncCfg();
  fetch(c.url,{
    method:'POST',
    // text/plain evita la petición "preflight" que Apps Script no sabe responder
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(syncPayload()),
    redirect:'follow'
  })
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(!resp || !resp.ok) throw new Error((resp&&resp.error)||'respuesta inválida');
    _aplicando=true;
    var cambios=syncAplicar(resp);
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
    _aplicando=false;
    var cc=syncCfg(); cc.ultimo=Date.now(); syncCfgSet(cc);
    if(cambios){ buildYearSel(); renderAll(); }
    syncPintaEstado();
    if(!silencioso) toast(cambios ? ('Sincronizado · '+cambios+' cambio'+(cambios===1?'':'s'))
                                  : 'Sincronizado, todo al día');
  })
  .catch(function(err){
    _aplicando=false;
    syncPinta('err','error');
    var el=document.getElementById('sy_estado');
    if(el) el.textContent='Error: '+err.message+' · Revisa la URL, el token, y que la implementación tenga acceso “cualquier usuario”.';
    if(!silencioso) toast('No se pudo sincronizar');
  })
  .then(function(){ _syncOcupado=false; });
}

/* reemplaza lo local por lo del servidor (primera vez en la tablet,
   o para recuperar después de limpiar el navegador) */
function syncTraerTodo(sinPreguntar){
  if(!syncActivo()){ toast('Primero configura la URL y el token'); return; }
  if(!sinPreguntar && !confirm('Esto reemplaza los movimientos de ESTE dispositivo por los de la planilla. ¿Continuar?')) return;

  var c=syncCfg();
  syncPinta('work','descargando…');
  fetch(c.url+'?token='+encodeURIComponent(c.token),{redirect:'follow'})
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(!resp || !resp.ok) throw new Error((resp&&resp.error)||'respuesta inválida');
    var todos=resp.movimientos||[];
    state.movimientos=todos.filter(function(m){ return !m.eliminado; }).map(function(m){
      m.id=String(m.id); m.monto=+m.monto||0; m.actualizado=+m.actualizado||0; m.adjs=[]; return m;
    });
    state.borrados=todos.filter(function(m){ return m.eliminado; }).map(function(m){
      return {id:String(m.id), actualizado:+m.actualizado||0};
    });
    if(resp.config){
      var g=resp.config;
      if(g.saldoInicialAhorrado!==undefined)   state.saldoInicialAhorrado=+g.saldoInicialAhorrado||0;
      if(g.saldoInicialDisponible!==undefined) state.saldoInicialDisponible=+g.saldoInicialDisponible||0;
      if(g.categorias) state.categorias=g.categorias;
      if(g.medios)     state.medios=g.medios;
      state.configActualizado=+resp.configActualizado||0;
    }
    state._esNuevo=false;
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
    var cc=syncCfg(); cc.ultimo=Date.now(); syncCfgSet(cc);
    buildYearSel(); renderAll();
    toast(state.movimientos.length+' movimientos traídos del servidor');
  })
  .catch(function(err){ syncPinta('err','error'); toast('No se pudo descargar: '+err.message); });
}

/* agenda un envío 4 s después de cualquier cambio (lo llama save()) */
function syncProgramar(){
  if(_aplicando) return;
  var c=syncCfg();
  if(!c.url || !c.token || !c.auto) return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(function(){ syncAhora(true); },4000);
}

/* ciclo automático cada 2 minutos, solo con la app en pantalla */
setInterval(function(){
  var c=syncCfg();
  if(c.auto && c.url && c.token && document.visibilityState==='visible') syncAhora(true);
},120000);

document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible') return;
  var c=syncCfg();
  if(c.auto && c.url && c.token && (Date.now()-(c.ultimo||0) > 30000)) syncAhora(true);
});
window.addEventListener('online',function(){ syncProgramar(); });

/* ---------- navegación / init ---------- */
function buildYearSel(){
  var years={}; years[state.year]=1; years[new Date().getFullYear()]=1;
  state.movimientos.forEach(function(m){years[yearOf(m)]=1;});
  var list=Object.keys(years).map(Number).sort();
  var sel=document.getElementById('yearSel');
  sel.innerHTML=list.map(function(y){return '<option value="'+y+'"'+(y===state.year?' selected':'')+'>'+y+'</option>';}).join('');
}
function initVisor(){
  var c=document.getElementById('visor_cerrar'); if(c) c.addEventListener('click',cerrarVisor);
  var a=document.getElementById('visor_add'); if(a) a.addEventListener('click',function(){ if(_visorMid) pedirAdjunto(_visorMid); });
  var ov=document.getElementById('visor'); if(ov) ov.addEventListener('click',function(e){ if(e.target===ov) cerrarVisor(); });
}
function renderAll(){ renderResumen(); renderMovimientos(); renderCierre(); renderAjustes(); }

document.getElementById('yearSel').addEventListener('change',function(){ state.year=+this.value; save(); renderAll(); });
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    document.getElementById(t.getAttribute('data-view')).classList.add('active');
  });
});

document.getElementById('syncBtn').addEventListener('click',function(){ syncAhora(false); });

initVisor();
buildYearSel();
renderAll();
syncPintaEstado();
if(syncActivo() && syncCfg().auto) syncAhora(true);
</script>
