/* =================================================================
   CIERRE MENSUAL
   Sella un mes: guarda un acta con los totales, los saldos de cierre y
   el inventario de comprobantes. Los movimientos NO se tocan ni se
   borran: el acta es un registro histórico que queda junto a ellos.
   ================================================================= */
function claveMes(a,m){ return a+'-'+('0'+m).slice(-2); }
function cierreDe(a,m){ var k=claveMes(a,m); return (state.cierres||[]).find(function(c){return c.mes===k;})||null; }
function mesEstaCerrado(fecha){
  if(!fechaValida(fecha)) return null;
  return cierreDe(+fecha.slice(0,4), +fecha.slice(5,7));
}
/* Todo lo que define el mes: totales, saldos al cierre e inventario de
   comprobantes. Se calcula en el momento de cerrar y queda congelado. */
function datosDelMes(a,m){
  var movs=state.movimientos.filter(function(x){
    return fechaValida(x.fecha) && yearOf(x)===a && monthOf(x)===m;
  });
  var ing=0,gas=0,dep=0,ret=0,iA=0,gA=0, comps=[];
  movs.forEach(function(x){
    var v=+x.monto||0;
    if(x.tipo==='Ingreso') ing+=v; else if(x.tipo==='Gasto') gas+=v;
    else if(esDeposito(x.tipo)) dep+=v; else if(esRetiro(x.tipo)) ret+=v;
    else if(esIngresoAhorro(x.tipo)) iA+=v; else if(esGastoAhorro(x.tipo)) gA+=v;
    (x.adjs||[]).forEach(function(ad){
      comps.push({aid:ad.aid,nombre:ad.nombre,kb:ad.kb||0,movId:x.id,
        fecha:x.fecha,monto:v,concepto:x.descripcion||x.categoria||''});
    });
  });
  /* Saldos al último día del mes: todo lo ocurrido hasta esa fecha. */
  var fin=claveMes(a,m)+'-31';
  function hasta(fn){
    var t=0;
    state.movimientos.forEach(function(x){
      if(fechaValida(x.fecha) && x.fecha<=fin && fn(x)) t+=(+x.monto||0);
    });
    return t;
  }
  var sAho=state.saldoInicialAhorrado+hasta(function(x){return esDeposito(x.tipo);})
          -hasta(function(x){return esRetiro(x.tipo);})
          +hasta(function(x){return esIngresoAhorro(x.tipo);})
          -hasta(function(x){return esGastoAhorro(x.tipo);});
  var sDisp=state.saldoInicialDisponible+hasta(function(x){return x.tipo==='Ingreso';})
           -hasta(function(x){return x.tipo==='Gasto';})
           -hasta(function(x){return esDeposito(x.tipo);})
           +hasta(function(x){return esRetiro(x.tipo);});
  return {n:movs.length, ing:ing+iA, gas:gas+gA, aho:dep-ret+iA-gA,
          resultado:(ing+iA)-(gas+gA)-(dep-ret+iA-gA),
          saldoDisp:sDisp, saldoAhorro:sAho, comprobantes:comps};
}
function cerrarMes(a,m){
  if(cierreDe(a,m)){ toast('Ese mes ya está cerrado'); return; }
  var hoy=todayISO();
  if(claveMes(a,m) >= hoy.slice(0,7)){ toast('Solo puedes cerrar meses ya terminados'); return; }
  var d=datosDelMes(a,m);
  if(!d.n && !confirm(MESES[m-1]+' '+a+' no tiene movimientos. ¿Cerrarlo igual?')) return;
  var acta={
    mes:claveMes(a,m), cerradoEl:Date.now(), version:APP_VERSION,
    movimientos:d.n, ingresos:d.ing, gastos:d.gas, ahorro:d.aho, resultado:d.resultado,
    saldoDisp:d.saldoDisp, saldoAhorro:d.saldoAhorro, comprobantes:d.comprobantes
  };
  state.cierres.push(acta);
  state.cierres.sort(function(x,y){ return x.mes<y.mes?1:-1; });
  marcarConfig('cierres'); marcarUsado(); save(); renderAll();
  toast(MESES[m-1]+' '+a+' cerrado · '+d.n+' movimiento'+(d.n===1?'':'s')+' y '+d.comprobantes.length+' comprobante'+(d.comprobantes.length===1?'':'s')+' registrados');
}
function reabrirMes(mes){
  var c=(state.cierres||[]).find(function(x){return x.mes===mes;});
  if(!c) return;
  if(!confirm('Reabrir '+nombreMes(mes)+'?\n\nEl acta se elimina y el mes vuelve a quedar editable. Los movimientos y comprobantes no se tocan.')) return;
  state.cierres=state.cierres.filter(function(x){return x.mes!==mes;});
  marcarConfig('cierres'); marcarUsado(); save(); renderAll();
  toast(nombreMes(mes)+' reabierto');
}
function tarjetaCierres(y){
  var h='<div class="card"><h2>Cierre de meses</h2>'
   + '<div class="cap">Al cerrar un mes queda un acta con sus totales, los saldos de ese momento y el inventario de comprobantes. '
   + 'Los movimientos no se borran ni se modifican: el acta se guarda junto a ellos como registro histórico.</div>';
  var hoy=todayISO(), pendientes=[];
  for(var m=1;m<=12;m++){
    var k=claveMes(y,m);
    if(k>=hoy.slice(0,7)) continue;
    if(cierreDe(y,m)) continue;
    var d=datosDelMes(y,m);
    if(d.n) pendientes.push({m:m,d:d});
  }
  if(pendientes.length){
    h+='<div class="cierre-pend">';
    pendientes.forEach(function(p){
      h+='<div class="cpend"><div><strong>'+MESES[p.m-1]+' '+y+'</strong>'
       + '<div class="cpend-sub">'+p.d.n+' movimiento'+(p.d.n===1?'':'s')+' · '+p.d.comprobantes.length+' comprobante'+(p.d.comprobantes.length===1?'':'s')+'</div></div>'
       + '<button class="btn sm" data-cerrar="'+y+'-'+p.m+'">Cerrar mes</button></div>';
    });
    h+='</div>';
  } else h+='<div class="cap" style="margin:0">No hay meses terminados pendientes de cierre en '+y+'.</div>';

  var actas=(state.cierres||[]).filter(function(c){ return c.mes.slice(0,4)==String(y); });
  if(actas.length){
    h+='<h3 class="csub">Actas de '+y+'</h3>';
    actas.forEach(function(c){
      h+='<article class="acta">'
       + '<div class="acta-top"><div><span class="acta-mes">'+nombreMes(c.mes)+'</span>'
       +   '<span class="acta-sello">✓ Cerrado el '+fmtFecha(isoLocal(new Date(c.cerradoEl)))+'</span></div>'
       +   '<div class="row-actions"><button class="btn sec sm" data-actapr="'+c.mes+'">🖨</button>'
       +   '<button class="btn sec sm" data-reabrir="'+c.mes+'">Reabrir</button></div></div>'
       + '<div class="acta-grid">'
       +   '<div><span class="acta-l">Movimientos</span><span class="acta-v num">'+c.movimientos+'</span></div>'
       +   '<div><span class="acta-l">Ingresos</span><span class="acta-v num" style="color:var(--in)">'+money(c.ingresos)+'</span></div>'
       +   '<div><span class="acta-l">Gastos</span><span class="acta-v num" style="color:var(--out)">'+money(c.gastos)+'</span></div>'
       +   '<div><span class="acta-l">Ahorro neto</span><span class="acta-v num" style="color:var(--save)">'+money(c.ahorro)+'</span></div>'
       +   '<div><span class="acta-l">Saldo disponible</span><span class="acta-v num">'+money(c.saldoDisp)+'</span></div>'
       +   '<div><span class="acta-l">Saldo ahorro</span><span class="acta-v num">'+money(c.saldoAhorro)+'</span></div>'
       + '</div>';
      if((c.comprobantes||[]).length){
        h+='<details class="acta-comp"><summary>'+c.comprobantes.length+' comprobante'+(c.comprobantes.length===1?'':'s')+' en el historial</summary><ul>';
        c.comprobantes.forEach(function(cp){
          h+='<li><button class="lnk" data-actaver="'+cp.movId+'">'+esc(cp.nombre)+'</button>'
           + '<span class="muted"> · '+fmtFecha(cp.fecha)+' · '+money(cp.monto)+(cp.concepto?' · '+esc(cp.concepto):'')+'</span></li>';
        });
        h+='</ul></details>';
      }
      h+='</article>';
    });
  }
  return h+'</div>';
}
function nombreMes(k){ return MESES[(+k.slice(5,7))-1]+' '+k.slice(0,4); }

/* =================================================================
   CUADRATURA CON EL BANCO
   Compara el saldo del sistema con el de tu cartola y ofrece dos
   caminos: registrar la diferencia como movimiento (deja rastro) o
   ajustar el saldo inicial (la tapa sin explicarla).
   ================================================================= */
function compararBanco(){
  var cta=document.getElementById('cua_cta').value;
  var real=parseMonto(document.getElementById('cua_real').value);
  var out=document.getElementById('cua_out');
  if(!isFinite(real)){ toast('Escribe el saldo que aparece en tu cartola'); return; }
  var c=calc(state.year);
  var sis=(cta==='disp')?c.saldoDisp:c.saldoAhorro;
  var dif=real-sis;
  var nombre=(cta==='disp')?'Sueldo disponible':'Ahorro';
  if(dif===0){
    out.innerHTML='<div class="aud-row"><span class="aud-ico">✅</span><span class="aud-txt">'
      +'<span class="aud-t">'+nombre+' cuadrado</span>'
      +'<span class="aud-d">El sistema y tu banco marcan lo mismo: <b>'+money(real)+'</b>.</span></span></div>';
    return;
  }
  var falta=dif>0;
  var h='<div class="aud-row warn"><span class="aud-ico">⚠️</span><span class="aud-txt">'
    +'<span class="aud-t">Diferencia de '+money(Math.abs(dif))+'</span>'
    +'<span class="aud-d">Banco: <b>'+money(real)+'</b> · Sistema: <b>'+money(sis)+'</b>.<br>'
    +(falta?'El sistema muestra <b>menos</b> que el banco: falta registrar un ingreso, o hay un gasto de más (quizá repetido).'
           :'El sistema muestra <b>más</b> que el banco: falta registrar un gasto, un cargo automático o una comisión.')
    +'</span></span></div>';
  var pista = (cta==='aho')
    ? (falta?'En una cuenta de ahorro esto casi siempre son <b>intereses o reajuste</b> que el banco te abonó.'
            :'En una cuenta de ahorro esto casi siempre es una <b>comisión o cargo</b> del banco.')
    : (falta?'Busca en tu cartola un abono que no registraste, o un gasto que quedó anotado dos veces.'
            :'Busca en tu cartola un cargo automático, una comisión o una compra que falta anotar.');
  h+='<div class="savings-note"><strong>Antes de tocar nada:</strong> revisa tu cartola. '+pista+'<br><br>'
   + 'Registrar la diferencia como movimiento es mejor que ajustar el saldo, porque deja explicado de dónde salió. '
   + 'Corre también la auditoría de abajo: detecta movimientos repetidos.</div>';
  h+='<div class="modal-foot" style="border-radius:10px;border:1px solid var(--line);margin-top:12px">';
  h+='<button class="btn" id="cua_mov">Registrar la diferencia como movimiento</button>';
  h+='<button class="btn sec" id="cua_aj">Ajustar el saldo inicial</button></div>';
  out.innerHTML=h;
  var bm=document.getElementById('cua_mov');
  if(bm) bm.addEventListener('click',function(){ registrarDiferencia(dif,cta); });
  document.getElementById('cua_aj').addEventListener('click',function(){
    if(cta==='disp') state.saldoInicialDisponible+=dif; else state.saldoInicialAhorrado+=dif;
    marcarConfig(cta==='disp'?'disp':'aho');
    save(); renderAll(); toast(nombre+' ajustado a '+money(real));
  });
}
function registrarDiferencia(dif,cta){
  var tipo,cat,lista,desc;
  if(cta==='aho'){
    /* En el ahorro la diferencia no pasa por el sueldo: se registra como
       interés o comisión de la propia cuenta. */
    tipo = dif>0 ? 'Interés del ahorro' : 'Comisión del ahorro';
    cat  = dif>0 ? 'Interés / reajuste' : 'Comisión del ahorro';
    lista=state.categorias.ahorro;
    desc = dif>0 ? 'Interés abonado por el banco' : 'Comisión cobrada por el banco';
  } else {
    tipo = dif>0 ? 'Ingreso' : 'Gasto';
    cat  = 'Ajuste de saldo';
    lista= dif>0 ? state.categorias.ingreso : state.categorias.gasto;
    desc = 'Cuadratura con la cartola del banco';
  }
  if(lista.indexOf(cat)<0){ lista.push(cat); marcarConfig('cats'); }
  state.movimientos.push({id:uid(),fecha:todayISO(),tipo:tipo,categoria:cat,
    descripcion:desc,medio:state.medios[0]||'Débito',
    monto:Math.abs(dif),adjs:[],actualizado:Date.now()});
  marcarUsado(); save(); renderAll();
  toast('Registrado: '+tipo+' de '+money(Math.abs(dif)));
}

/* =================================================================
   AUDITORÍA INTERNA DEL SISTEMA
   Solo LEE los datos: nunca modifica ni borra nada.
   ================================================================= */
var _ultimaAuditoria=null;

function auditar(){
  var out=document.getElementById('aud_out');
  if(out) out.innerHTML='<div class="cap">Revisando…</div>';
  adjAll().catch(function(){return null;}).then(function(archivos){
    _ultimaAuditoria=construirAuditoria(archivos);
    pintarAuditoria();
  });
}

function construirAuditoria(archivos){
  var R=[], movs=state.movimientos||[];
  function add(estado,titulo,detalle){ R.push({e:estado,t:titulo,d:detalle}); }
  function lista(arr,max){
    var n=max||4;
    var s=arr.slice(0,n).join(' · ');
    return s+(arr.length>n?' … y '+(arr.length-n)+' más':'');
  }
  function fmtMov(m){ return (m.fecha||'sin fecha')+' '+(m.categoria||'?')+' '+money(m.monto); }

  /* 1. estructura */
  var faltan=[];
  ['saldoInicialAhorrado','saldoInicialDisponible','categorias','medios','movimientos'].forEach(function(k){
    if(state[k]===undefined||state[k]===null) faltan.push(k);
  });
  add(faltan.length?'err':'ok','Estructura de datos',
      faltan.length?'Faltan campos: '+faltan.join(', ')
                   :movs.length+' movimiento'+(movs.length===1?'':'s')+' · '+(state.borrados||[]).length+' registro'+((state.borrados||[]).length===1?'':'s')+' de borrado');

  /* 2. IDs únicos */
  var vistos={}, dupIds=[];
  movs.forEach(function(m){ var i=String(m.id); if(vistos[i]) dupIds.push(i); else vistos[i]=1; });
  add(dupIds.length?'err':'ok','IDs únicos',
      dupIds.length?dupIds.length+' movimiento(s) comparten ID; la sincronización los pisará entre sí: '+lista(dupIds)
                   :'Sin duplicados. Cada movimiento tiene identificador propio.');

  /* 3. fechas válidas */
  var malaFecha=movs.filter(function(m){ return !fechaValida(m.fecha); });
  add(malaFecha.length?'err':'ok','Formato de fechas',
      malaFecha.length?malaFecha.length+' movimiento(s) con fecha inválida. Suman en el saldo pero NO aparecen en ninguna tabla anual: '+lista(malaFecha.map(fmtMov))
                      :'Las '+movs.length+' fechas usan AAAA-MM-DD y existen en el calendario.');

  /* 3b. posibles duplicados: mismo día, mismo tipo, misma categoría, mismo monto */
  var firmas={}, dobles=[];
  movs.forEach(function(m){
    /* La descripción entra en la comparación: dos cafés de $2.700 el mismo día
       con descripciones distintas son compras reales, no un duplicado. */
    var f=(modoAviso()==='amplio') ? [m.fecha,m.tipo,m.monto].join('|')
                                    : [m.fecha,m.tipo,m.categoria,m.monto,normDesc(m.descripcion)].join('|');
    if(firmas[f]){ if(firmas[f]===1) dobles.push(m); firmas[f]++; } else firmas[f]=1;
  });
  add(dobles.length?'warn':'ok','Movimientos repetidos',
      dobles.length?dobles.length+' movimiento(s) coinciden en fecha, tipo, categoría, <b>monto y descripción</b>. Revisa si es una repetición: '+lista(dobles.map(function(m){return fmtMov(m)+(m.descripcion?' («'+m.descripcion+'»)':'');}))+'. Si son consumos distintos del mismo día, dale una descripción propia a cada uno y el aviso desaparece.'
                   :'Ningún movimiento aparece repetido. Los que comparten día y monto tienen descripciones distintas, así que se cuentan como consumos separados.');

  /* 4. fechas futuras */
  var hoyISO=todayISO();
  var futuras=movs.filter(function(m){ return fechaValida(m.fecha) && m.fecha>hoyISO; });
  add(futuras.length?'warn':'ok','Fechas futuras',
      futuras.length?futuras.length+' movimiento(s) con fecha posterior a hoy ('+hoyISO+'): '+lista(futuras.map(fmtMov))+'. Revisa que no sean errores de tipeo.'
                    :'Ningún movimiento está fechado más adelante de hoy.');

  /* 5. montos */
  var malMonto=movs.filter(function(m){
    var v=+m.monto; return !isFinite(v)||v<=0||Math.round(v)!==v;
  });
  var sospechoso=movs.filter(function(m){ return (+m.monto)>=50000000; });
  add(malMonto.length?'err':(sospechoso.length?'warn':'ok'),'Montos',
      malMonto.length?malMonto.length+' movimiento(s) con monto cero, negativo o con decimales: '+lista(malMonto.map(fmtMov))
      :sospechoso.length?sospechoso.length+' movimiento(s) sobre $50.000.000; verifica que no sobre un dígito: '+lista(sospechoso.map(fmtMov))
      :'Todos los montos son enteros positivos en pesos.');

  /* 6. tipos reconocidos */
  var validos=TIPOS.concat(['Traspaso a ahorro','Traspaso a disponible']);
  var malTipo=movs.filter(function(m){ return validos.indexOf(m.tipo)<0; });
  add(malTipo.length?'err':'ok','Tipos de movimiento',
      malTipo.length?malTipo.length+' movimiento(s) con un tipo que el sistema no sabe clasificar; no entran en ningún cálculo: '+lista(malTipo.map(function(m){return fmtMov(m)+' ['+(m.tipo||'vacío')+']';}))
                    :'Los 6 tipos en uso se clasifican correctamente (ingreso, gasto, depósito o retiro).');

  /* 7. categorías huérfanas */
  var todasCats=(state.categorias.ingreso||[]).concat(state.categorias.gasto||[],state.categorias.ahorro||[]);
  var catsHuer={};
  movs.forEach(function(m){
    var c=(m.categoria||'').trim();
    if(!c || todasCats.indexOf(c)<0) catsHuer[c||'(sin categoría)']=(catsHuer[c||'(sin categoría)']||0)+1;
  });
  var chk=Object.keys(catsHuer);
  add(chk.length?'warn':'ok','Categorías',
      chk.length?chk.length+' categoría(s) usada(s) en movimientos ya no existe(n) en Ajustes: '+lista(chk.map(function(k){return k+' ('+catsHuer[k]+')';}))+'. Siguen sumando en los totales, pero conviene recrearlas.'
                :'Todas las categorías usadas existen en Ajustes.');

  /* 8. medios de pago */
  var medHuer={};
  movs.forEach(function(m){ var d=(m.medio||'').trim(); if(!d||(state.medios||[]).indexOf(d)<0) medHuer[d||'(vacío)']=1; });
  var mhk=Object.keys(medHuer);
  add(mhk.length?'warn':'ok','Medios de pago',
      mhk.length?'Medios no listados en el sistema: '+lista(mhk)+'. Solo afecta la presentación, no los totales.'
                :'Todos los movimientos tienen un medio de pago válido.');

  /* 9-10. cuadratura de las dos bolsas (recálculo independiente) */
  var ing=0,gas=0,dep=0,ret=0,iAho=0,gAho=0;
  movs.forEach(function(m){
    var v=+m.monto||0;
    if(m.tipo==='Ingreso') ing+=v;
    else if(m.tipo==='Gasto') gas+=v;
    else if(esDeposito(m.tipo)) dep+=v;
    else if(esRetiro(m.tipo)) ret+=v;
    else if(esIngresoAhorro(m.tipo)) iAho+=v;
    else if(esGastoAhorro(m.tipo)) gAho+=v;
  });
  var c=calc(state.year);
  var dispEsp=state.saldoInicialDisponible+ing-gas-dep+ret;
  var ahoEsp=state.saldoInicialAhorrado+dep-ret+iAho-gAho;
  add(dispEsp===c.saldoDisp?'ok':'err','Cuadratura · Sueldo disponible',
      dispEsp===c.saldoDisp
        ?'Inicial '+money(state.saldoInicialDisponible)+' + ingresos '+money(ing)+' − gastos '+money(gas)+' − a ahorro '+money(dep)+' + retiros '+money(ret)+' = <b>'+money(c.saldoDisp)+'</b>'
        :'Descuadre de '+money(c.saldoDisp-dispEsp)+' entre el saldo mostrado y el recálculo independiente.');
  add(ahoEsp===c.saldoAhorro?'ok':'err','Cuadratura · Ahorro',
      ahoEsp===c.saldoAhorro
        ?'Inicial '+money(state.saldoInicialAhorrado)+' + depósitos '+money(dep)+' − retiros '+money(ret)
          +(iAho?' + intereses '+money(iAho):'')+(gAho?' − comisiones '+money(gAho):'')+' = <b>'+money(c.saldoAhorro)+'</b>'
        :'Descuadre de '+money(c.saldoAhorro-ahoEsp)+' entre el saldo mostrado y el recálculo independiente.');

  /* 11. conservación del patrimonio: los traslados no crean ni destruyen plata */
  var patrimonio=c.saldoDisp+c.saldoAhorro;
  var patEsp=state.saldoInicialDisponible+state.saldoInicialAhorrado+ing-gas+iAho-gAho;
  add(patrimonio===patEsp?'ok':'err','Traslados entre bolsas',
      patrimonio===patEsp
        ?'Se movieron '+money(dep)+' al ahorro y '+money(ret)+' de vuelta sin alterar tu patrimonio total ('+money(patrimonio)+').'
        :'Los traslados están alterando el patrimonio total en '+money(patrimonio-patEsp)+'. Hay un error de signo.');

  /* 12. suma mensual = total anual, en cada año con datos */
  var anos={}; movs.forEach(function(m){ if(fechaValida(m.fecha)) anos[yearOf(m)]=1; });
  var anosL=Object.keys(anos).map(Number).sort(), fallosMes=[];
  anosL.forEach(function(a){
    var k=calc(a);
    function suma(arr){ return arr.reduce(function(x,y){return x+y;},0); }
    if(suma(k.ingMes)!==k.ingAno) fallosMes.push(a+' ingresos');
    if(suma(k.gasMes)!==k.gasAno) fallosMes.push(a+' gastos');
    if(suma(k.ahoMes)!==k.ahoAno) fallosMes.push(a+' ahorro');
    if(suma(k.dispMes)!==k.dispAno) fallosMes.push(a+' resultado');
  });
  add(fallosMes.length?'err':'ok','Sumatoria mensual vs anual',
      fallosMes.length?'Los 12 meses no suman el total en: '+lista(fallosMes)
                      :'En '+(anosL.length||1)+' año(s) con datos, los 12 meses suman exactamente el total anual.');

  /* 13. Resumen vs Cierre mensual */
  var fallosCierre=[];
  anosL.forEach(function(a){
    var cm=gastoCatMes(a), info=catsGastoConDatos(cm), tot=0;
    info.cats.forEach(function(cat){ var row=cm[cat]||{}; for(var i=1;i<=12;i++) tot+=row[i]||0; });
    var k=calc(a);
    if(tot!==k.gasAno) fallosCierre.push(a+': matriz '+money(tot)+' vs resumen '+money(k.gasAno));
  });
  add(fallosCierre.length?'err':'ok','Resumen vs Cierre mensual',
      fallosCierre.length?'El TOTAL GASTOS de la matriz no coincide con el Resumen: '+lista(fallosCierre,2)
                         :'La matriz de categorías del Cierre cuadra peso a peso con los gastos del Resumen.');

  /* 14. lápidas coherentes */
  var vivos={}; movs.forEach(function(m){ vivos[String(m.id)]=1; });
  var zombis=(state.borrados||[]).filter(function(b){ return vivos[String(b.id)]; });
  add(zombis.length?'err':'ok','Registros de borrado',
      zombis.length?zombis.length+' movimiento(s) figuran vivos y borrados a la vez; desaparecerán al sincronizar: '+lista(zombis.map(function(b){return b.id;}))
                   :(state.borrados||[]).length+' borrado(s) registrado(s), ninguno en conflicto con un movimiento vivo.');

  /* 15-16. comprobantes */
  if(archivos===null){
    add('warn','Comprobantes','No se pudo leer el almacenamiento de fotos en este dispositivo.');
    add('warn','Archivos huérfanos','No verificable sin acceso al almacenamiento.');
  } else {
    var enDisco={}; archivos.forEach(function(a){ enDisco[a.id]=a; });
    var refs={}, rotos=[];
    movs.forEach(function(m){
      (m.adjs||[]).forEach(function(a){
        refs[a.aid]=1;
        if(!enDisco[a.aid]) rotos.push((m.fecha||'?')+' '+(a.nombre||a.aid));
      });
    });
    add(rotos.length?'warn':'ok','Comprobantes enlazados',
        rotos.length?rotos.length+' comprobante(s) referenciados pero ausentes de este dispositivo (archivados o tomados en otro aparato): '+lista(rotos)
                    :Object.keys(refs).length+' comprobante(s) referenciados y todos presentes en este dispositivo.');
    var huerf=archivos.filter(function(a){ return !refs[a.id]; });
    var mb=huerf.reduce(function(x,a){return x+(a.data?a.data.length*3/4:0);},0)/1048576;
    add(huerf.length?'warn':'ok','Archivos huérfanos',
        huerf.length?huerf.length+' archivo(s) ocupan '+mb.toFixed(1)+' MB sin estar ligados a ningún movimiento. Suele pasar tras usar «Traer todo del servidor». <b>No los borres</b> sin revisarlos: pueden ser fotos que solo existen aquí.'
                    :'Sin archivos sueltos. El almacenamiento está limpio.');
  }

  /* 17. relojes: marcas de tiempo imposibles */
  var techoTs=Date.now()+300000, futTs=[];
  movs.forEach(function(m){ if((+m.actualizado||0)>techoTs) futTs.push(fmtMov(m)); });
  CFG_CAMPOS.forEach(function(k){
    if((+(state.cfgTs||{})[k]||0)>techoTs) futTs.push('configuración ('+k+')');
  });
  add(futTs.length?'err':'ok','Relojes de los dispositivos',
      futTs.length?futTs.length+' marca(s) de tiempo están en el futuro. Eso significa que un dispositivo tiene la fecha mal puesta y sus versiones ganarían siempre al sincronizar, pisando cambios más nuevos: '+lista(futTs)+'. Revisa la fecha y hora automáticas en ese aparato.'
                  :'Ninguna marca de tiempo está en el futuro. La fusión entre dispositivos resolverá los conflictos por antigüedad real.');

  /* 18. integridad de los registros para sincronizar */
  var sinId=movs.filter(function(m){ return m.id===undefined||m.id===null||String(m.id).trim()===''; });
  var lapMalas=(state.borrados||[]).filter(function(b){ return !b||b.id===undefined||b.id===null||String(b.id).trim()===''; });
  add((sinId.length||lapMalas.length)?'err':'ok','Registros aptos para sincronizar',
      (sinId.length||lapMalas.length)
        ?(sinId.length?sinId.length+' movimiento(s) sin identificador. ':'')
         +(lapMalas.length?lapMalas.length+' registro(s) de borrado corruptos. ':'')
         +'Estos registros no viajan bien a la planilla y pueden interrumpir la sincronización.'
        :'Todos los movimientos y borrados tienen identificador válido; nada corrupto que interrumpa la sincronización.');

  /* 19. lápidas acumuladas */
  var lapN=(state.borrados||[]).length;
  var lapViejas=(state.borrados||[]).filter(function(b){ return (+b.actualizado||0)<Date.now()-180*86400000; }).length;
  add(lapN>400?'warn':'ok','Historial de borrados',
      lapN>400?lapN+' registros de borrado acumulados ('+lapViejas+' de más de 180 días). Cada sincronización los envía y se vuelve más lenta. Se limpian solos al sincronizar en esta versión.'
              :lapN+' registro(s) de borrado, dentro de lo normal.'+(lapViejas?' '+lapViejas+' se descartarán en la próxima sincronización.':''));

  /* 20. respaldo reciente */
  var ultimoResp=+state.ultimoRespaldo||0;
  var diasResp=ultimoResp?Math.floor((Date.now()-ultimoResp)/86400000):null;
  add((ultimoResp===0||diasResp>30)?'warn':'ok','Respaldo',
      ultimoResp===0?'Nunca has exportado un respaldo desde este dispositivo. Si pierdes el navegador, pierdes lo que solo esté aquí (incluidas las fotos de comprobantes, que no se sincronizan).'
      :diasResp>30?'Último respaldo hace '+diasResp+' días. Conviene exportar uno.'
      :'Último respaldo hace '+diasResp+' día(s). Al día.');

  /* 21. actas de cierre vs movimientos reales */
  var desfase=[];
  (state.cierres||[]).forEach(function(c){
    var a=+c.mes.slice(0,4), mm=+c.mes.slice(5,7);
    var d=datosDelMes(a,mm);
    if(d.n!==c.movimientos || d.ing!==c.ingresos || d.gas!==c.gastos){
      desfase.push(nombreMes(c.mes)+' (acta: '+c.movimientos+' mov / '+money(c.gastos)+' gastos · hoy: '+d.n+' mov / '+money(d.gas)+' gastos)');
    }
  });
  add(desfase.length?'warn':'ok','Actas de cierre',
      (state.cierres||[]).length===0?'Aún no has cerrado ningún mes. Cerrar los meses terminados deja un acta con sus totales y su inventario de comprobantes.'
      :desfase.length?desfase.length+' acta(s) ya no coinciden con los movimientos: '+lista(desfase,2)+'. Alguien editó el mes después de cerrarlo. Reabre el mes y ciérralo de nuevo para regenerar el acta.'
      :(state.cierres||[]).length+' acta(s) de cierre y todas coinciden con los movimientos actuales.');

  /* 22. espacio en localStorage */
  var bytes=0; try{ bytes=JSON.stringify(state).length; }catch(e){}
  var kb=Math.round(bytes/1024);
  add(kb>4000?'warn':'ok','Espacio de datos',
      kb+' KB usados por los movimientos'+(kb>4000?'. Te acercas al límite del navegador (≈5 MB); exporta un respaldo.':' (el límite del navegador es ≈5 MB).'));

  /* 23. sincronización */
  var sc=syncCfg();
  var sinTs=movs.filter(function(m){ return !(+m.actualizado); }).length;
  if(!syncActivo()){
    add('warn','Sincronización','Sin configurar en este dispositivo. Los datos viven solo en este navegador: exporta respaldos con frecuencia.');
  } else if(!sc.ultimo){
    add('warn','Sincronización','Configurada pero aún sin sincronizar. Toca «Sincronizar ahora».');
  } else {
    var hrs=(Date.now()-sc.ultimo)/3600000;
    add(hrs>48?'warn':'ok','Sincronización',
        'Última: '+new Date(sc.ultimo).toLocaleString('es-CL')+(hrs>48?' · hace más de 2 días.':' · automática '+(sc.auto?'activada':'desactivada')+'.')
        +(sinTs?' '+sinTs+' movimiento(s) antiguos sin marca de tiempo: ante un conflicto, siempre pierden.':''));
  }

  var errs=R.filter(function(x){return x.e==='err';}).length;
  var warns=R.filter(function(x){return x.e==='warn';}).length;
  return {filas:R, errores:errs, avisos:warns, ok:R.length-errs-warns, total:R.length, fecha:new Date()};
}

function exportCSV(){

function importJSON(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var obj=JSON.parse(r.result);
      if(obj&&obj.__formato===2){
        state=normalize(obj.state); state._esNuevo=false; save();
        var adj=obj.adjuntos||[];
        adjClear().then(function(){ return Promise.all(adj.map(function(a){return adjPut(a);})); })
          .catch(function(){})
          .then(function(){ buildYearSel(); renderAll(); toast('Respaldo importado ('+adj.length+' comprobantes)'); });
      } else {
        state=normalize(obj); state._esNuevo=false; save(); buildYearSel(); renderAll(); toast('Respaldo importado');
      }
    }catch(err){ toast('Archivo inválido'); }
  };
  r.readAsText(f); e.target.value='';
}
function downloadBlob(blob,name){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

/* =================================================================
   SINCRONIZACIÓN CON GOOGLE SHEETS
   La planilla es la fuente de verdad; localStorage queda como copia
   local para que la app abra rápido y funcione sin señal.
   ================================================================= */
var SKEY='finanzas_sync_cfg_v1';
var _syncOcupado=false, _syncTimer=null, _aplicando=false;

function syncCfg(){
  try{
    var raw=localStorage.getItem(SKEY);
    if(raw){ var c=JSON.parse(raw);
      return {url:c.url||'', token:c.token||'', auto:c.auto!==false, ultimo:+c.ultimo||0}; }
  }catch(e){}
  return {url:'', token:'', auto:true, ultimo:0};
}
function syncCfgSet(c){ try{ localStorage.setItem(SKEY,JSON.stringify(c)); }catch(e){} }
function syncActivo(){ var c=syncCfg(); return !!(c.url && c.token); }

function syncPinta(clase,texto){
  var b=document.getElementById('syncBtn'), t=document.getElementById('syncTxt');
  if(!b||!t) return;
  b.className='syncbtn'+(clase?' '+clase:'');
  t.textContent=texto;
}
function horaCorta(ms){
  var d=new Date(ms);
  return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
}
function syncPintaEstado(){
  var c=syncCfg(), el=document.getElementById('sy_estado');
  if(!syncActivo()){
    syncPinta('off','sin conexión');
    if(el) el.textContent='No conectado. Pega la URL y el token, y toca “Guardar y conectar”.';
    return;
  }
  syncPinta('ok', c.ultimo?horaCorta(c.ultimo):'conectado');
  if(el) el.textContent = c.ultimo
    ? 'Última sincronización: '+new Date(c.ultimo).toLocaleString('es-CL')
    : 'Conectado, aún sin sincronizar.';
}

/* lo que se envía: movimientos vivos + lápidas de los borrados.
   Los comprobantes (adjs) NO viajan: son locales de cada dispositivo. */
function syncPayload(){
  /* FIX: mientras el dispositivo siga "recién instalado" (el usuario aún no ha
     creado, editado ni borrado nada), no se sube ningún movimiento. Así los 3
     movimientos de ejemplo del DEFAULT nunca llegan a la planilla. Solo se baja. */
  if(state._esNuevo){
    return { token: syncCfg().token, movimientos: [], configActualizado: 0 };
  }
  var movs=state.movimientos.map(function(m){
    return {id:String(m.id), fecha:m.fecha||'', tipo:m.tipo||'', categoria:m.categoria||'',
            descripcion:m.descripcion||'', medio:m.medio||'', monto:+m.monto||0,
            actualizado:+m.actualizado||0, eliminado:false};
  });
  (state.borrados||[]).forEach(function(b){
    movs.push({id:String(b.id), fecha:'', tipo:'', categoria:'', descripcion:'', medio:'',
               monto:0, actualizado:+b.actualizado||0, eliminado:true});
  });
  return {
    token: syncCfg().token,
    movimientos: movs,
    config: {
      saldoInicialAhorrado: state.saldoInicialAhorrado,
      saldoInicialDisponible: state.saldoInicialDisponible,
      cierres: state.cierres||[],
      categorias: state.categorias,
      medios: state.medios
    },
    configActualizado: +state.configActualizado||0,
    cfgTs: state.cfgTs||{}
  };
}

/* fusiona la respuesta del servidor con lo local. Gana la versión con
   "actualizado" más alto. Devuelve cuántos cambios se aplicaron. */
/* Tras sincronizar puede llegar un movimiento que el otro aparato registró
   dos veces. Se avisa al tiro en vez de esperar a que corras la auditoría. */
var _repAntes=0;
function avisarRepetidosTrasSync(){
  var n=contarRepetidos();
  if(n>_repAntes && n>0) toast('⚠ '+n+' movimiento'+(n===1?'':'s')+' repetido'+(n===1?'':'s')+' · revisa la auditoría en Ajustes');
  _repAntes=n;
}
function syncAplicar(resp){
  var localPorId={}, lapidas={}, cambios=0;
  /* FIX: si este dispositivo está recién instalado y el servidor trae datos
     reales, se descartan los movimientos de ejemplo en vez de sumarlos a los
     tuyos (antes quedaban conviviendo y descuadraban el saldo). */
  if(state._esNuevo && (resp.movimientos||[]).length){
    state.movimientos=[]; state.borrados=[]; state._esNuevo=false; cambios++;
  }
  state.movimientos.forEach(function(m){ localPorId[String(m.id)]=m; });
  (state.borrados||[]).forEach(function(b){ lapidas[String(b.id)]=+b.actualizado||0; });
  /* Blindaje: las lápidas normalmente llegan dentro de resp.movimientos con
     eliminado:true. Si el servidor las manda en un arreglo aparte, también se
     respetan, para que un borrado no reviva al sincronizar. */
  (resp.borrados||[]).filter(function(x){ return x && x.id!==undefined && x.id!==null && x.id!==''; }).forEach(function(b){
    var id=String(b.id), ts=+b.actualizado||0;
    var vic=localPorId[id];
    if(vic && (+vic.actualizado||0)<=ts){ delete localPorId[id]; cambios++; }
    if(lapidas[id]===undefined || lapidas[id]<ts) lapidas[id]=ts;
  });

  /* Blindaje: una fila vacía o corrupta en la planilla rompía toda la
     sincronización y el dispositivo dejaba de sincronizar sin avisar. */
  (resp.movimientos||[]).filter(function(x){ return x && x.id!==undefined && x.id!==null && x.id!==''; }).forEach(function(s){
    var id=String(s.id), ts=+s.actualizado||0;

    if(s.eliminado){
      var vic=localPorId[id];
      if(vic && (+vic.actualizado||0) <= ts){ delete localPorId[id]; cambios++; }
      if(lapidas[id]===undefined || lapidas[id]<ts) lapidas[id]=ts;
      return;
    }
    // si acá lo borramos DESPUÉS de esta versión, mantenemos el borrado
    if(lapidas[id]!==undefined && lapidas[id]>=ts) return;

    var local=localPorId[id];
    if(!local){
      s.adjs=[]; s.monto=+s.monto||0; s.actualizado=ts;
      localPorId[id]=s; cambios++;
    } else if(ts > (+local.actualizado||0)){
      s.adjs=local.adjs||[];        // no se pisan los comprobantes locales
      s.monto=+s.monto||0; s.actualizado=ts;
      localPorId[id]=s; cambios++;
    }
  });

  var lista=[];
  Object.keys(localPorId).forEach(function(k){ lista.push(localPorId[k]); });
  lista.sort(function(a,b){ return a.fecha<b.fecha?1:(a.fecha>b.fecha?-1:0); });
  state.movimientos=lista;
  /* Las lápidas de más de 180 días ya se propagaron a todos los dispositivos:
     se descartan para que el payload no crezca indefinidamente. */
  var corteLap=Date.now()-180*86400000;
  state.borrados=Object.keys(lapidas)
    .filter(function(id){ return lapidas[id]>corteLap; })
    .map(function(id){ return {id:id, actualizado:lapidas[id]}; });

  if(resp.config){
    var c=resp.config, base=+resp.configActualizado||0, rts=resp.cfgTs||{};
    /* Blindaje del receptor: una marca de tiempo del futuro (reloj mal puesto en
       el otro aparato) ganaría todas las fusiones para siempre. Se descarta. */
    var techo=Date.now()+300000;   // 5 minutos de tolerancia por desfase normal
    if(base>techo) base=0;         // marca imposible: se ignora, no se acota
    var rts2={}; Object.keys(rts).forEach(function(k){
      var v=+rts[k]||0; rts2[k]=(v>techo)?0:v;
    }); rts=rts2;
    function gana(k){ return (+rts[k]||base) > (+(state.cfgTs||{})[k]||0); }
    if(!state.cfgTs) state.cfgTs={};
    if(c.saldoInicialDisponible!==undefined && gana('disp')){
      state.saldoInicialDisponible=+c.saldoInicialDisponible||0; state.cfgTs.disp=+rts.disp||base; cambios++;
    }
    if(c.saldoInicialAhorrado!==undefined && gana('aho')){
      state.saldoInicialAhorrado=+c.saldoInicialAhorrado||0; state.cfgTs.aho=+rts.aho||base; cambios++;
    }
    if(c.categorias && gana('cats')){ state.categorias=c.categorias; state.cfgTs.cats=+rts.cats||base; cambios++; }
    if(c.medios && gana('med')){ state.medios=c.medios; state.cfgTs.med=+rts.med||base; cambios++; }
    /* Las actas se unen en vez de reemplazarse: un cierre hecho en la tablet y
       otro en el teléfono deben convivir, nunca perderse. */
    if(Array.isArray(c.cierres)){
      var hay={}; (state.cierres||[]).forEach(function(x){ hay[x.mes]=1; });
      var nuevas=c.cierres.filter(function(x){ return x && x.mes && !hay[x.mes]; });
      if(nuevas.length){
        state.cierres=(state.cierres||[]).concat(nuevas).sort(function(x,y){return x.mes<y.mes?1:-1;});
        cambios++;
      }
      state.cfgTs.cierres=Math.max(+(state.cfgTs||{}).cierres||0,+rts.cierres||base);
    }
    state.configActualizado=Math.max(+state.configActualizado||0,base);
  }
  return cambios;
}

/* envía lo local y recibe el set completo, en una sola llamada */
function syncAhora(silencioso){
  if(!syncActivo()){ if(!silencioso) toast('Primero configura la URL y el token'); return; }
  if(_syncOcupado) return;
  _syncOcupado=true;
  clearTimeout(_syncTimer);
  syncPinta('work','sincronizando…');

  var c=syncCfg();
  fetch(c.url,{
    method:'POST',
    // text/plain evita la petición "preflight" que Apps Script no sabe responder
    headers:{'Content-Type':'text/plain;charset=utf-8'},
    body:JSON.stringify(syncPayload()),
    redirect:'follow'
  })
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(!resp || !resp.ok) throw new Error((resp&&resp.error)||'respuesta inválida');
    _aplicando=true;
    var cambios=syncAplicar(resp);
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
    _aplicando=false;
    var cc=syncCfg(); cc.ultimo=Date.now(); syncCfgSet(cc);
    if(cambios){ buildYearSel(); renderAll(); }
    syncPintaEstado();
    if(!silencioso) toast(cambios ? ('Sincronizado · '+cambios+' cambio'+(cambios===1?'':'s'))
                                  : 'Sincronizado, todo al día');
  })
  .catch(function(err){
    _aplicando=false;
    syncPinta('err','error');
    var el=document.getElementById('sy_estado');
    if(el) el.textContent='Error: '+err.message+' · Revisa la URL, el token, y que la implementación tenga acceso “cualquier usuario”.';
    if(!silencioso) toast('No se pudo sincronizar');
  })
  .then(function(){ _syncOcupado=false; });
}

/* reemplaza lo local por lo del servidor (primera vez en la tablet,
   o para recuperar después de limpiar el navegador) */
function syncTraerTodo(sinPreguntar){
  if(!syncActivo()){ toast('Primero configura la URL y el token'); return; }
  if(!sinPreguntar && !confirm('Esto reemplaza los movimientos de ESTE dispositivo por los de la planilla. ¿Continuar?')) return;

  var c=syncCfg();
  syncPinta('work','descargando…');
  fetch(c.url+'?token='+encodeURIComponent(c.token),{redirect:'follow'})
  .then(function(r){ return r.json(); })
  .then(function(resp){
    if(!resp || !resp.ok) throw new Error((resp&&resp.error)||'respuesta inválida');
    var todos=resp.movimientos||[];
    state.movimientos=todos.filter(function(m){ return !m.eliminado; }).map(function(m){
      m.id=String(m.id); m.monto=+m.monto||0; m.actualizado=+m.actualizado||0; m.adjs=[]; return m;
    });
    state.borrados=todos.filter(function(m){ return m.eliminado; }).map(function(m){
      return {id:String(m.id), actualizado:+m.actualizado||0};
    });
    if(resp.config){
      var g=resp.config;
      if(g.saldoInicialAhorrado!==undefined)   state.saldoInicialAhorrado=+g.saldoInicialAhorrado||0;
      if(g.saldoInicialDisponible!==undefined) state.saldoInicialDisponible=+g.saldoInicialDisponible||0;
      if(g.categorias) state.categorias=g.categorias;
      if(g.medios)     state.medios=g.medios;
      state.configActualizado=+resp.configActualizado||0;
    }
    state._esNuevo=false;
    try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
    var cc=syncCfg(); cc.ultimo=Date.now(); syncCfgSet(cc);
    buildYearSel(); renderAll(); avisarRepetidosTrasSync();
    toast(state.movimientos.length+' movimientos traídos del servidor');
  })
  .catch(function(err){ syncPinta('err','error'); toast('No se pudo descargar: '+err.message); });
}

/* agenda un envío 4 s después de cualquier cambio (lo llama save()) */
function syncProgramar(){
  if(_aplicando) return;
  var c=syncCfg();
  if(!c.url || !c.token || !c.auto) return;
  clearTimeout(_syncTimer);
  _syncTimer=setTimeout(function(){ syncAhora(true); },4000);
}

/* ciclo automático cada 2 minutos, solo con la app en pantalla */
setInterval(function(){
  var c=syncCfg();
  if(c.auto && c.url && c.token && document.visibilityState==='visible') syncAhora(true);
},120000);

document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible') return;
  var c=syncCfg();
  if(c.auto && c.url && c.token && (Date.now()-(c.ultimo||0) > 30000)) syncAhora(true);
});
window.addEventListener('online',function(){ syncProgramar(); });

/* ---------- navegación / init ---------- */
function buildYearSel(){
  var years={}; years[state.year]=1; years[new Date().getFullYear()]=1;
  state.movimientos.forEach(function(m){years[yearOf(m)]=1;});
  var list=Object.keys(years).map(Number).sort();
  var sel=document.getElementById('yearSel');
  sel.innerHTML=list.map(function(y){return '<option value="'+y+'"'+(y===state.year?' selected':'')+'>'+y+'</option>';}).join('');
}
function initVisor(){
  var c=document.getElementById('visor_cerrar'); if(c) c.addEventListener('click',cerrarVisor);
  var a=document.getElementById('visor_add'); if(a) a.addEventListener('click',function(){ if(_visorMid) pedirAdjunto(_visorMid); });
  var ov=document.getElementById('visor'); if(ov) ov.addEventListener('click',function(e){ if(e.target===ov) cerrarVisor(); });
}
/* Cambia de vista desde cualquier botón, no solo desde la barra. */
function irAVista(v){
  document.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('active', x.getAttribute('data-view')===v); });
  document.querySelectorAll('.view').forEach(function(x){ x.classList.toggle('active', x.id===v); });
  window.scrollTo(0,0);
}
/* Red de seguridad: si un panel falla, los demás se dibujan igual y el problema
   se muestra en pantalla en vez de dejarla en blanco. */
function renderAll(){
  [['resumen',renderResumen],['movimientos',renderMovimientos],
   ['cierre',renderCierre],['ajustes',renderAjustes]].forEach(function(p){
    try{ p[1](); }
    catch(e){
      var el=document.getElementById(p[0]);
      if(el) el.innerHTML='<div class="card"><h2>No se pudo dibujar este panel</h2>'
        + '<div class="cap">Tus datos están guardados y no se han perdido. '
        + 'Muéstrale este mensaje a quien te ayuda con la app:</div>'
        + '<pre class="errbox">'+esc(String(e&&e.message||e))+'</pre>'
        + '<div class="cap" style="margin:12px 0 0">Puedes exportar un respaldo desde Ajustes para tener tu información a salvo.</div></div>';
      if(window.console&&console.error) console.error('Fallo en '+p[0],e);
    }
  });
}

document.getElementById('yearSel').addEventListener('change',function(){ state.year=+this.value; save(); renderAll(); });
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){ irAVista(t.getAttribute('data-view')); });
});

document.getElementById('syncBtn').addEventListener('click',function(){ syncAhora(false); });

initVisor();
initEditor();
initDuplicado();
buildYearSel();
renderAll();
syncPintaEstado();
/* Salvaguarda final: si la vista activa quedó sin alto visible (por un estilo
   que el navegador no interpretó), se fuerza a mostrarse. Evita que la pantalla
   quede en blanco con los datos ya cargados. */
setTimeout(function(){
  try{
    var v=document.querySelector('.view.active');
    if(v && v.innerHTML.length>200 && v.offsetHeight<40){
      v.style.display='block'; v.style.opacity='1'; v.style.visibility='visible';
      document.querySelectorAll('nav').forEach(function(n){
        n.style.position='relative'; n.style.height='auto'; n.style.maxHeight='none';
      });
      document.body.style.paddingBottom='40px';
    }
  }catch(e){}
},300);

if(syncActivo() && syncCfg().auto) syncAhora(true);
</script>
