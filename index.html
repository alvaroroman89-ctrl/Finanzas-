<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finanzas Personales</title>
<style>
  :root{
    --bg:#EEF1F6; --surface:#FFFFFF; --ink:#16233A; --muted:#64748B;
    --line:#DDE3EC; --line2:#EAEEF4;
    --green:#0E9F6E; --green-bg:#E6F6EF;
    --red:#E02424; --red-bg:#FCEBEB;
    --blue:#1C64F2; --blue-bg:#E7EEFE;
    --amber:#C27803; --amber-bg:#FBF2E2;
    --navy:#16233A;
    --shadow:0 1px 2px rgba(16,35,64,.06),0 4px 16px rgba(16,35,64,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.45;
    -webkit-font-smoothing:antialiased;padding-bottom:40px;
  }
  .num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
  .serif{font-family:Georgia,"Times New Roman",serif}
  h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:700;letter-spacing:-.01em}
  .eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}

  /* Top bar */
  header{background:var(--navy);color:#fff;padding:16px 20px;position:sticky;top:0;z-index:20}
  .hwrap{max-width:1080px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:baseline;gap:10px}
  .brand h1{color:#fff;font-size:21px}
  .brand .dot{color:#7FA8F5}
  .yearsel{display:flex;align-items:center;gap:8px}
  .yearsel label{font-size:12px;color:#AEBDD6}
  .yearsel select{background:#22324e;color:#fff;border:1px solid #33456a;border-radius:8px;padding:6px 10px;font-size:14px;font-weight:600}

  /* Tabs */
  nav{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:60px;z-index:15}
  .nwrap{max-width:1080px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto}
  .tab{padding:14px 16px;border:none;background:none;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--navy);border-bottom-color:var(--navy)}

  main{max-width:1080px;margin:0 auto;padding:22px 16px}
  .view{display:none}.view.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* Two-bucket hero */
  .buckets{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
  .bucket{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .bucket::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px}
  .bucket.disp::before{background:var(--green)}
  .bucket.aho::before{background:var(--blue)}
  .bucket .eyebrow{margin-bottom:6px}
  .bucket .big{font-size:30px;font-weight:700;letter-spacing:-.02em;margin-top:2px}
  .bucket.disp .big{color:var(--green)}
  .bucket.aho .big{color:var(--blue)}
  .bucket .sub{font-size:12.5px;color:var(--muted);margin-top:8px}

  /* KPI row */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:22px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;box-shadow:var(--shadow)}
  .kpi .eyebrow{font-size:10px}
  .kpi .v{font-size:19px;font-weight:700;margin-top:6px;letter-spacing:-.01em}
  .v.green{color:var(--green)}.v.red{color:var(--red)}.v.blue{color:var(--blue)}.v.navy{color:var(--navy)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:18px}
  .card h2{font-size:17px;margin-bottom:2px}
  .card .cap{font-size:12.5px;color:var(--muted);margin-bottom:14px}

  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:right;padding:9px 10px;border-bottom:1px solid var(--line2)}
  th:first-child,td:first-child{text-align:left}
  thead th{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line)}
  tbody tr:hover{background:#F7F9FC}
  tfoot td{font-weight:700;border-top:2px solid var(--line);border-bottom:none}
  .neg{color:var(--red)}
  .muted{color:var(--muted)}

  /* category bars */
  .catrow{display:grid;grid-template-columns:130px 1fr 90px;align-items:center;gap:12px;padding:6px 0;font-size:13px}
  .bartrack{background:var(--line2);border-radius:6px;height:10px;overflow:hidden}
  .barfill{height:100%;background:var(--red);border-radius:6px}
  .catrow .amt{text-align:right;font-weight:600}

  /* forms */
  .form-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;align-items:end}
  .field{display:flex;flex-direction:column;gap:5px}
  .field.wide{grid-column:span 2}
  label.fl{font-size:11.5px;font-weight:600;color:var(--muted)}
  input,select{font-family:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);width:100%}
  input:focus,select:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:var(--blue)}
  .btn{font-family:inherit;font-size:14px;font-weight:600;padding:9px 16px;border-radius:9px;border:1px solid transparent;cursor:pointer;background:var(--navy);color:#fff}
  .btn:hover{background:#22324e}
  .btn.sec{background:#fff;color:var(--navy);border-color:var(--line)}
  .btn.sec:hover{background:#F4F7FB}
  .btn.danger{background:#fff;color:var(--red);border-color:#F3C9C9}
  .btn.danger:hover{background:var(--red-bg)}
  .btn.sm{padding:5px 10px;font-size:12.5px}

  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
  .pill.ing{background:var(--green-bg);color:var(--green)}
  .pill.gas{background:var(--red-bg);color:var(--red)}
  .pill.aho{background:var(--blue-bg);color:var(--blue)}
  .pill.ret{background:var(--amber-bg);color:var(--amber)}

  .filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin-bottom:14px}
  .filters .field{min-width:130px}

  .empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}

  .matrix-wrap{overflow-x:auto}
  .matrix{min-width:820px;font-size:12.5px}
  .matrix th,.matrix td{padding:7px 8px}
  .matrix td.mono{color:var(--muted)}
  .matrix .totrow td{background:#FCEBEB;font-weight:700;color:var(--red)}
  .matrix .cierre td{background:#F4F7FB}
  .matrix .res td{background:var(--navy);color:#fff;font-weight:700}

  .settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .catlist{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#F4F7FB;border:1px solid var(--line);border-radius:999px;padding:4px 6px 4px 12px;font-size:12.5px}
  .chip button{border:none;background:none;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:0 4px}
  .chip button:hover{color:var(--red)}
  .addcat{display:flex;gap:8px;margin-top:12px}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.25s;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .row-actions{display:flex;gap:6px;justify-content:flex-end}
  .savings-note{font-size:12px;color:var(--muted);background:var(--blue-bg);border:1px solid #CBDBFB;border-radius:10px;padding:10px 12px;margin-top:12px}

  @media(max-width:720px){
    .buckets{grid-template-columns:1fr}
    .kpis{grid-template-columns:1fr 1fr}
    .form-grid{grid-template-columns:1fr 1fr}
    .field.wide{grid-column:span 2}
    .settings-grid{grid-template-columns:1fr}
    .catrow{grid-template-columns:100px 1fr 78px}
    .bucket .big{font-size:26px}
  }
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="brand"><h1>Finanzas<span class="dot">·</span>Personales</h1></div>
    <div class="yearsel">
      <label for="yearSel">Año</label>
      <select id="yearSel"></select>
    </div>
  </div>
</header>

<nav>
  <div class="nwrap">
    <button class="tab active" data-view="resumen">Resumen</button>
    <button class="tab" data-view="movimientos">Movimientos</button>
    <button class="tab" data-view="cierre">Cierre mensual</button>
    <button class="tab" data-view="ajustes">Ajustes</button>
  </div>
</nav>

<main>
  <!-- RESUMEN -->
  <section id="resumen" class="view active"></section>
  <!-- MOVIMIENTOS -->
  <section id="movimientos" class="view"></section>
  <!-- CIERRE -->
  <section id="cierre" class="view"></section>
  <!-- AJUSTES -->
  <section id="ajustes" class="view"></section>
</main>

<div class="toast" id="toast"></div>

<script>
"use strict";
/* ---------- utilidades ---------- */
var CLP = new Intl.NumberFormat('es-CL',{style:'currency',currency:'CLP',maximumFractionDigits:0});
function money(n){ return CLP.format(Math.round(n||0)); }
function pct(n){ return (Math.round((n||0)*1000)/10).toString().replace('.',',')+'%'; }
var MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
var MESES3=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
function todayISO(){ var d=new Date(); return d.toISOString().slice(0,10); }
function esc(s){ return (s==null?'':String(s)).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

/* ---------- estado por defecto (tus datos actuales) ---------- */
var DEFAULT = {
  year: 2026,
  saldoInicialAhorrado: 3515567,
  saldoInicialDisponible: 43765,
  categorias: {
    ingreso: ["Sueldo","Honorarios","Bono / Aguinaldo","Arriendo recibido","Intereses / Dividendos","Devolución impuestos","Venta","Regalo / Transferencia recibida","Reembolso","Otros ingresos"],
    gasto: ["Arriendo / Dividendo","Gastos comunes","Luz","Agua","Gas","Internet hogar","Teléfono","TV cable","Supermercado","Transporte","Bencina","Salud","Educación","Restaurant / Delivery","Entretención","Compras","Suscripciones","Tarjeta de crédito","Créditos / Deudas","Mascotas","Regalos","Impuestos","Otros gastos"],
    ahorro: ["Cuenta de ahorro","Depósito a plazo","Fondo mutuo","APV","Ahorro emergencias","Ahorro vivienda","Otros ahorros"]
  },
  medios: ["Efectivo","Débito","Crédito","Transferencia","Cheque"],
  movimientos: [
    {id:uid(), fecha:"2026-07-21", tipo:"Ingreso", categoria:"Sueldo", descripcion:"Sueldo restante del mes de junio", medio:"Débito", monto:3417},
    {id:uid(), fecha:"2026-07-21", tipo:"Ingreso", categoria:"Otros ingresos", descripcion:"Depósito APV Capital", medio:"Transferencia", monto:42763},
    {id:uid(), fecha:"2026-07-21", tipo:"Gasto", categoria:"Compras", descripcion:"Compra de desayuno", medio:"Débito", monto:2500}
  ]
};

var TIPOS=["Ingreso","Gasto","Ahorro","Retiro ahorro"];
var KEY="finanzas_personales_v1";
var state=load();

function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(raw){ var s=JSON.parse(raw); return normalize(s); }
  }catch(e){}
  return JSON.parse(JSON.stringify(DEFAULT));
}
function normalize(s){
  s=s||{};
  s.year=s.year||2026;
  s.saldoInicialAhorrado=+s.saldoInicialAhorrado||0;
  s.saldoInicialDisponible=+s.saldoInicialDisponible||0;
  s.categorias=s.categorias||{}; 
  s.categorias.ingreso=s.categorias.ingreso||DEFAULT.categorias.ingreso.slice();
  s.categorias.gasto=s.categorias.gasto||DEFAULT.categorias.gasto.slice();
  s.categorias.ahorro=s.categorias.ahorro||DEFAULT.categorias.ahorro.slice();
  s.medios=s.medios||DEFAULT.medios.slice();
  s.movimientos=s.movimientos||[];
  return s;
}
function save(){
  try{ localStorage.setItem(KEY,JSON.stringify(state)); }catch(e){}
}
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1900);
}

/* ---------- cálculos ---------- */
function catsForTipo(tipo){
  if(tipo==='Ingreso') return state.categorias.ingreso;
  if(tipo==='Gasto') return state.categorias.gasto;
  return state.categorias.ahorro; // Ahorro y Retiro ahorro
}
function monthOf(m){ return +m.fecha.slice(5,7); }
function yearOf(m){ return +m.fecha.slice(0,4); }

function sumFilter(fn){ var t=0; state.movimientos.forEach(function(m){ if(fn(m)) t+=(+m.monto||0); }); return t; }

function calc(year){
  var ingMes=[],gasMes=[],ahoMes=[],dispMes=[];
  for(var i=1;i<=12;i++){
    var ing=sumFilter(function(m){return m.tipo==='Ingreso'&&yearOf(m)===year&&monthOf(m)===i;});
    var gas=sumFilter(function(m){return m.tipo==='Gasto'&&yearOf(m)===year&&monthOf(m)===i;});
    var dep=sumFilter(function(m){return m.tipo==='Ahorro'&&yearOf(m)===year&&monthOf(m)===i;});
    var ret=sumFilter(function(m){return m.tipo==='Retiro ahorro'&&yearOf(m)===year&&monthOf(m)===i;});
    ingMes.push(ing); gasMes.push(gas); ahoMes.push(dep-ret); dispMes.push(ing-gas);
  }
  var ingAno=ingMes.reduce(function(a,b){return a+b;},0);
  var gasAno=gasMes.reduce(function(a,b){return a+b;},0);
  var ahoAno=ahoMes.reduce(function(a,b){return a+b;},0);
  var dispAno=ingAno-gasAno;
  // saldos reales (todo el historial)
  var saldoAhorro=state.saldoInicialAhorrado + sumFilter(function(m){return m.tipo==='Ahorro';}) - sumFilter(function(m){return m.tipo==='Retiro ahorro';});
  var saldoDisp=state.saldoInicialDisponible + sumFilter(function(m){return m.tipo==='Ingreso';}) - sumFilter(function(m){return m.tipo==='Gasto';});
  // ahorro acumulado por mes hasta hoy
  var hoy=new Date(); var acumInicio=state.saldoInicialAhorrado
      + sumFilter(function(m){return m.tipo==='Ahorro'&&yearOf(m)<year;})
      - sumFilter(function(m){return m.tipo==='Retiro ahorro'&&yearOf(m)<year;});
  var acum=[],run=acumInicio;
  for(var j=0;j<12;j++){
    run+=ahoMes[j];
    var esFuturo=new Date(year,j,1)>hoy;
    acum.push(esFuturo?null:run);
  }
  return {ingMes:ingMes,gasMes:gasMes,ahoMes:ahoMes,dispMes:dispMes,ingAno:ingAno,gasAno:gasAno,ahoAno:ahoAno,dispAno:dispAno,saldoAhorro:saldoAhorro,saldoDisp:saldoDisp,acum:acum};
}
function gastoPorCategoria(year){
  var map={};
  state.categorias.gasto.forEach(function(c){map[c]=0;});
  state.movimientos.forEach(function(m){
    if(m.tipo==='Gasto'&&yearOf(m)===year){ if(!(m.categoria in map)) map[m.categoria]=0; map[m.categoria]+=(+m.monto||0); }
  });
  return map;
}
function gastoCatMes(year){ // {cat:{mes:monto}}
  var res={};
  state.categorias.gasto.forEach(function(c){ res[c]={}; });
  state.movimientos.forEach(function(m){
    if(m.tipo==='Gasto'&&yearOf(m)===year){
      if(!res[m.categoria]) res[m.categoria]={};
      var mm=monthOf(m); res[m.categoria][mm]=(res[m.categoria][mm]||0)+(+m.monto||0);
    }
  });
  return res;
}

/* ---------- render: RESUMEN ---------- */
function renderResumen(){
  var y=state.year, c=calc(y);
  var el=document.getElementById('resumen');
  // gastos por categoria (ordenado desc, solo >0)
  var gc=gastoPorCategoria(y);
  var arr=Object.keys(gc).map(function(k){return{cat:k,val:gc[k]};}).filter(function(o){return o.val>0;}).sort(function(a,b){return b.val-a.val;});
  var maxCat=arr.length?arr[0].val:0;
  var tasaAhorro=c.ingAno>0?c.ahoAno/c.ingAno:0;

  var html='';
  html+='<div class="buckets">'
      + '<div class="bucket disp"><div class="eyebrow">Sueldo disponible</div><div class="big num">'+money(c.saldoDisp)+'</div><div class="sub">Saldo real en tu cuenta / efectivo hoy · independiente del ahorro</div></div>'
      + '<div class="bucket aho"><div class="eyebrow">Ahorro</div><div class="big num">'+money(c.saldoAhorro)+'</div><div class="sub">Saldo total guardado hoy · no se mezcla con el sueldo</div></div>'
      + '</div>';

  html+='<div class="kpis">'
      + kpi('Ingresos '+y,money(c.ingAno),'green')
      + kpi('Gastos '+y,money(c.gasAno),'red')
      + kpi('Ahorro neto '+y,money(c.ahoAno),'blue')
      + kpi('Disponible '+y+' (Ing − Gas)',money(c.dispAno),'navy')
      + '</div>';

  // tabla mensual
  html+='<div class="card"><h2>Detalle mensual '+y+'</h2><div class="cap">Tasa de ahorro del año: <strong>'+pct(tasaAhorro)+'</strong></div>';
  html+='<table><thead><tr><th>Mes</th><th>Ingresos</th><th>Gastos</th><th>Ahorro neto</th><th>Disponible</th><th>Ahorro acum.</th></tr></thead><tbody>';
  for(var i=0;i<12;i++){
    var disp=c.dispMes[i];
    html+='<tr><td>'+MESES[i]+'</td>'
       +'<td class="num">'+money(c.ingMes[i])+'</td>'
       +'<td class="num">'+money(c.gasMes[i])+'</td>'
       +'<td class="num'+(c.ahoMes[i]<0?' neg':'')+'">'+money(c.ahoMes[i])+'</td>'
       +'<td class="num'+(disp<0?' neg':'')+'">'+money(disp)+'</td>'
       +'<td class="num muted">'+(c.acum[i]==null?'—':money(c.acum[i]))+'</td></tr>';
  }
  html+='</tbody><tfoot><tr><td>Total</td>'
     +'<td class="num">'+money(c.ingAno)+'</td>'
     +'<td class="num">'+money(c.gasAno)+'</td>'
     +'<td class="num'+(c.ahoAno<0?' neg':'')+'">'+money(c.ahoAno)+'</td>'
     +'<td class="num'+(c.dispAno<0?' neg':'')+'">'+money(c.dispAno)+'</td>'
     +'<td class="num">'+money(c.saldoAhorro)+'</td></tr></tfoot></table></div>';

  // gastos por categoria
  html+='<div class="card"><h2>Gastos por categoría '+y+'</h2><div class="cap">En qué se te va la plata este año</div>';
  if(arr.length===0){ html+='<div class="empty">Aún no hay gastos registrados este año. Anótalos en <strong>Movimientos</strong>.</div>'; }
  else{
    arr.forEach(function(o){
      var w=maxCat>0?Math.max(3,Math.round(o.val/maxCat*100)):0;
      html+='<div class="catrow"><div>'+esc(o.cat)+'</div><div class="bartrack"><div class="barfill" style="width:'+w+'%"></div></div><div class="amt num">'+money(o.val)+'</div></div>';
    });
  }
  html+='</div>';

  el.innerHTML=html;
}
function kpi(label,val,cls){
  return '<div class="kpi"><div class="eyebrow">'+esc(label)+'</div><div class="v '+cls+' num">'+val+'</div></div>';
}

/* ---------- render: MOVIMIENTOS ---------- */
var filtro={mes:'todos',tipo:'todos'};
function renderMovimientos(){
  var el=document.getElementById('movimientos');
  var y=state.year;
  var html='';
  // formulario
  html+='<div class="card"><h2>Nuevo movimiento</h2><div class="cap">Registra cada compra, gasto, ingreso o movimiento de ahorro del día a día.</div>';
  html+='<div class="form-grid" id="frm">'
      + fld('Fecha','<input type="date" id="f_fecha" value="'+todayISO()+'">')
      + fld('Tipo','<select id="f_tipo">'+TIPOS.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select>')
      + fld('Categoría','<select id="f_cat"></select>')
      + fld('Descripción','<input type="text" id="f_desc" placeholder="Ej: bencina Copec, almuerzo, farmacia…">',true)
      + fld('Medio','<select id="f_medio">'+state.medios.map(function(t){return '<option>'+t+'</option>';}).join('')+'</select>')
      + fld('Monto','<input type="number" id="f_monto" placeholder="0" min="0" step="1">')
      + '<div class="field"><label class="fl">&nbsp;</label><button class="btn" id="f_add">Agregar</button></div>'
      + '</div></div>';

  // filtros
  html+='<div class="card"><h2>Movimientos '+y+'</h2>';
  html+='<div class="filters">'
      + fld('Mes','<select id="flt_mes"><option value="todos">Todos</option>'+MESES.map(function(m,i){return '<option value="'+(i+1)+'"'+(filtro.mes==String(i+1)?' selected':'')+'>'+m+'</option>';}).join('')+'</select>')
      + fld('Tipo','<select id="flt_tipo"><option value="todos">Todos</option>'+TIPOS.map(function(t){return '<option'+(filtro.tipo==t?' selected':'')+'>'+t+'</option>';}).join('')+'</select>')
      + '</div>';
  var list=state.movimientos.filter(function(m){return yearOf(m)===y;})
      .filter(function(m){return filtro.mes==='todos'||monthOf(m)===+filtro.mes;})
      .filter(function(m){return filtro.tipo==='todos'||m.tipo===filtro.tipo;})
      .sort(function(a,b){return a.fecha<b.fecha?1:-1;});
  if(list.length===0){ html+='<div class="empty">No hay movimientos con estos filtros.</div>'; }
  else{
    html+='<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Categoría</th><th>Descripción</th><th>Medio</th><th>Monto</th><th></th></tr></thead><tbody>';
    list.forEach(function(m){
      html+='<tr><td class="num">'+fmtFecha(m.fecha)+'</td>'
         +'<td>'+pill(m.tipo)+'</td>'
         +'<td>'+esc(m.categoria)+'</td>'
         +'<td class="muted">'+esc(m.descripcion)+'</td>'
         +'<td class="muted">'+esc(m.medio)+'</td>'
         +'<td class="num" style="color:'+colorTipo(m.tipo)+';font-weight:600">'+money(m.monto)+'</td>'
         +'<td><div class="row-actions"><button class="btn sec sm" data-edit="'+m.id+'">Editar</button><button class="btn danger sm" data-del="'+m.id+'">Borrar</button></div></td></tr>';
    });
    html+='</tbody></table>';
  }
  html+='</div>';
  el.innerHTML=html;

  // poblar categorías según tipo
  var selTipo=document.getElementById('f_tipo');
  function fillCats(){
    var cats=catsForTipo(selTipo.value);
    document.getElementById('f_cat').innerHTML=cats.map(function(c){return '<option>'+esc(c)+'</option>';}).join('');
  }
  selTipo.addEventListener('change',fillCats); fillCats();

  document.getElementById('f_add').addEventListener('click',addMov);
  document.getElementById('flt_mes').addEventListener('change',function(){filtro.mes=this.value;renderMovimientos();});
  document.getElementById('flt_tipo').addEventListener('change',function(){filtro.tipo=this.value;renderMovimientos();});
  el.querySelectorAll('[data-del]').forEach(function(b){b.addEventListener('click',function(){delMov(b.getAttribute('data-del'));});});
  el.querySelectorAll('[data-edit]').forEach(function(b){b.addEventListener('click',function(){editMov(b.getAttribute('data-edit'));});});
}
function fld(label,inner,wide){ return '<div class="field'+(wide?' wide':'')+'"><label class="fl">'+label+'</label>'+inner+'</div>'; }
function fmtFecha(iso){ var p=iso.split('-'); return p[2]+'-'+p[1]+'-'+p[0]; }
function pill(t){ var m={'Ingreso':'ing','Gasto':'gas','Ahorro':'aho','Retiro ahorro':'ret'}; return '<span class="pill '+m[t]+'">'+t+'</span>'; }
function colorTipo(t){ return {'Ingreso':'var(--green)','Gasto':'var(--red)','Ahorro':'var(--blue)','Retiro ahorro':'var(--amber)'}[t]; }

function addMov(){
  var fecha=document.getElementById('f_fecha').value;
  var tipo=document.getElementById('f_tipo').value;
  var cat=document.getElementById('f_cat').value;
  var desc=document.getElementById('f_desc').value.trim();
  var medio=document.getElementById('f_medio').value;
  var monto=Math.round(+document.getElementById('f_monto').value||0);
  if(!fecha){ toast('Pon una fecha'); return; }
  if(monto<=0){ toast('Pon un monto mayor a 0'); return; }
  state.movimientos.push({id:uid(),fecha:fecha,tipo:tipo,categoria:cat,descripcion:desc,medio:medio,monto:monto});
  save(); toast('Movimiento agregado'); renderMovimientos();
}
function delMov(id){
  if(!confirm('¿Borrar este movimiento?')) return;
  state.movimientos=state.movimientos.filter(function(m){return m.id!==id;});
  save(); toast('Movimiento borrado'); renderMovimientos();
}
function editMov(id){
  var m=state.movimientos.find(function(x){return x.id===id;}); if(!m) return;
  var nf=prompt('Fecha (AAAA-MM-DD):',m.fecha); if(nf===null) return;
  var nmonto=prompt('Monto:',m.monto); if(nmonto===null) return;
  var ndesc=prompt('Descripción:',m.descripcion); if(ndesc===null) return;
  m.fecha=nf.trim()||m.fecha; m.monto=Math.round(+nmonto||m.monto); m.descripcion=ndesc.trim();
  save(); toast('Movimiento actualizado'); renderMovimientos();
}

/* ---------- render: CIERRE ---------- */
function renderCierre(){
  var el=document.getElementById('cierre');
  var y=state.year, c=calc(y);
  var cm=gastoCatMes(y);
  var cats=state.categorias.gasto;
  var totMes=new Array(12).fill(0), totAnoGeneral=0;

  var html='<div class="card"><h2>Cierre mensual y anual '+y+'</h2><div class="cap">Tus gastos desglosados por categoría, mes a mes. El detalle de cada compra está en Movimientos.</div>';
  html+='<div class="matrix-wrap"><table class="matrix"><thead><tr><th>Categoría</th>';
  MESES3.forEach(function(m){html+='<th>'+m+'</th>';});
  html+='<th>Total año</th></tr></thead><tbody>';
  cats.forEach(function(cat){
    var row=cm[cat]||{}, tot=0;
    var cells='';
    for(var i=1;i<=12;i++){ var v=row[i]||0; tot+=v; totMes[i-1]+=v; cells+='<td class="num'+(v?'':' mono')+'">'+(v?money(v):'·')+'</td>'; }
    totAnoGeneral+=tot;
    html+='<tr><td>'+esc(cat)+'</td>'+cells+'<td class="num" style="font-weight:600">'+(tot?money(tot):'·')+'</td></tr>';
  });
  html+='</tbody><tfoot><tr class="totrow"><td>TOTAL GASTOS</td>';
  for(var i=0;i<12;i++){ html+='<td class="num">'+money(totMes[i])+'</td>'; }
  html+='<td class="num">'+money(totAnoGeneral)+'</td></tr></tfoot></table></div></div>';

  // bloque cierre resumen
  html+='<div class="card"><h2>Resultado por mes</h2><div class="cap">Ingresos, gastos, ahorro y resultado de cada mes.</div>';
  html+='<div class="matrix-wrap"><table class="matrix"><thead><tr><th>Concepto</th>';
  MESES3.forEach(function(m){html+='<th>'+m+'</th>';});
  html+='<th>Total año</th></tr></thead><tbody>';
  html+=cierreRow('Ingresos',c.ingMes,c.ingAno);
  html+=cierreRow('Gastos',c.gasMes,c.gasAno);
  html+=cierreRow('Ahorro neto',c.ahoMes,c.ahoAno);
  // resultado
  var resMes=c.dispMes;
  html+='<tr class="res"><td>Resultado (Ing − Gas)</td>';
  for(var k=0;k<12;k++){ html+='<td class="num">'+money(resMes[k])+'</td>'; }
  html+='<td class="num">'+money(c.dispAno)+'</td></tr>';
  html+='</tbody></table></div></div>';

  el.innerHTML=html;
}
function cierreRow(label,arr,tot){
  var h='<tr class="cierre"><td>'+label+'</td>';
  for(var i=0;i<12;i++){ h+='<td class="num'+(arr[i]<0?' neg':'')+'">'+money(arr[i])+'</td>'; }
  h+='<td class="num" style="font-weight:700">'+money(tot)+'</td></tr>';
  return h;
}

/* ---------- render: AJUSTES ---------- */
function renderAjustes(){
  var el=document.getElementById('ajustes');
  var html='';
  html+='<div class="card"><h2>Saldos iniciales</h2><div class="cap">Lo que ya tenías antes de empezar a registrar en la app.</div>';
  html+='<div class="settings-grid">'
     + '<div class="field"><label class="fl">Saldo inicial ya ahorrado</label><input type="number" id="s_aho" value="'+state.saldoInicialAhorrado+'"></div>'
     + '<div class="field"><label class="fl">Saldo inicial disponible (en cuenta)</label><input type="number" id="s_disp" value="'+state.saldoInicialDisponible+'"></div>'
     + '</div>';
  html+='<div style="margin-top:14px"><button class="btn" id="s_save">Guardar saldos</button></div>';
  html+='<div class="savings-note">El <strong>ahorro</strong> y el <strong>sueldo disponible</strong> se llevan como dos bolsas separadas: registrar un ahorro no descuenta tu sueldo, y gastar del sueldo no toca tu ahorro.</div>';
  html+='</div>';

  html+='<div class="card"><h2>Categorías de gasto</h2><div class="cap">Agrega o quita categorías para clasificar tus gastos.</div>';
  html+='<div class="catlist" id="catlist_gasto"></div>';
  html+='<div class="addcat"><input type="text" id="newcat_gasto" placeholder="Nueva categoría de gasto"><button class="btn sec" id="addcat_gasto">Agregar</button></div>';
  html+='</div>';

  html+='<div class="card"><h2>Categorías de ingreso</h2>';
  html+='<div class="catlist" id="catlist_ingreso"></div>';
  html+='<div class="addcat"><input type="text" id="newcat_ingreso" placeholder="Nueva categoría de ingreso"><button class="btn sec" id="addcat_ingreso">Agregar</button></div>';
  html+='</div>';

  html+='<div class="card"><h2>Destinos de ahorro</h2>';
  html+='<div class="catlist" id="catlist_ahorro"></div>';
  html+='<div class="addcat"><input type="text" id="newcat_ahorro" placeholder="Nuevo destino de ahorro"><button class="btn sec" id="addcat_ahorro">Agregar</button></div>';
  html+='</div>';

  html+='<div class="card"><h2>Datos</h2><div class="cap">Respalda o restablece tu información.</div>';
  html+='<div style="display:flex;gap:10px;flex-wrap:wrap">'
     + '<button class="btn sec" id="exp_json">Exportar respaldo (.json)</button>'
     + '<button class="btn sec" id="exp_csv">Exportar movimientos (.csv)</button>'
     + '<button class="btn sec" id="imp_btn">Importar respaldo</button>'
     + '<input type="file" id="imp_file" accept=".json" style="display:none">'
     + '<button class="btn danger" id="reset_btn">Restablecer todo</button>'
     + '</div></div>';

  el.innerHTML=html;

  renderChips('gasto'); renderChips('ingreso'); renderChips('ahorro');
  document.getElementById('s_save').addEventListener('click',function(){
    state.saldoInicialAhorrado=Math.round(+document.getElementById('s_aho').value||0);
    state.saldoInicialDisponible=Math.round(+document.getElementById('s_disp').value||0);
    save(); toast('Saldos guardados');
  });
  ['gasto','ingreso','ahorro'].forEach(function(k){
    document.getElementById('addcat_'+k).addEventListener('click',function(){
      var v=document.getElementById('newcat_'+k).value.trim();
      if(!v) return;
      if(state.categorias[k].indexOf(v)>=0){ toast('Ya existe'); return; }
      state.categorias[k].push(v); save(); renderAjustes(); toast('Categoría agregada');
    });
  });
  document.getElementById('exp_json').addEventListener('click',exportJSON);
  document.getElementById('exp_csv').addEventListener('click',exportCSV);
  document.getElementById('imp_btn').addEventListener('click',function(){document.getElementById('imp_file').click();});
  document.getElementById('imp_file').addEventListener('change',importJSON);
  document.getElementById('reset_btn').addEventListener('click',function(){
    if(confirm('Esto borra todos tus datos y vuelve al inicio. ¿Continuar?')){
      state=JSON.parse(JSON.stringify(DEFAULT)); save(); buildYearSel(); renderAll(); toast('Datos restablecidos');
    }
  });
}
function renderChips(kind){
  var box=document.getElementById('catlist_'+kind);
  box.innerHTML=state.categorias[kind].map(function(c){
    return '<span class="chip">'+esc(c)+'<button data-k="'+kind+'" data-c="'+esc(c)+'">×</button></span>';
  }).join('');
  box.querySelectorAll('button').forEach(function(b){
    b.addEventListener('click',function(){
      var k=b.getAttribute('data-k'), c=b.getAttribute('data-c');
      state.categorias[k]=state.categorias[k].filter(function(x){return x!==c;});
      save(); renderChips(k); toast('Categoría quitada');
    });
  });
}
function exportJSON(){
  var blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
  downloadBlob(blob,'finanzas_respaldo.json'); toast('Respaldo exportado');
}
function exportCSV(){
  var rows=[['Fecha','Tipo','Categoria','Descripcion','Medio','Monto']];
  state.movimientos.slice().sort(function(a,b){return a.fecha<b.fecha?-1:1;}).forEach(function(m){
    rows.push([m.fecha,m.tipo,m.categoria,m.descripcion,m.medio,m.monto]);
  });
  var csv=rows.map(function(r){return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"';}).join(';');}).join('\n');
  downloadBlob(new Blob(['\ufeff'+csv],{type:'text/csv'}),'movimientos.csv'); toast('CSV exportado');
}
function importJSON(e){
  var f=e.target.files[0]; if(!f) return;
  var r=new FileReader();
  r.onload=function(){ try{ var s=normalize(JSON.parse(r.result)); state=s; save(); buildYearSel(); renderAll(); toast('Respaldo importado'); }catch(err){ toast('Archivo inválido'); } };
  r.readAsText(f); e.target.value='';
}
function downloadBlob(blob,name){
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}

/* ---------- navegación / init ---------- */
function buildYearSel(){
  var years={}; years[state.year]=1; years[new Date().getFullYear()]=1;
  state.movimientos.forEach(function(m){years[yearOf(m)]=1;});
  var list=Object.keys(years).map(Number).sort();
  var sel=document.getElementById('yearSel');
  sel.innerHTML=list.map(function(y){return '<option value="'+y+'"'+(y===state.year?' selected':'')+'>'+y+'</option>';}).join('');
}
function renderAll(){ renderResumen(); renderMovimientos(); renderCierre(); renderAjustes(); }

document.getElementById('yearSel').addEventListener('change',function(){ state.year=+this.value; save(); renderAll(); });
document.querySelectorAll('.tab').forEach(function(t){
  t.addEventListener('click',function(){
    document.querySelectorAll('.tab').forEach(function(x){x.classList.remove('active');});
    document.querySelectorAll('.view').forEach(function(x){x.classList.remove('active');});
    t.classList.add('active');
    document.getElementById(t.getAttribute('data-view')).classList.add('active');
  });
});

buildYearSel();
renderAll();
</script>
</body>
</html>
